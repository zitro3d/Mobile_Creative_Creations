<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a0808">
  <title>Cargo Drift — Canyon Anchor (Ship 1)</title>
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      background: #0a0408; color: #f4d8a0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      width: 100%; height: 100%;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      width: 100vw; height: 100vh; height: 100dvh;
    }
    #wrap {
      position: relative;
      width: 100%; height: 100%;
    }
    #c {
      display: block;
      position: absolute; left: 0; top: 0;
      width: 100%; height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #hud {
      position: absolute; left: 0; right: 0; top: 0;
      padding: max(12px, env(safe-area-inset-top)) 14px 0 14px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
      font-size: 12px; letter-spacing: 0.06em;
      color: #ffd83d;
      text-shadow: 0 1px 2px #000, 0 0 6px #1a0408;
    }
    #title { font-weight: 800; }
    #info  { opacity: 0.85; }
    #help {
      position: absolute; left: 0; right: 0;
      bottom: max(18px, env(safe-area-inset-bottom));
      text-align: center;
      pointer-events: none;
      font-size: 12px; opacity: 0.8;
      color: #f4d8a0;
      text-shadow: 0 1px 2px #000;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="title">CARGO DRIFT — CANYON ANCHOR</div>
      <div id="info">Ship 3 · bandit &amp; EMP</div>
    </div>
    <div id="help">Bandit hijacks cells. Grab the PURPLE GEM to stun &amp; recover.</div>
  </div>

<script>
(function () {
  // ---- Logical canvas size (portrait). The CSS scales the canvas to
  // fit the viewport while we render to a fixed pixel grid so the look
  // stays consistent on every device.
  const W = 360;
  const H = 640;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  canvas.width = W;
  canvas.height = H;

  function fitCanvas() {
    // Fit the canvas to the viewport while preserving the W:H aspect.
    const wrap = document.getElementById('wrap');
    const ww = wrap.clientWidth;
    const wh = wrap.clientHeight;
    const scale = Math.min(ww / W, wh / H);
    const dispW = Math.round(W * scale);
    const dispH = Math.round(H * scale);
    canvas.style.width  = dispW + 'px';
    canvas.style.height = dispH + 'px';
    canvas.style.left   = Math.round((ww - dispW) / 2) + 'px';
    canvas.style.top    = Math.round((wh - dispH) / 2) + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  // ---- Physics constants (tunable; the whole point of Ship 1 is to
  // dial these in until the tap-flap-thrust feel is right).
  const GRAVITY     = 0.42;        // per-frame downward pull on vy
  const MAX_FALL    = 9.0;         // terminal vy
  const LIFT        = -6.5;        // vy on tap (upward burst)
  const FORWARD     = 3.4;         // vx set on tap (rightward push)
  const VX_DECAY    = 0.965;       // per-frame horizontal drag
  const MAX_VX      = 5.0;
  const SHIP_W      = 18;
  const SHIP_H      = 14;

  // ---- Level geometry — Ship 1 is a single chamber. Walls are solid
  // rocky pillars + the floor, ceiling, and side-walls of the chamber.
  // No bandits, no collectibles, no scroll yet — just a space to fly
  // around in to feel the controls out.
  const WALL_COLOR_BASE  = '#7a3014';
  const WALL_COLOR_LIGHT = '#a85020';
  const WALL_COLOR_DARK  = '#3a1408';
  const SKY_TOP          = '#3a1422';
  const SKY_MID          = '#7a3a26';
  const SKY_BOT          = '#c87038';

  // Each wall is an axis-aligned rectangle {x, y, w, h}. Ship 1 keeps
  // collision simple — AABB only. Ship 2+ can move to polygon walls
  // for the 45° ramps.
  const walls = [
    // Outer chamber bounds — left, right, top, bottom
    { x: 0,          y: 0,          w: 24,  h: H,          rocky: true  }, // left wall
    { x: W - 24,     y: 0,          w: 24,  h: H,          rocky: true  }, // right wall
    { x: 0,          y: 0,          w: W,   h: 28,         rocky: true  }, // ceiling
    { x: 0,          y: H - 36,     w: W,   h: 36,         rocky: true  }, // floor
    // Two interior pillars for navigation feel
    { x: 110,        y: H - 36 - 120, w: 36, h: 120,       rocky: true  }, // ground pillar L
    { x: W - 110-36, y: 28,         w: 36,  h: 140,        rocky: true  }, // hanging pillar R
    // Anchor outpost solid body — bottom-right, treated as a wall so
    // the ship can't fly through it. The DELIVERY ZONE sits ABOVE
    // this body (handled separately), so the player has to fly OVER
    // the dock, not into it.
    { x: 280,        y: H - 36 - 70, w: 40, h: 70,         outpost: true },
  ];

  // ---- Stabilization Cells — three blue gems scattered along the
  // natural rightward-rising arc the controls produce. Player has to
  // pick all three up and drop them at the anchor outpost.
  const CELL_R       = 7;
  const CELL_PICK_R  = 22;     // pickup distance (ship → cell) — generous
  // All three cells sit on the same natural rising arc that a steady
  // moderate tap rhythm produces (~slope 1.55 vert/horiz). Player
  // taps at one consistent cadence and the ship glides through each
  // cell on the way up — no need to backtrack or change tempo.
  const cells = [
    { x:  90, y: 479, collected: false, bobPhase: 0.0 },
    { x: 160, y: 374, collected: false, bobPhase: 1.5 },
    { x: 240, y: 254, collected: false, bobPhase: 3.0 },
  ];
  let heldCells       = 0;     // cells the rig is carrying right now
  let deliveredCells  = 0;     // cells dropped at the anchor (max 3)
  let stabilized      = false; // win flag
  let stabilizedAt    = 0;     // frame when stabilized fired

  // Anchor outpost — its solid body is in `walls` above; this object
  // also defines the (non-colliding) DELIVERY ZONE that sits above it.
  const outpost = {
    x: 280, y: H - 36 - 70, w: 40, h: 70,
    // Delivery zone (looser than the body so docking isn't pixel-perfect)
    zone: { x: 268, y: H - 36 - 70 - 60, w: 64, h: 60 },
  };

  // ---- BANDIT — flying skull-bat that hijacks cells off the rig.
  // Cruises across the top of the chamber once the player has cargo;
  // dives when the rig's x lines up; on contact it steals one cell and
  // returns to its base. Picking up the purple Retrieval Gem fires an
  // EMP that stuns the bandit and drops the stolen cell at its base
  // for the player to recover.
  const BANDIT_BASE_X     = 180;          // top-middle, between pillars
  const BANDIT_BASE_Y     = 60;
  const BANDIT_CRUISE_VX  = 1.6;
  const BANDIT_DIVE_SPD   = 4.5;
  const HIJACK_R          = 18;            // collision radius for hijack
  const STUN_FRAMES       = 180;           // 3 sec stun on EMP
  const bandit = {
    x: BANDIT_BASE_X, y: BANDIT_BASE_Y,
    vx: BANDIT_CRUISE_VX, vy: 0,
    state: 'idle',   // idle | cruise | dive | celebrate | retreat | stunned
    stateFrames: 0,
    stolen: 0,        // cells the bandit currently holds
    spinAngle: 0,     // for the celebration spin
    active: false,    // true once the player has held a cell
  };

  // Purple Retrieval Gem — spawns ONCE per hijack at a fixed reachable
  // spot (chosen so the player's natural rising arc passes near it).
  // Pickup fires the EMP; the gem then despawns until the next hijack.
  const PURPLE_GEM_SPOT = { x: 110, y: 200 };
  let purpleGem = null;     // { x, y, bobPhase } when present, else null

  // Cells dropped at the bandit's base after an EMP. Player picks
  // these up to restore held-cell count.
  const droppedCells = [];  // { x, y, bobPhase }

  // ---- EMP visual — a brief expanding ring on stun
  let empPulseAt = -999;

  // ---- Ship state
  const startX = 60;
  const startY = H - 36 - 80;
  const ship = {
    x: startX, y: startY,
    vx: 0, vy: 0,
    rot: 0,
    thruster: 0,             // counts down after each tap (for flame render)
    deaths: 0,
    invuln: 0,               // post-respawn i-frames
  };

  // ---- Input — single tap anywhere on the screen
  function flap() {
    if (stabilized) return;
    ship.vy = LIFT;
    // Tap sets vx (doesn't add) — keeps top speed predictable + lets
    // the ship coast then re-thrust cleanly.
    ship.vx = Math.max(ship.vx, FORWARD);
    ship.thruster = 8;
  }
  function onPointer(e) {
    if (e.cancelable) e.preventDefault();
    flap();
  }
  canvas.addEventListener('pointerdown', onPointer, { passive: false });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      flap();
    }
  });

  function respawn() {
    ship.x = startX;
    ship.y = startY;
    ship.vx = 0;
    ship.vy = 0;
    ship.rot = 0;
    ship.thruster = 0;
    ship.deaths++;
    ship.invuln = 60;
  }

  // ---- Collision: ship AABB vs wall AABB
  function shipHits(wall) {
    return (
      ship.x - SHIP_W / 2 < wall.x + wall.w &&
      ship.x + SHIP_W / 2 > wall.x &&
      ship.y - SHIP_H / 2 < wall.y + wall.h &&
      ship.y + SHIP_H / 2 > wall.y
    );
  }

  // ---- Game loop
  let frame = 0;
  function update() {
    frame++;
    // Once the player wins, freeze ship physics so the celebration
    // banner lands cleanly instead of the ship crashing into the
    // outpost top right after delivery.
    if (stabilized) {
      ship.vx = 0;
      ship.vy = 0;
      if (ship.thruster > 0) ship.thruster--;
      return;
    }
    // Physics
    ship.vy += GRAVITY;
    if (ship.vy > MAX_FALL) ship.vy = MAX_FALL;
    ship.vx *= VX_DECAY;
    if (Math.abs(ship.vx) < 0.02) ship.vx = 0;
    if (ship.vx > MAX_VX) ship.vx = MAX_VX;
    ship.x += ship.vx;
    ship.y += ship.vy;

    // Rotation drives off vy (nose up on rise, nose down on fall).
    const targetRot = Math.max(-0.6, Math.min(1.0, ship.vy * 0.10));
    ship.rot += (targetRot - ship.rot) * 0.18;

    if (ship.thruster > 0) ship.thruster--;
    if (ship.invuln > 0)   ship.invuln--;

    // Wall collisions — Ship 1 just respawns. Ship 2+ can swap to
    // proper resolve-and-slide.
    if (ship.invuln === 0) {
      for (const w of walls) {
        if (shipHits(w)) {
          respawn();
          break;
        }
      }
    }

    // Hard bounds (defensive — the chamber walls should already catch this)
    if (ship.x < -20 || ship.x > W + 20 || ship.y > H + 60) respawn();

    // ---- Cell pickup: ship overlap with each remaining cell.
    for (const c of cells) {
      if (c.collected) continue;
      const dx = ship.x - c.x;
      const dy = ship.y - c.y;
      const r  = CELL_PICK_R + SHIP_W * 0.4;
      if (dx * dx + dy * dy < r * r) {
        c.collected = true;
        heldCells++;
      }
    }

    // ---- Delivery: ship in the outpost's delivery zone.
    if (heldCells > 0 && !stabilized) {
      const z = outpost.zone;
      if (ship.x > z.x && ship.x < z.x + z.w
          && ship.y > z.y && ship.y < z.y + z.h) {
        deliveredCells += heldCells;
        heldCells = 0;
        if (deliveredCells >= 3) {
          stabilized = true;
          stabilizedAt = frame;
        }
      }
    }

    // ---- BANDIT AI -------------------------------------------------
    // Activate the bandit the first time the player picks up a cell.
    if (!bandit.active && heldCells > 0) {
      bandit.active = true;
      bandit.state = 'cruise';
      bandit.stateFrames = 0;
      bandit.x = BANDIT_BASE_X;
      bandit.y = BANDIT_BASE_Y;
      bandit.vx = BANDIT_CRUISE_VX;
    }

    if (bandit.active) {
      bandit.stateFrames++;

      if (bandit.state === 'cruise') {
        // Sweep horizontally between the two pillars at altitude ~60.
        bandit.x += bandit.vx;
        // Patrol band: x from 150 (just right of floor pillar) to 210
        // (just left of hanging pillar). Stays in the open-top corridor.
        if (bandit.x < 150 || bandit.x > 210) {
          bandit.vx *= -1;
          bandit.x += bandit.vx;
        }
        bandit.y = BANDIT_BASE_Y + Math.sin(frame * 0.06) * 6;
        // Dive trigger: player has cells AND is below the bandit AND
        // their x is roughly aligned. Re-arm dive 60 frames after any
        // state change to give the player breathing room.
        if (heldCells > 0
            && bandit.stateFrames > 60
            && ship.y > bandit.y + 80
            && Math.abs(ship.x - bandit.x) < 60) {
          bandit.state = 'dive';
          bandit.stateFrames = 0;
        }

      } else if (bandit.state === 'dive') {
        // Track the player's CURRENT position each frame — making it
        // a real threat the player has to dodge by changing altitude
        // mid-tap.
        const dx = ship.x - bandit.x;
        const dy = ship.y - bandit.y;
        const len = Math.hypot(dx, dy) || 1;
        bandit.vx = (dx / len) * BANDIT_DIVE_SPD;
        bandit.vy = (dy / len) * BANDIT_DIVE_SPD;
        bandit.x += bandit.vx;
        bandit.y += bandit.vy;

        // Hijack on contact — but only steal if the player has cells
        // AND no purple gem is currently spawned (so multiple hijacks
        // don't pile up on each other while a gem is active).
        if (heldCells > 0 && purpleGem === null
            && Math.abs(ship.x - bandit.x) < HIJACK_R
            && Math.abs(ship.y - bandit.y) < HIJACK_R) {
          heldCells--;
          bandit.stolen++;
          bandit.state = 'celebrate';
          bandit.stateFrames = 0;
          bandit.spinAngle = 0;
          // Spawn the retrieval gem at its fixed spot
          purpleGem = { x: PURPLE_GEM_SPOT.x, y: PURPLE_GEM_SPOT.y,
                        bobPhase: 0 };
        }
        // Bandit ran off the bottom — abort, retreat
        if (bandit.y > H - 60 || bandit.stateFrames > 90) {
          bandit.state = 'retreat';
          bandit.stateFrames = 0;
        }

      } else if (bandit.state === 'celebrate') {
        // Spin in place + drift back toward base
        bandit.spinAngle += 0.30;
        bandit.x += (BANDIT_BASE_X - bandit.x) * 0.06;
        bandit.y += (BANDIT_BASE_Y - bandit.y) * 0.06;
        if (bandit.stateFrames > 40) {
          bandit.state = 'cruise';
          bandit.stateFrames = 0;
          bandit.vx = BANDIT_CRUISE_VX;
          bandit.spinAngle = 0;
        }

      } else if (bandit.state === 'retreat') {
        bandit.x += (BANDIT_BASE_X - bandit.x) * 0.08;
        bandit.y += (BANDIT_BASE_Y - bandit.y) * 0.08;
        if (bandit.stateFrames > 30) {
          bandit.state = 'cruise';
          bandit.stateFrames = 0;
          bandit.vx = BANDIT_CRUISE_VX;
        }

      } else if (bandit.state === 'stunned') {
        // Drift toward base while grayed out. On the FIRST stunned
        // frame, drop every stolen cell at the base for the player
        // to recover.
        if (bandit.stateFrames === 1 && bandit.stolen > 0) {
          for (let i = 0; i < bandit.stolen; i++) {
            droppedCells.push({
              x: BANDIT_BASE_X + (i - 0.5) * 14,
              y: BANDIT_BASE_Y + 18 + i * 3,
              bobPhase: i * 1.7,
            });
          }
          bandit.stolen = 0;
        }
        // Slow gentle drift toward base
        bandit.x += (BANDIT_BASE_X - bandit.x) * 0.03;
        bandit.y += (BANDIT_BASE_Y - bandit.y) * 0.03;
        if (bandit.stateFrames > STUN_FRAMES) {
          bandit.state = 'cruise';
          bandit.stateFrames = 0;
          bandit.vx = BANDIT_CRUISE_VX;
        }
      }
    }

    // ---- Purple gem pickup → EMP fires
    if (purpleGem) {
      const dx = ship.x - purpleGem.x;
      const dy = ship.y - purpleGem.y;
      const r  = CELL_PICK_R + SHIP_W * 0.4;
      if (dx * dx + dy * dy < r * r) {
        purpleGem = null;
        empPulseAt = frame;
        // Stun the bandit (overrides whatever it was doing)
        bandit.state = 'stunned';
        bandit.stateFrames = 0;
      }
    }

    // ---- Dropped-cell pickup
    for (let i = droppedCells.length - 1; i >= 0; i--) {
      const dc = droppedCells[i];
      const dx = ship.x - dc.x;
      const dy = ship.y - dc.y;
      const r  = CELL_PICK_R + SHIP_W * 0.4;
      if (dx * dx + dy * dy < r * r) {
        heldCells++;
        droppedCells.splice(i, 1);
      }
    }
  }

  // ---- Rendering
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,    SKY_TOP);
    g.addColorStop(0.55, SKY_MID);
    g.addColorStop(1,    SKY_BOT);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // Distant haze stripes for atmosphere
    ctx.fillStyle = 'rgba(200, 130, 80, 0.10)';
    for (let i = 0; i < 6; i++) {
      const y = H * 0.20 + i * 16 + (frame * 0.15) % 16;
      ctx.fillRect(0, y, W, 1);
    }
  }

  function drawWall(w) {
    // Outpost gets its own renderer (industrial metal, not rock).
    if (w.outpost) return;
    // Rocky rust-orange canyon block. Three layers: dark backing,
    // mid base fill, lighter highlight strip along the top edge.
    ctx.fillStyle = WALL_COLOR_DARK;
    ctx.fillRect(w.x - 1, w.y - 1, w.w + 2, w.h + 2);
    ctx.fillStyle = WALL_COLOR_BASE;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    // Top highlight (lighter rust band)
    ctx.fillStyle = WALL_COLOR_LIGHT;
    ctx.fillRect(w.x, w.y, w.w, 3);
    // Subtle horizontal strata lines every 14 px so the rock has
    // bedded layers like sandstone.
    ctx.fillStyle = 'rgba(40, 14, 8, 0.45)';
    for (let yy = w.y + 14; yy < w.y + w.h; yy += 14) {
      ctx.fillRect(w.x, yy, w.w, 1);
    }
    // Tiny pebble dots scattered on the face (deterministic per wall)
    ctx.fillStyle = 'rgba(255, 200, 130, 0.30)';
    for (let i = 0; i < Math.max(3, Math.floor((w.w * w.h) / 800)); i++) {
      const seed = (w.x * 7 + w.y * 13 + i * 31) % 997;
      const px = w.x + 2 + (seed * 3) % Math.max(1, w.w - 4);
      const py = w.y + 2 + (seed * 5) % Math.max(1, w.h - 4);
      ctx.fillRect(px, py, 1, 1);
    }
  }

  function drawCell(c) {
    if (c.collected) return;
    const bobY = Math.sin(frame * 0.08 + c.bobPhase) * 2.5;
    const cx = Math.round(c.x);
    const cy = Math.round(c.y + bobY);
    const pulse = 0.5 + 0.5 * Math.sin(frame * 0.12 + c.bobPhase);
    // Halo
    ctx.shadowBlur = 9 + pulse * 4;
    ctx.shadowColor = 'rgba(80, 200, 255, 0.95)';
    ctx.fillStyle = 'rgba(80, 200, 255, ' + (0.40 + pulse * 0.15) + ')';
    ctx.beginPath();
    ctx.arc(cx, cy, CELL_R + 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Diamond gem (rotated square)
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.PI / 4);
    // Dark backing
    ctx.fillStyle = '#001830';
    ctx.fillRect(-CELL_R - 1, -CELL_R - 1, (CELL_R + 1) * 2, (CELL_R + 1) * 2);
    // Body
    ctx.fillStyle = '#3ad0ff';
    ctx.fillRect(-CELL_R, -CELL_R, CELL_R * 2, CELL_R * 2);
    // Top facet highlight
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.fillRect(-CELL_R, -CELL_R, CELL_R * 2, 2);
    // Bright catchlight
    ctx.fillStyle = '#fff';
    ctx.fillRect(-2, -2, 2, 2);
    ctx.restore();
  }

  function drawOutpost() {
    const o = outpost;
    // Body shadow
    ctx.fillStyle = '#0a0810';
    ctx.fillRect(o.x - 2, o.y - 2, o.w + 4, o.h + 4);
    // Metal column base
    ctx.fillStyle = '#2a2c38';
    ctx.fillRect(o.x, o.y, o.w, o.h);
    // Lighter front face (the "dock face")
    ctx.fillStyle = '#4a4d5e';
    ctx.fillRect(o.x + 4, o.y, o.w - 8, o.h);
    // Vertical edge highlights
    ctx.fillStyle = 'rgba(160, 175, 200, 0.55)';
    ctx.fillRect(o.x + 4, o.y, 1, o.h);
    // Rivets running up both sides
    ctx.fillStyle = '#0a0810';
    for (let yy = o.y + 8; yy < o.y + o.h - 4; yy += 12) {
      ctx.fillRect(o.x + 2, yy, 2, 2);
      ctx.fillRect(o.x + o.w - 4, yy, 2, 2);
    }
    // Recessed socket cup at the very top — glowing receptacle for cells
    const cupX = o.x + 6;
    const cupY = o.y;
    const cupW = o.w - 12;
    const cupH = 14;
    ctx.fillStyle = '#070a14';
    ctx.fillRect(cupX, cupY, cupW, cupH);
    const glowPulse = stabilized
      ? 1.0
      : 0.55 + 0.45 * Math.sin(frame * 0.10);
    ctx.shadowBlur = stabilized ? 14 : (6 + glowPulse * 4);
    ctx.shadowColor = stabilized
      ? 'rgba(140, 255, 220, 0.95)'
      : 'rgba(80, 200, 255, 0.95)';
    ctx.fillStyle = stabilized
      ? 'rgba(140, 255, 220, ' + glowPulse + ')'
      : 'rgba(100, 220, 255, ' + glowPulse + ')';
    ctx.fillRect(cupX + 2, cupY + 2, cupW - 4, cupH - 4);
    ctx.shadowBlur = 0;
    // Three indicator dots showing how many cells have been delivered
    for (let i = 0; i < 3; i++) {
      const ix = o.x + 8 + i * 8;
      const iy = o.y + 24;
      if (i < deliveredCells) {
        ctx.shadowBlur = 4;
        ctx.shadowColor = 'rgba(120, 240, 255, 0.95)';
        ctx.fillStyle = '#3ad0ff';
        ctx.beginPath();
        ctx.arc(ix, iy, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.beginPath();
        ctx.arc(ix - 0.7, iy - 0.7, 0.7, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#0a0810';
        ctx.beginPath();
        ctx.arc(ix, iy, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#3a3c48';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.arc(ix, iy, 2.5, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    // Yellow ANCHOR label plate
    ctx.fillStyle = '#ffd83d';
    ctx.fillRect(o.x + 4, o.y + 34, o.w - 8, 7);
    ctx.fillStyle = '#1a0a06';
    ctx.font = 'bold 5.5px Impact, "Arial Black", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('ANCHOR', o.x + o.w / 2, o.y + 37.5);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
    // Foot anchor — tucks the dock into the floor
    ctx.fillStyle = '#1a1a22';
    ctx.fillRect(o.x - 4, o.y + o.h - 4, o.w + 8, 4);
  }

  function drawBandit() {
    if (!bandit.active) return;
    ctx.save();
    ctx.translate(Math.round(bandit.x), Math.round(bandit.y));
    if (bandit.state === 'celebrate') ctx.rotate(bandit.spinAngle);
    const stunned = bandit.state === 'stunned';
    const carryingPurple = bandit.state === 'celebrate';
    // Wings — angular bat wings flapping each frame
    const flap = Math.sin(frame * 0.30) * 0.4;
    const wingTipY = -2 + flap * 6;
    const wingColor = stunned ? '#5a5a64' : '#1a1014';
    ctx.fillStyle = wingColor;
    // Left wing
    ctx.beginPath();
    ctx.moveTo(-4, -2);
    ctx.lineTo(-14, wingTipY - 2);
    ctx.lineTo(-12, wingTipY + 4);
    ctx.lineTo(-8, 0);
    ctx.closePath();
    ctx.fill();
    // Right wing (mirror)
    ctx.beginPath();
    ctx.moveTo(4, -2);
    ctx.lineTo(14, wingTipY - 2);
    ctx.lineTo(12, wingTipY + 4);
    ctx.lineTo(8, 0);
    ctx.closePath();
    ctx.fill();
    // Skull body — rounded oval
    ctx.fillStyle = stunned ? '#7a7a86' : (carryingPurple ? '#6a3088' : '#e8e4d8');
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    // Skull shadow / underside
    ctx.fillStyle = stunned ? '#4a4a54' : (carryingPurple ? '#3a1850' : '#a89c84');
    ctx.beginPath();
    ctx.ellipse(0, 4, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    // Eye sockets — glowing red normally; gray when stunned
    const eyeColor = stunned ? '#3a3a44' : '#ff3030';
    const eyeGlow  = stunned ? 'rgba(80, 80, 90, 0.5)' : 'rgba(255, 60, 40, 0.95)';
    ctx.shadowBlur = stunned ? 0 : 5;
    ctx.shadowColor = eyeGlow;
    ctx.fillStyle = eyeColor;
    ctx.beginPath();
    ctx.arc(-3.4, -1.8, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc( 3.4, -1.8, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Tooth row — small white squares along the lower jaw
    ctx.fillStyle = stunned ? '#9a9aa4' : '#f4ecd8';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(-3.6 + i * 2, 4.5, 1.4, 1.6);
    }
    // Stunned electric arcs — random crackles
    if (stunned) {
      ctx.strokeStyle = 'rgba(180, 220, 255, 0.85)';
      ctx.lineWidth = 0.8;
      for (let i = 0; i < 3; i++) {
        const a = (frame * 0.3 + i * 2.0) % (Math.PI * 2);
        const r1 = 11 + Math.sin(frame * 0.4 + i) * 2;
        const r2 = r1 + 4;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
        ctx.lineTo(Math.cos(a + 0.4) * r2, Math.sin(a + 0.4) * r2);
        ctx.stroke();
      }
    }
    // Carrying-cell indicator — tiny blue dot orbiting bandit's head
    if (bandit.stolen > 0 && !stunned) {
      const ang = frame * 0.15;
      const ox = Math.cos(ang) * 12;
      const oy = Math.sin(ang) * 6 - 6;
      ctx.shadowBlur = 4;
      ctx.shadowColor = 'rgba(80, 200, 255, 0.95)';
      ctx.fillStyle = '#3ad0ff';
      ctx.beginPath();
      ctx.arc(ox, oy, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  function drawPurpleGem() {
    if (!purpleGem) return;
    const bobY = Math.sin(frame * 0.10) * 3;
    const cx = Math.round(purpleGem.x);
    const cy = Math.round(purpleGem.y + bobY);
    const pulse = 0.5 + 0.5 * Math.sin(frame * 0.18);
    // Electric halo
    ctx.shadowBlur = 12 + pulse * 6;
    ctx.shadowColor = 'rgba(200, 100, 255, 0.95)';
    ctx.fillStyle = 'rgba(200, 100, 255, ' + (0.45 + pulse * 0.20) + ')';
    ctx.beginPath();
    ctx.arc(cx, cy, CELL_R + 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Diamond body — violet
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#1a0830';
    ctx.fillRect(-CELL_R - 1, -CELL_R - 1, (CELL_R + 1) * 2, (CELL_R + 1) * 2);
    ctx.fillStyle = '#b040ff';
    ctx.fillRect(-CELL_R, -CELL_R, CELL_R * 2, CELL_R * 2);
    ctx.fillStyle = 'rgba(255, 200, 255, 0.85)';
    ctx.fillRect(-CELL_R, -CELL_R, CELL_R * 2, 2);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-2, -2, 2, 2);
    ctx.restore();
    // Crackling electric arcs around the gem
    ctx.strokeStyle = 'rgba(220, 180, 255, ' + (0.6 + pulse * 0.4) + ')';
    ctx.lineWidth = 0.7;
    for (let i = 0; i < 3; i++) {
      const a0 = frame * 0.10 + i * (Math.PI * 2 / 3);
      const a1 = a0 + 0.6;
      const r0 = CELL_R + 3;
      const r1 = CELL_R + 7 + Math.sin(frame * 0.2 + i) * 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a0) * r0, cy + Math.sin(a0) * r0);
      ctx.lineTo(cx + Math.cos(a1) * r1, cy + Math.sin(a1) * r1);
      ctx.stroke();
    }
  }

  function drawDroppedCells() {
    for (const dc of droppedCells) {
      const bobY = Math.sin(frame * 0.08 + dc.bobPhase) * 1.5;
      const cx = Math.round(dc.x);
      const cy = Math.round(dc.y + bobY);
      const pulse = 0.5 + 0.5 * Math.sin(frame * 0.14 + dc.bobPhase);
      // "Dropped" halo — slightly orange-ish to read as "loose loot"
      ctx.shadowBlur = 7 + pulse * 3;
      ctx.shadowColor = 'rgba(255, 200, 100, 0.95)';
      ctx.fillStyle = 'rgba(255, 200, 100, ' + (0.30 + pulse * 0.15) + ')';
      ctx.beginPath();
      ctx.arc(cx, cy, CELL_R + 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Cell itself — same blue diamond as the regular cells
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#001830';
      ctx.fillRect(-CELL_R - 1, -CELL_R - 1, (CELL_R + 1) * 2, (CELL_R + 1) * 2);
      ctx.fillStyle = '#3ad0ff';
      ctx.fillRect(-CELL_R, -CELL_R, CELL_R * 2, CELL_R * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.fillRect(-CELL_R, -CELL_R, CELL_R * 2, 2);
      ctx.restore();
    }
  }

  function drawEmpPulse() {
    const elapsed = frame - empPulseAt;
    if (elapsed < 0 || elapsed > 30) return;
    const t = elapsed / 30;
    const r = 30 + t * 220;
    const a = (1 - t) * 0.85;
    ctx.strokeStyle = 'rgba(180, 220, 255, ' + a + ')';
    ctx.lineWidth = 3 - t * 2;
    ctx.shadowBlur = 12;
    ctx.shadowColor = 'rgba(120, 200, 255, 0.95)';
    ctx.beginPath();
    ctx.arc(ship.x, ship.y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Inner softer ring
    ctx.strokeStyle = 'rgba(255, 255, 255, ' + (a * 0.7) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(ship.x, ship.y, r * 0.8, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawHeldCells() {
    // Held cells orbit the ship as small blue dots — also gives a
    // visual cue that you have cargo.
    if (heldCells === 0) return;
    for (let i = 0; i < heldCells; i++) {
      const ang = frame * 0.10 + i * (Math.PI * 2 / 3);
      const r = 18;
      const x = ship.x + Math.cos(ang) * r;
      const y = ship.y + Math.sin(ang) * r * 0.55 - 4;
      ctx.shadowBlur = 4;
      ctx.shadowColor = 'rgba(80, 200, 255, 0.95)';
      ctx.fillStyle = '#3ad0ff';
      ctx.beginPath();
      ctx.arc(x, y, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.beginPath();
      ctx.arc(x - 0.7, y - 0.7, 0.7, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawStabilizedBanner() {
    if (!stabilized) return;
    const elapsed = frame - stabilizedAt;
    const fade = Math.min(1, elapsed / 30);
    // Slight darken so the banner pops
    ctx.fillStyle = 'rgba(8, 14, 24, ' + (0.55 * fade) + ')';
    ctx.fillRect(0, 0, W, H);
    const bannerY = H * 0.42;
    ctx.fillStyle = 'rgba(0, 30, 50, ' + (0.90 * fade) + ')';
    ctx.fillRect(20, bannerY - 32, W - 40, 64);
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(120, 240, 255, 0.95)';
    ctx.strokeStyle = 'rgba(140, 250, 255, ' + fade + ')';
    ctx.lineWidth = 2;
    ctx.strokeRect(20.5, bannerY - 31.5, W - 41, 63);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(180, 255, 230, ' + fade + ')';
    ctx.font = 'bold 28px Impact, "Arial Black", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('STABILIZED', W / 2, bannerY - 6);
    ctx.fillStyle = 'rgba(244, 216, 160, ' + fade + ')';
    ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillText('All 3 cells delivered to the anchor', W / 2, bannerY + 18);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  function drawShip() {
    ctx.save();
    ctx.translate(Math.round(ship.x), Math.round(ship.y));
    ctx.rotate(ship.rot);

    // i-frame flicker
    if (ship.invuln > 0 && Math.floor(frame / 4) % 2 === 0) {
      ctx.globalAlpha = 0.55;
    }

    // Thruster plume — short flame behind the ship when freshly tapped
    if (ship.thruster > 0) {
      const t = ship.thruster / 8;
      const len = 4 + t * 10;
      ctx.fillStyle = 'rgba(255, 200, 60, 0.85)';
      ctx.beginPath();
      ctx.moveTo(-SHIP_W / 2,             0);
      ctx.lineTo(-SHIP_W / 2 - len,       -2 * t);
      ctx.lineTo(-SHIP_W / 2 - len * 0.6, 0);
      ctx.lineTo(-SHIP_W / 2 - len,       2 * t);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255, 240, 180, 0.95)';
      ctx.beginPath();
      ctx.moveTo(-SHIP_W / 2,             0);
      ctx.lineTo(-SHIP_W / 2 - len * 0.55, -1.2 * t);
      ctx.lineTo(-SHIP_W / 2 - len * 0.4, 0);
      ctx.lineTo(-SHIP_W / 2 - len * 0.55, 1.2 * t);
      ctx.closePath();
      ctx.fill();
    }

    // Hull — boxy cargo drone, dark red with a yellow nose stripe
    ctx.fillStyle = '#1a0408';
    ctx.fillRect(-SHIP_W / 2 - 1, -SHIP_H / 2 - 1, SHIP_W + 2, SHIP_H + 2);
    ctx.fillStyle = '#a02818';
    ctx.fillRect(-SHIP_W / 2, -SHIP_H / 2, SHIP_W, SHIP_H);
    // Nose stripe (right side — the forward direction)
    ctx.fillStyle = '#ffd83d';
    ctx.fillRect(SHIP_W / 2 - 4, -SHIP_H / 2, 4, SHIP_H);
    ctx.fillStyle = '#1a0408';
    ctx.fillRect(SHIP_W / 2 - 4, -SHIP_H / 2, 4, 1);
    ctx.fillRect(SHIP_W / 2 - 4,  SHIP_H / 2 - 1, 4, 1);
    // Cyan cockpit window
    ctx.fillStyle = '#3ad0ff';
    ctx.fillRect(SHIP_W / 2 - 9, -SHIP_H / 2 + 2, 4, 4);
    // Bolt detail
    ctx.fillStyle = '#1a0408';
    ctx.fillRect(-SHIP_W / 2 + 1, -SHIP_H / 2 + 1, 1, 1);
    ctx.fillRect(-SHIP_W / 2 + 1,  SHIP_H / 2 - 2, 1, 1);

    ctx.restore();
  }

  function drawHUD() {
    // Velocity bar — visual readout to help dial in physics. Shows vx
    // (right cyan) and vy (down red).
    const barX = 14, barY = 60, barW = 100, barH = 4;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillRect(barX - 1, barY - 1, barW + 2, barH * 2 + 4);
    // vx
    const vxFrac = Math.max(-1, Math.min(1, ship.vx / MAX_VX));
    ctx.fillStyle = '#3ad0ff';
    ctx.fillRect(barX + barW / 2, barY,
                 Math.round((barW / 2) * vxFrac), barH);
    // vy
    const vyFrac = Math.max(-1, Math.min(1, ship.vy / MAX_FALL));
    ctx.fillStyle = vyFrac > 0 ? '#ff6040' : '#ffd83d';
    ctx.fillRect(barX + barW / 2, barY + barH + 2,
                 Math.round((barW / 2) * vyFrac), barH);
    // Bar labels
    ctx.fillStyle = 'rgba(244, 216, 160, 0.75)';
    ctx.font = '8px -apple-system, sans-serif';
    ctx.fillText('vx', barX + barW + 6, barY + 4);
    ctx.fillText('vy', barX + barW + 6, barY + barH + 6);
    // Cell counter — held cells (carrying) + delivered (lit)
    ctx.fillStyle = 'rgba(244, 216, 160, 0.85)';
    ctx.font = 'bold 11px -apple-system, sans-serif';
    ctx.fillText('HELD: ' + heldCells + '   DELIVERED: ' + deliveredCells + '/3',
                 14, H - 36);
    // Death counter — smaller, off to the side
    ctx.fillStyle = 'rgba(244, 216, 160, 0.55)';
    ctx.font = '9px -apple-system, sans-serif';
    ctx.fillText('crashes ' + ship.deaths, W - 60, H - 36);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawSky();
    for (const w of walls) drawWall(w);
    drawOutpost();
    for (const c of cells) drawCell(c);
    drawDroppedCells();
    drawPurpleGem();
    drawBandit();
    drawShip();
    drawEmpPulse();
    drawHeldCells();
    drawHUD();
    drawStabilizedBanner();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
