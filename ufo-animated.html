<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UFO Tractor Beam — Animated</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #1d1d22; color: #d8d8e2; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .root { display: flex; flex-direction: column; align-items: center; padding: 20px 12px 60px; gap: 14px; }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #aab; margin: 0; }
  .canvas-wrap {
    /* checkered transparency backdrop so the alpha is visible */
    background-color: #14141a;
    background-image:
      linear-gradient(45deg, #1f1f28 25%, transparent 25%),
      linear-gradient(-45deg, #1f1f28 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1f1f28 75%),
      linear-gradient(-45deg, transparent 75%, #1f1f28 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    border: 1px solid #2a2a35;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: 560px; }
  button { background: #2a2a36; color: #e0e0ec; border: 1px solid #3a3a48; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer; border-radius: 3px; }
  button:hover { background: #34344a; }
  button.on { background: #4a5a8a; border-color: #6a7aaa; }
  input[type=range] { flex: 1; min-width: 180px; }
  label { font-size: 11px; color: #888; user-select: none; }
  .frame-label { color: #888; font-size: 11px; min-width: 80px; text-align: right; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ── Canvas / animation constants ─────────────────────
const W = 192, H = 360, SCALE = 3;
const TOTAL_FRAMES = 72;
const FPS = 24;
const TAU = Math.PI * 2;
const HCX = 96, UCX = 96;
const DCX = 96, DCY_BASE = 145, DR = 38;

// ── Palette ──────────────────────────────────────────
const C = {
  SHINE: [255,252,235], HOT: [255,240,175], BRIGHT: [255,215,110],
  LIGHT: [252,175,70],  ORANGE: [235,125,45], RED: [180,70,30],
  DEEP_R: [110,35,18],  DARK_R: [60,18,10],
  DOME_SHINE: [240,255,255], DOME_HOT: [180,240,255], DOME_BRIGHT: [105,215,250],
  DOME_LIGHT: [55,175,225], DOME_MID: [35,130,195], DOME_DARK: [25,85,155],
  DOME_DEEP: [18,55,110], DOME_VOID: [12,32,70],
  HULL_VL: [200,215,230], HULL_HI: [155,175,205], HULL_L: [115,135,168],
  HULL_M: [78,95,128],   HULL_D: [50,62,90],     HULL_DD: [30,38,60],
  HULL_O: [12,16,30],
  WIN_O: [255,145,55],   WIN_Y: [255,220,110],   WIN_W: [255,245,200],
  PLASMA_SHINE: [255,255,255], PLASMA_HOT: [200,230,255], PLASMA_BRIGHT: [130,195,255],
  PLASMA_LIGHT: [140,120,255], PLASMA_MID: [190,80,240], PLASMA_DARK: [145,35,195],
  PLASMA_DEEP: [90,18,130],
  ALIEN_LIGHT: [190,220,175], ALIEN_MID: [130,170,115], ALIEN_DARK: [75,110,70], ALIEN_VOID: [25,40,30],
  GLINT: [245,255,245],
  POOF_CORE: [255,255,255], POOF_WHITE: [255,245,255], POOF_CYAN: [180,230,255],
  POOF_PINK: [255,200,255], POOF_PURPLE: [190,130,255], POOF_DEEP: [140,70,220], POOF_VOID: [70,30,130],
};

// Light direction (3D world coords)
const LX = 0.50, LY = 0.55, LZ = 0.67;
const LM = Math.sqrt(LX*LX + LY*LY + LZ*LZ);
const Lx = LX/LM, Ly = LY/LM, Lz = LZ/LM;

// ── Pixel helper with alpha-over compositing ─────────
function makePut(buf) {
  return function put(x, y, c, a) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    const idx = (y * W + x) * 4;
    if (a === undefined || a >= 255) {
      buf[idx]   = c[0];
      buf[idx+1] = c[1];
      buf[idx+2] = c[2];
      buf[idx+3] = 255;
      return;
    }
    if (a <= 0) return;
    const ea = buf[idx+3];
    const na = a / 255;
    const oa = na + (ea / 255) * (1 - na);
    if (oa <= 0) return;
    const ow = (ea / 255) * (1 - na);
    buf[idx]   = (c[0] * na + buf[idx]   * ow) / oa;
    buf[idx+1] = (c[1] * na + buf[idx+1] * ow) / oa;
    buf[idx+2] = (c[2] * na + buf[idx+2] * ow) / oa;
    buf[idx+3] = oa * 255;
  };
}

// ── Saucer row data (33-row disc) ────────────────────
const SAUCER_ROWS = [
  [146,44,'rim_flare'],[147,58,'rim_flare'],[148,70,'rim_flare'],
  [149,80,'rim_flare'],[150,86,'rim_top'],[151,90,'rim_top'],
  [152,92,'body_hi'], [153,93,'body_hi'],[154,94,'body_hi'],
  [155,94,'body_hi'], [156,94,'seam'],   [157,94,'body_lights'],
  [158,94,'body_lights'],[159,93,'body_lights'],[160,93,'body_lights'],
  [161,92,'seam'],    [162,91,'body_dark'],[163,90,'body_dark'],
  [164,88,'body_dark'],[165,86,'body_dark'],[166,84,'body_dark'],
  [167,82,'seam'],    [168,80,'body_lights2'],[169,78,'body_lights2'],
  [170,76,'body_lights2'],[171,73,'body_lights2'],[172,70,'seam'],
  [173,66,'taper'],   [174,61,'taper'],  [175,55,'taper'],
  [176,48,'taper'],   [177,40,'taper'],  [178,32,'taper'],
  [179,25,'lower_panel'],[180,21,'lower_panel'],[181,18,'lower_lights'],
  [182,16,'lower_dark'],[183,13,'neck'], [184,11,'neck'],
  [185,9,'neck'],     [186,8,'neck'],
];

function shadeSaucer(role, dx, hw) {
  const rel = dx / Math.max(hw, 1);
  if (Math.abs(dx) === hw && hw > 3) return C.HULL_O;
  if (Math.abs(dx) >= hw - 1 && hw > 6) return C.HULL_DD;
  switch (role) {
    case 'rim_flare':
      if (rel > 0.4) return C.HULL_VL;
      if (rel > 0.0) return C.HULL_HI;
      if (rel > -0.4) return C.HULL_L;
      return C.HULL_M;
    case 'rim_top':
      if (rel > 0.4) return C.HULL_VL;
      if (rel > -0.1) return C.HULL_HI;
      if (rel > -0.5) return C.HULL_L;
      return C.HULL_M;
    case 'body_hi':
      if (rel > 0.3) return C.HULL_HI;
      if (rel > -0.2) return C.HULL_L;
      if (rel > -0.6) return C.HULL_M;
      return C.HULL_D;
    case 'seam': return C.HULL_O;
    case 'body_lights':
      if (rel > 0.4) return C.HULL_L;
      if (rel > -0.3) return C.HULL_M;
      return C.HULL_D;
    case 'body_lights2':
      if (rel > 0.3) return C.HULL_M;
      if (rel > -0.3) return C.HULL_D;
      return C.HULL_DD;
    case 'body_dark':
      if (rel > 0.3) return C.HULL_M;
      if (rel > -0.3) return C.HULL_D;
      return C.HULL_DD;
    case 'taper':
      if (rel > 0.3) return C.HULL_M;
      if (rel > -0.3) return C.HULL_D;
      return C.HULL_DD;
    case 'lower_panel':
      if (rel > 0.3) return C.HULL_L;
      if (rel > -0.3) return C.HULL_M;
      return C.HULL_D;
    case 'lower_lights': return C.HULL_M;
    case 'lower_dark':   return C.HULL_D;
    case 'neck':
      if (dx > 0) return C.HULL_M;
      if (dx > -2) return C.HULL_D;
      return C.HULL_DD;
  }
  return C.HULL_M;
}

function drawSaucer(put) {
  for (const [y, hw, role] of SAUCER_ROWS) {
    for (let dx = -hw; dx <= hw; dx++) {
      put(HCX + dx, y, shadeSaucer(role, dx, hw));
    }
  }
  // External tapered neck below dict
  for (let y = 187; y < 193; y++) {
    const hw = y < 191 ? 4 : 6;
    for (let dx = -hw; dx <= hw; dx++) {
      const x = HCX + dx;
      let col;
      if (Math.abs(dx) === hw) col = C.HULL_O;
      else if (dx > 1) col = C.HULL_M;
      else if (dx > -2) col = C.HULL_D;
      else col = C.HULL_DD;
      put(x, y, col);
    }
  }
}

function drawDome(put) {
  for (let y = DCY_BASE - DR; y <= DCY_BASE; y++) {
    for (let x = DCX - DR; x <= DCX + DR; x++) {
      const u = (x - DCX) / DR;
      const v = (DCY_BASE - y) / DR;
      if (v < 0) continue;
      if (u*u + v*v > 1.0) continue;
      const w = Math.sqrt(Math.max(0, 1 - u*u - v*v));
      const diff = Math.max(0, u*Lx + v*Ly + w*Lz);
      const glow = 0.55 + 0.10 * w;
      let i = diff * 0.55 + glow * 0.40;
      const r = Math.sqrt(u*u + v*v);
      if (r > 0.96) i *= 0.20;
      else if (r > 0.90) i *= 0.50;
      else if (r > 0.82) i *= 0.75;
      let col;
      if      (i > 0.95) col = C.DOME_SHINE;
      else if (i > 0.82) col = C.DOME_HOT;
      else if (i > 0.68) col = C.DOME_BRIGHT;
      else if (i > 0.54) col = C.DOME_LIGHT;
      else if (i > 0.40) col = C.DOME_MID;
      else if (i > 0.25) col = C.DOME_DARK;
      else if (i > 0.10) col = C.DOME_DEEP;
      else               col = C.DOME_VOID;
      put(x, y, col);
    }
  }
  // Diagonal specular streak
  const streak = [
    [DCX+12, DCY_BASE-34, C.DOME_HOT],[DCX+13, DCY_BASE-33, C.DOME_SHINE],
    [DCX+14, DCY_BASE-32, C.DOME_SHINE],[DCX+15, DCY_BASE-31, C.DOME_SHINE],
    [DCX+16, DCY_BASE-30, C.DOME_SHINE],[DCX+17, DCY_BASE-28, C.DOME_SHINE],
    [DCX+18, DCY_BASE-26, C.DOME_SHINE],[DCX+19, DCY_BASE-24, C.DOME_HOT],
    [DCX+20, DCY_BASE-22, C.DOME_HOT],[DCX+21, DCY_BASE-19, C.DOME_HOT],
    [DCX+22, DCY_BASE-16, C.DOME_BRIGHT],[DCX+22, DCY_BASE-13, C.DOME_BRIGHT],
    [DCX+23, DCY_BASE-10, C.DOME_LIGHT],
  ];
  for (const [x, y, c] of streak) put(x, y, c);
}

function drawDomeSlits(put, frame) {
  const slits = [
    [DCX-19, DCY_BASE-18, DCY_BASE-5, 0.0],
    [DCX-13, DCY_BASE-24, DCY_BASE-4, 0.33],
    [DCX-7,  DCY_BASE-28, DCY_BASE-3, 0.66],
  ];
  for (const [sx, ys, ye, phase] of slits) {
    const t = (frame / TOTAL_FRAMES + phase) % 1.0;
    const pulse = 0.55 + 0.45 * Math.sin(t * TAU * 2);
    let glow;
    if      (pulse > 0.85) glow = C.WIN_W;
    else if (pulse > 0.55) glow = C.WIN_Y;
    else                   glow = C.WIN_O;
    const mid = Math.floor((ys + ye) / 2);
    for (let y = ys; y <= ye; y++) {
      put(sx, y, C.DOME_VOID);
      if (mid - 2 <= y && y <= mid + 2) put(sx, y, glow);
    }
  }
}

function drawRotatingLights(put, frame) {
  const phase = (frame / TOTAL_FRAMES) * TAU;
  // Top band (row 158-159) — 28 lights
  const N1 = 28, R1 = 90;
  for (let i = 0; i < N1; i++) {
    const alpha = (i / N1) * TAU + phase;
    const ca = Math.cos(alpha);
    if (ca <= 0.05) continue;
    const x = HCX + Math.round(R1 * Math.sin(alpha));
    if      (ca > 0.80) { put(x, 158, C.WIN_W); put(x, 159, C.WIN_Y); }
    else if (ca > 0.55) { put(x, 158, C.WIN_Y); put(x, 159, C.WIN_O); }
    else if (ca > 0.30) { put(x, 158, C.WIN_O); put(x, 159, C.ORANGE); }
    else if (ca > 0.10) { put(x, 158, C.ORANGE); put(x, 159, C.RED); }
    else                { put(x, 158, C.RED); }
  }
  // Second band (row 169-170) — 20 lights, same direction
  const N2 = 20, R2 = 74;
  for (let i = 0; i < N2; i++) {
    const alpha = (i / N2) * TAU + phase;
    const ca = Math.cos(alpha);
    if (ca <= 0.05) continue;
    const x = HCX + Math.round(R2 * Math.sin(alpha));
    if      (ca > 0.70) { put(x, 169, C.WIN_Y); put(x, 170, C.WIN_O); }
    else if (ca > 0.40) { put(x, 169, C.WIN_O); put(x, 170, C.ORANGE); }
    else if (ca > 0.15) { put(x, 169, C.ORANGE); put(x, 170, C.RED); }
    else                { put(x, 169, C.RED); }
  }
  // Lower panel (row 181) — 9 lights, counter-spinning faster
  const N3 = 9, R3 = 16;
  for (let i = 0; i < N3; i++) {
    const alpha = (i / N3) * TAU - phase * 1.5;
    const ca = Math.cos(alpha);
    if (ca <= 0.05) continue;
    const x = HCX + Math.round(R3 * Math.sin(alpha));
    if      (ca > 0.55) put(x, 181, C.WIN_Y);
    else if (ca > 0.25) put(x, 181, C.WIN_O);
    else                put(x, 181, C.ORANGE);
  }
}

function drawCabinWindows(put, frame) {
  const t0 = ((frame * 3) % TOTAL_FRAMES) / TOTAL_FRAMES;
  const cabins = [[-44, 0.0],[-26, 0.2],[-10, 0.4],[10, 0.6],[26, 0.8],[44, 1.0]];
  for (const [dxc, off] of cabins) {
    const t = (t0 + off) % 1.0;
    let inner, outer;
    if (t < 0.75) { inner = C.WIN_W; outer = C.WIN_Y; }
    else          { inner = C.WIN_O; outer = C.ORANGE; }
    const x = HCX + dxc;
    put(x, 158, inner); put(x + 1, 158, outer);
    put(x, 159, outer); put(x + 1, 159, C.WIN_O);
  }
}

function drawPlume(put, frame) {
  const breath = Math.sin(frame / TOTAL_FRAMES * TAU);
  const pulse = 0.92 + 0.18 * breath;
  const base = [
    [193,2],[194,3],[195,3],[196,4],[197,5],
    [198,6],[199,7],[200,8],[201,9],[202,10],
    [203,11],[204,12],[205,13],[206,14],
  ];
  const top = base[0][0], bot = base[base.length-1][0];
  const ht = bot - top;
  for (const [y, hwBase] of base) {
    const hw = Math.max(1, Math.round(hwBase * pulse));
    const relY = (y - top) / ht;
    for (let dx = -hw; dx <= hw; dx++) {
      const u = dx / Math.max(hw, 1);
      const i = (1 - Math.abs(u) * 0.60) * (1 - relY * 0.55) * pulse;
      let col;
      if      (i > 0.88) col = C.PLASMA_SHINE;
      else if (i > 0.72) col = C.PLASMA_HOT;
      else if (i > 0.56) col = C.PLASMA_BRIGHT;
      else if (i > 0.42) col = C.PLASMA_LIGHT;
      else if (i > 0.28) col = C.PLASMA_MID;
      else if (i > 0.14) col = C.PLASMA_DARK;
      else               col = C.PLASMA_DEEP;
      put(HCX + dx, y, col);
    }
  }
}

// Beam-cycle phase frames (72-frame loop):
//   [0, 14)  extend
//   [14, 36) hold
//   [36, 50) retract
//   [50, 72) pause (empty)
const BEAM_EXTEND_END  = 14;
const BEAM_HOLD_END    = 36;
const BEAM_RETRACT_END = 50;

function beamState(frame) {
  if (frame < BEAM_EXTEND_END) {
    const t = frame / BEAM_EXTEND_END;
    const e = 1 - (1 - t) * (1 - t);
    return { length: e, intensity: 0.4 + 0.6 * e, phase: 'extend', suction: 0 };
  }
  if (frame < BEAM_HOLD_END) {
    return { length: 1, intensity: 1, phase: 'hold', suction: 0.7 };
  }
  if (frame < BEAM_RETRACT_END) {
    const t = (frame - BEAM_HOLD_END) / (BEAM_RETRACT_END - BEAM_HOLD_END);
    const e = t * t;
    return { length: 1 - e, intensity: 1 - 0.2 * e, phase: 'retract', suction: 1.6 };
  }
  return { length: 0, intensity: 0, phase: 'pause', suction: 0 };
}

function drawBeam(put, frame) {
  const TOP = 207, MAX_BOT = 345;
  const HW_T = 12, MAX_HW_B = 50;
  const maxH = MAX_BOT - TOP;
  const { length, intensity, phase, suction } = beamState(frame);
  if (length <= 0.001 || intensity <= 0.001) return;

  const curBot = TOP + length * maxH;
  const curBotI = Math.round(curBot);
  const leadingY = curBotI;
  const pulse = 0.85 + 0.15 * Math.sin(frame / TOTAL_FRAMES * TAU * 4);

  // Beam body
  for (let y = TOP; y <= curBotI; y++) {
    const relFull = (y - TOP) / maxH;
    const hw = HW_T + relFull * (MAX_HW_B - HW_T);
    const relLocal = (y - TOP) / Math.max(curBot - TOP, 1);
    const distFromEdge = leadingY - y;
    const edgeBoost = distFromEdge < 5 ? (1 - distFromEdge / 5) * 0.4 : 0;
    for (let dx = -Math.ceil(hw) - 1; dx <= Math.ceil(hw) + 1; dx++) {
      const u = dx / hw;
      if (Math.abs(u) > 1.05) continue;
      const edge = 1 - Math.min(1, Math.pow(Math.abs(u), 1.4));
      const vfade = 1 - relLocal * 0.30;
      const a_base = edge * vfade * pulse * intensity * (1 + edgeBoost * (1 - Math.abs(u) * 0.6));
      let col, alpha;
      if (Math.abs(u) < 0.18) { col = C.PLASMA_HOT;    alpha = Math.round(220 * a_base); }
      else if (Math.abs(u) < 0.45) { col = C.PLASMA_BRIGHT; alpha = Math.round(170 * a_base); }
      else if (Math.abs(u) < 0.75) { col = C.PLASMA_LIGHT;  alpha = Math.round(120 * a_base); }
      else                         { col = C.PLASMA_MID;    alpha = Math.round(70 * a_base); }
      put(HCX + dx, y, col, Math.max(0, Math.min(255, alpha)));
    }
  }

  // Inner upward-scrolling streak lines — speed up during retract
  const lineSpeed = phase === 'retract' ? 7.0 : 3.0;
  const N_LINES = 4;
  for (let li = 0; li < N_LINES; li++) {
    const offFrac = (li / N_LINES) - 0.5 + 0.125;
    const linePhase = (frame * 2 + li * 18) % TOTAL_FRAMES;
    for (let y = TOP; y <= curBotI; y++) {
      const relFull = (y - TOP) / maxH;
      const hw = HW_T + relFull * (MAX_HW_B - HW_T);
      const scrollY = ((y - TOP - linePhase * (maxH / TOTAL_FRAMES) * lineSpeed) % maxH + maxH) % maxH;
      if (scrollY > 6) continue;
      const wob = Math.sin((y / 8) + frame / TOTAL_FRAMES * TAU) * 0.08;
      const dx = Math.round((offFrac + wob) * hw * 1.6);
      const a = Math.round(180 * (1 - scrollY / 6) * intensity);
      put(HCX + dx, y, C.PLASMA_HOT, a);
    }
  }

  // Upward-streaming suction particles — only when actually sucking
  if (suction > 0.01) {
    const N_PART = 28;
    const speedMult = phase === 'hold' ? 2.5 : 6.0;
    for (let i = 0; i < N_PART; i++) {
      const rng  = ((Math.sin(i * 12.9898 + 78.233) * 43758.5453) % 1 + 1) % 1;
      const rng2 = ((Math.sin(i * 9.7777 + 22.111) * 12345.6789) % 1 + 1) % 1;
      const progress = ((frame * speedMult + i * (TOTAL_FRAMES / N_PART)) % TOTAL_FRAMES) / TOTAL_FRAMES;
      const py = curBot - progress * (curBot - TOP);
      const relY = (py - TOP) / maxH;
      if (relY < 0 || relY > 1) continue;
      if (py > curBot) continue;
      const hw = HW_T + relY * (MAX_HW_B - HW_T);
      const xOffset = (rng - 0.5) * 2 * hw * (0.85 - 0.5 * (1 - relY));
      const px = HCX + Math.round(xOffset);
      const a = Math.round(245 * (0.4 + 0.6 * (1 - relY)) * suction);
      const col = rng2 > 0.6 ? C.PLASMA_SHINE : C.PLASMA_HOT;
      put(px, Math.round(py), col, Math.min(255, a));
      put(px, Math.round(py) + 1, C.PLASMA_BRIGHT, Math.min(255, Math.floor(a / 2)));
    }
  }
}

// ── Alien sprite + animation ─────────────────────────
const ALIEN_BODY = [
  "....DDDDDD....",
  "...DHHHHHHD...",
  "..DHHHHHHHHD..",
  ".DHHHHHHHHHHD.",
  "DHHHHHHHHHHHHD",
  "DHOOOODDOOOOHD",
  "DHOOOODDOOOOHD",
  "DHOOOODDOOOOHD",
  "DHHHHHHHHHHHHD",
  ".DHHHHHHHHHHD.",
  "..DHHHHHHHHD..",
  "...DHHHHHHD...",
  "....DDDDDD....",
  ".....DDDD.....",
  "...DHHHHHHD...",
  "..DHHHHHHHHD..",
  "..DH......HD..",
  "..DHHHHHHHHD..",
  "...DHHDDHHD...",
  "...DHH..HHD...",
  "...DHH..HHD...",
  "...DDD..DDD...",
];
const ALIEN_W = ALIEN_BODY[0].length;  // 14
const ALIEN_H = ALIEN_BODY.length;      // 22

function alienState(frame) {
  const GROUND = 348;
  if (frame < BEAM_EXTEND_END) return { visible: true, x: HCX, y: GROUND, look: 'up', alpha: 1 };
  if (frame < BEAM_HOLD_END) {
    const t = (frame - BEAM_EXTEND_END) / (BEAM_HOLD_END - BEAM_EXTEND_END);
    const e = t * t;
    return { visible: true, x: HCX, y: Math.round(GROUND - e * 120), look: 'up', alpha: 1 };
  }
  if (frame < BEAM_RETRACT_END) {
    const t = (frame - BEAM_HOLD_END) / (BEAM_RETRACT_END - BEAM_HOLD_END);
    const y = 228 - t * 18;
    const alpha = 1 - t;
    return { visible: alpha > 0.05, x: HCX, y: Math.round(y), look: 'up', alpha: Math.max(0, alpha) };
  }
  const WALK_END = 63;
  if (frame < WALK_END) {
    const t = (frame - BEAM_RETRACT_END) / (WALK_END - BEAM_RETRACT_END);
    const x = 22 + t * (HCX - 22);
    return { visible: true, x: Math.round(x), y: GROUND, look: 'walk', alpha: 1 };
  }
  const looks = ['right', 'center', 'left', 'center', 'left', 'right', 'up', 'up', 'up'];
  const idx = Math.max(0, Math.min(looks.length - 1, frame - WALK_END));
  return { visible: true, x: HCX, y: GROUND, look: looks[idx], alpha: 1 };
}

function drawAlien(put, frame) {
  const s = alienState(frame);
  if (!s.visible) return;
  const left = s.x - (ALIEN_W >> 1);
  const top = s.y - ALIEN_H + 1;
  const a8 = Math.round(255 * s.alpha);
  for (let dy = 0; dy < ALIEN_BODY.length; dy++) {
    const row = ALIEN_BODY[dy];
    for (let dx = 0; dx < row.length; dx++) {
      const ch = row[dx];
      if      (ch === 'H') put(left + dx, top + dy, C.ALIEN_LIGHT, a8);
      else if (ch === 'D') put(left + dx, top + dy, C.ALIEN_DARK,  a8);
      else if (ch === 'O') put(left + dx, top + dy, C.ALIEN_VOID,  a8);
    }
  }
  // Walking-stride leg overlay
  if (s.look === 'walk') {
    const phase = (frame % 4) < 2;
    const legs = phase ? [
      [3,18,C.ALIEN_DARK],[4,18,C.ALIEN_LIGHT],[5,18,C.ALIEN_LIGHT],
      [3,19,C.ALIEN_DARK],[4,19,C.ALIEN_LIGHT],[5,19,C.ALIEN_LIGHT],
      [3,20,C.ALIEN_DARK],[4,20,C.ALIEN_LIGHT],
      [8,18,C.ALIEN_LIGHT],[9,18,C.ALIEN_LIGHT],[10,18,C.ALIEN_DARK],
      [9,19,C.ALIEN_LIGHT],[10,19,C.ALIEN_DARK],
      [3,21,C.ALIEN_DARK],[4,21,C.ALIEN_DARK],
      [9,21,C.ALIEN_DARK],[10,21,C.ALIEN_DARK],
    ] : [
      [3,18,C.ALIEN_DARK],[4,18,C.ALIEN_LIGHT],
      [4,19,C.ALIEN_LIGHT],[3,19,C.ALIEN_DARK],
      [8,18,C.ALIEN_LIGHT],[9,18,C.ALIEN_LIGHT],[10,18,C.ALIEN_DARK],
      [8,19,C.ALIEN_LIGHT],[9,19,C.ALIEN_LIGHT],[10,19,C.ALIEN_DARK],
      [8,20,C.ALIEN_LIGHT],[9,20,C.ALIEN_LIGHT],[10,20,C.ALIEN_DARK],
      [3,21,C.ALIEN_DARK],[4,21,C.ALIEN_DARK],
      [8,21,C.ALIEN_DARK],[9,21,C.ALIEN_DARK],[10,21,C.ALIEN_DARK],
    ];
    for (const [dx, dy, col] of legs) put(left + dx, top + dy, col, a8);
  }
  // Eye glints
  const glintMap = {
    up:     [[3,5],[4,5],[9,5],[10,5]],
    down:   [[3,7],[4,7],[9,7],[10,7]],
    left:   [[2,6],[3,6],[8,6],[9,6]],
    right:  [[4,6],[5,6],[10,6],[11,6]],
    center: [[3,6],[4,6],[9,6],[10,6]],
    walk:   [[3,6],[4,6],[9,6],[10,6]],
  };
  const positions = glintMap[s.look] || glintMap.center;
  for (const [gx, gy] of positions) put(left + gx, top + gy, C.GLINT, a8);
}

// ── Magic-portal poof — plays at the start of the loop ─
const POOF_DURATION = 32;
const POOF_CX = HCX;
const POOF_CY = 145;
const POOF_RING_COLORS = [C.POOF_WHITE, C.POOF_CYAN, C.POOF_PURPLE, C.POOF_PINK, C.POOF_CORE, C.POOF_DEEP];
const POOF_SPARK_COLORS = [C.POOF_CORE, C.POOF_WHITE, C.POOF_CYAN, C.POOF_PINK, C.POOF_PURPLE];

function drawPoof(put, frame) {
  if (frame >= POOF_DURATION) return;
  const t = frame / POOF_DURATION;
  // Central flash
  const flashT = Math.min(1.0, frame / 8.0);
  const flashAlpha = Math.max(0, 1 - flashT);
  if (flashAlpha > 0) {
    const radius = Math.round(6 + (1 - flashAlpha) * 14);
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d > radius) continue;
        const edge = 1 - d / radius;
        let col;
        if      (edge > 0.85) col = C.POOF_CORE;
        else if (edge > 0.60) col = C.POOF_WHITE;
        else if (edge > 0.35) col = C.POOF_CYAN;
        else if (edge > 0.15) col = C.POOF_PURPLE;
        else                  col = C.POOF_DEEP;
        const a = Math.round(255 * edge * flashAlpha);
        if (a > 0) put(POOF_CX + dx, POOF_CY + dy, col, a);
      }
    }
  }
  // Expanding spinning rings
  const N_RINGS = 3;
  for (let r = 0; r < N_RINGS; r++) {
    const ringDelay = r * 0.12;
    const ringT = Math.max(0, t - ringDelay);
    if (ringT <= 0) continue;
    const radius = ringT * (95 + r * 8);
    const alpha = Math.max(0, 1 - ringT * 1.5);
    if (alpha < 0.05 || radius < 3) continue;
    const n = Math.max(28, Math.round(radius * 1.6));
    for (let i = 0; i < n; i++) {
      const angle = (i / n) * TAU + frame * (0.10 + r * 0.05);
      const rx = POOF_CX + Math.round(radius * Math.cos(angle));
      const ry = POOF_CY + Math.round(radius * Math.sin(angle) * 0.55);
      const col = POOF_RING_COLORS[(i + r * 7) % POOF_RING_COLORS.length];
      const a = Math.round(255 * alpha * 0.75);
      put(rx, ry, col, a);
    }
  }
  // Outward-flying sparkles
  const N_SPARKS = 70;
  for (let i = 0; i < N_SPARKS; i++) {
    const sparkOffset = i * 0.018;
    const phase = (sparkOffset + t * 0.9) % 1.0;
    if (phase > 0.85) continue;
    let rng = ((Math.sin(i * 12.9898 + 78.233) * 43758.5453) % 1 + 1) % 1;
    let rng2 = ((Math.sin(i * 9.7777 + 22.111) * 12345.6789) % 1 + 1) % 1;
    const angle = rng * TAU;
    const distScale = 70 + rng2 * 50;
    const dist = phase * distScale;
    const sx = POOF_CX + Math.round(dist * Math.cos(angle));
    const sy = POOF_CY + Math.round(dist * Math.sin(angle) * 0.6);
    const sparkAlpha = Math.pow(1 - phase, 0.7) * (1 - t * 0.4);
    const col = POOF_SPARK_COLORS[i % POOF_SPARK_COLORS.length];
    const a = Math.round(255 * sparkAlpha);
    if (a <= 0) continue;
    put(sx, sy, col, a);
    const tx = POOF_CX + Math.round((dist - 1.5) * Math.cos(angle));
    const ty = POOF_CY + Math.round((dist - 1.5) * Math.sin(angle) * 0.6);
    put(tx, ty, col, Math.floor(a / 2));
  }
}

function buildFrame(frame, buf, layers) {
  buf.fill(0);
  const put = makePut(buf);
  // Beam first so UFO + alien + plume sit on top of it when combined
  if (layers.beam) drawBeam(put, frame);
  if (layers.alien) drawAlien(put, frame);
  if (layers.ufo) {
    drawSaucer(put);
    drawRotatingLights(put, frame);
    drawCabinWindows(put, frame);
    drawDome(put);
    drawDomeSlits(put, frame);
  }
  if (layers.plume) drawPlume(put, frame);
  // Poof on top — magical portal overlay over everything
  if (layers.poof) drawPoof(put, frame);
}

// ── React component ───────────────────────────────────
function App() {
  const [paused, setPaused] = useState(false);
  const [frame, setFrame] = useState(0);
  const [slow, setSlow] = useState(false);
  const [showUfo, setShowUfo] = useState(true);
  const [showPlume, setShowPlume] = useState(true);
  const [showBeam, setShowBeam] = useState(true);
  const [showAlien, setShowAlien] = useState(true);
  const [showPoof, setShowPoof] = useState(true);
  const canvasRef = useRef(null);
  const offRef = useRef(null);
  const bufRef = useRef(null);

  // Lazy init off-canvas + buffer
  useMemo(() => {
    offRef.current = document.createElement('canvas');
    offRef.current.width = W;
    offRef.current.height = H;
    bufRef.current = new Uint8ClampedArray(W * H * 4);
  }, []);

  // Frame ticker
  useEffect(() => {
    if (paused) return;
    const interval = slow ? 1000 / 6 : 1000 / FPS;
    const id = setInterval(() => setFrame(f => (f + 1) % TOTAL_FRAMES), interval);
    return () => clearInterval(id);
  }, [paused, slow]);

  // Render frame to canvas
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    buildFrame(frame, bufRef.current, { ufo: showUfo, plume: showPlume, beam: showBeam, alien: showAlien, poof: showPoof });
    const offCtx = offRef.current.getContext('2d');
    offCtx.putImageData(new ImageData(bufRef.current, W, H), 0, 0);
    ctx.clearRect(0, 0, W * SCALE, H * SCALE);
    ctx.drawImage(offRef.current, 0, 0, W * SCALE, H * SCALE);
  }, [frame, showUfo, showPlume, showBeam, showAlien, showPoof]);

  const setSoloLayer = (layer) => {
    setShowUfo(layer === 'ufo');
    setShowPlume(layer === 'plume');
    setShowBeam(layer === 'beam');
    setShowAlien(layer === 'alien');
    setShowPoof(layer === 'poof');
  };
  const showAll = () => { setShowUfo(true); setShowPlume(true); setShowBeam(true); setShowAlien(true); setShowPoof(true); };

  return (
    <div className="root">
      <h1>UFO Tractor Beam</h1>
      <div className="canvas-wrap">
        <canvas ref={canvasRef} width={W * SCALE} height={H * SCALE} />
      </div>
      <div className="controls">
        <button className={paused ? 'on' : ''} onClick={() => setPaused(!paused)}>
          {paused ? 'Play' : 'Pause'}
        </button>
        <button className={slow ? 'on' : ''} onClick={() => setSlow(!slow)}>
          {slow ? 'Normal speed' : 'Slow (6 fps)'}
        </button>
        <input
          type="range" min="0" max={TOTAL_FRAMES - 1} value={frame}
          onChange={e => { setPaused(true); setFrame(Number(e.target.value)); }}
        />
        <span className="frame-label">Frame {frame + 1} / {TOTAL_FRAMES}</span>
      </div>
      <div className="controls" style={{justifyContent: 'center'}}>
        <label style={{marginRight: 8, color: '#aab'}}>Layers:</label>
        <button className={showUfo   ? 'on' : ''} onClick={() => setShowUfo(v => !v)}>UFO</button>
        <button className={showPlume ? 'on' : ''} onClick={() => setShowPlume(v => !v)}>Plume</button>
        <button className={showBeam  ? 'on' : ''} onClick={() => setShowBeam(v => !v)}>Beam</button>
        <button className={showAlien ? 'on' : ''} onClick={() => setShowAlien(v => !v)}>Alien</button>
        <button className={showPoof  ? 'on' : ''} onClick={() => setShowPoof(v => !v)}>Poof</button>
        <span style={{width: 12}}/>
        <button onClick={() => setSoloLayer('ufo')}>Solo UFO</button>
        <button onClick={() => setSoloLayer('plume')}>Solo Plume</button>
        <button onClick={() => setSoloLayer('beam')}>Solo Beam</button>
        <button onClick={() => setSoloLayer('alien')}>Solo Alien</button>
        <button onClick={() => setSoloLayer('poof')}>Solo Poof</button>
        <button onClick={showAll}>All on</button>
      </div>
      <div style={{maxWidth: 600, color: '#778', fontSize: 11, lineHeight: 1.5, textAlign: 'center'}}>
        72-frame seamless loop @ 24 fps. Transparent canvas — checkered backdrop shows alpha.
        Toggle layers individually, or solo each one to isolate it. Per-layer animated GIFs
        are exported by <code>build_ufo_anim.py</code> as <code>output/ufo_layer_ufo.gif</code>,
        <code>ufo_layer_plume.gif</code>, and <code>ufo_layer_beam.gif</code>.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
