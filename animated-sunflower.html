<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Angry Sunflower</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', system-ui, sans-serif;
    background: #0a1408;
    color: #f4e8d8;
    min-height: 100vh;
    padding: 26px 16px 60px;
    display: flex; flex-direction: column; align-items: center;
    -webkit-font-smoothing: antialiased;
  }
  .kicker { font-size: 10px; letter-spacing: 4px; font-weight: 800; color: #ffd060; margin-bottom: 6px; text-align: center; }
  h1 {
    font-family: Impact, 'Arial Black', sans-serif;
    font-size: 30px; letter-spacing: 6px;
    background: linear-gradient(90deg, #ffe060 0%, #ff8020 50%, #c0202a 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px; text-align: center;
  }
  .sub { font-size: 11px; line-height: 1.55; color: #80a080; max-width: 680px; margin: 8px auto 22px; text-align: center; }
  .canvasWrap {
    background: #1a2a14;
    padding: 18px;
    border: 2px solid #2a4a20;
    box-shadow: 0 0 32px rgba(255, 180, 60, 0.16);
  }
  canvas.pixelCanvas {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    display: block;
  }
  .controls { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn {
    background: linear-gradient(180deg,#f0a020 0%,#c5601a 100%);
    border: 2px solid #1a0a06;
    color: #fff0a0;
    font-family: Impact, 'Arial Black', sans-serif;
    font-size: 12px; letter-spacing: 1px;
    padding: 8px 14px; border-radius: 0;
    cursor: pointer;
    box-shadow: 0 3px 0 #5a3010;
  }
  .btn:hover { filter: brightness(1.1); }
  .meta { margin-top: 28px; font-size: 10px; color: #5a705a; letter-spacing: 1px; text-align: center; max-width: 700px; line-height: 1.6; }
</style>
</head>
<body>

<div class="kicker">DLX · NEO-16-BIT · BOTANICAL HORROR</div>
<h1>ANGRY SUNFLOWER</h1>
<p class="sub">
  Closed bud, angry eyes — petals snap open, the maw screams, then it furls back up.
  Looping animation, 128 px native, 4× nearest-neighbor scale.
</p>

<div class="canvasWrap">
  <canvas id="cv" class="pixelCanvas" width="128" height="128" style="width: 512px; height: 512px;"></canvas>
</div>

<div class="controls">
  <button class="btn" id="soundToggle">SOUND: OFF</button>
  <button class="btn" id="pauseToggle">PAUSE</button>
</div>

<div class="meta">128 PX NATIVE · 4× NEAREST-NEIGHBOR SCALE · 180-FRAME LOOP</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function px(color, x, y, w, h) {
  ctx.fillStyle = color;
  ctx.fillRect(x | 0, y | 0, (w || 1) | 0, (h || 1) | 0);
}

// ── PALETTE ──────────────────────────────────────────
const C = {
  out:        '#1a0a04',
  petalDark:  '#b85020',
  petalMid:   '#ffa820',
  petalLit:   '#ffd840',
  petalHi:    '#fff080',

  centerOut:  '#1a0a04',
  centerDark: '#3a1404',
  centerMid:  '#7a3a10',
  centerLit:  '#b0601a',
  centerHi:   '#e09030',

  stemDark:   '#0a3010',
  stemMid:    '#308024',
  stemLit:    '#68c038',
  stemHi:     '#a0e060',

  leafDark:   '#0a3010',
  leafMid:    '#308024',
  leafLit:    '#68c038',
  leafHi:     '#a0e060',
  leafVein:   '#205820',

  eyeOut:     '#1a0a04',
  eyeWhite:   '#fff8d0',
  eyeWhiteHi: '#ffffff',
  iris:       '#8a0810',
  pupil:      '#08020a',
  brow:       '#1a0a04',

  mouthOut:   '#08020a',
  mouthDark:  '#1a0408',
  mouthMid:   '#3a0814',
  mouthLit:   '#7a1828',
  tongue:     '#c8203a',
  tongueHi:   '#ff5060',
  tooth:      '#fff0c8',
  toothSh:    '#a88858',

  roarBeam:   '#ffd060',
  roarBeam2:  '#fff080',
};

// ── ANIMATION TIMING ─────────────────────────────────
const FRAMES         = 180;
const T_CLOSED       = 50;
const T_OPENING      = 14;
const T_ROAR_BUILDUP = 6;
const T_ROAR_HOLD    = 56;
const T_ROAR_FADE    = 6;
const T_CLOSING      = 14;
// remainder of the loop = rest at idle closed

function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeInCubic(x)  { return x * x * x; }

function phase(t) {
  t = ((t % FRAMES) + FRAMES) % FRAMES;
  let cur = 0, openT = 0, roarT = 0, shake = 0, name = 'idle';

  if (t < (cur += T_CLOSED)) { /* idle */ }
  else if (t < (cur += T_OPENING)) {
    const u = (t - (cur - T_OPENING)) / T_OPENING;
    openT = easeOutCubic(u);
    name = 'opening';
  }
  else if (t < (cur += T_ROAR_BUILDUP)) {
    const u = (t - (cur - T_ROAR_BUILDUP)) / T_ROAR_BUILDUP;
    openT = 1; roarT = easeOutCubic(u);
    name = 'buildup';
    shake = 0.5;
  }
  else if (t < (cur += T_ROAR_HOLD)) {
    openT = 1; roarT = 1; shake = 1;
    name = 'roar';
  }
  else if (t < (cur += T_ROAR_FADE)) {
    const u = (t - (cur - T_ROAR_FADE)) / T_ROAR_FADE;
    openT = 1; roarT = 1 - easeOutCubic(u);
    name = 'fade';
    shake = 0.4 * (1 - u);
  }
  else if (t < (cur += T_CLOSING)) {
    const u = (t - (cur - T_CLOSING)) / T_CLOSING;
    openT = 1 - easeInCubic(u);
    name = 'closing';
  }
  return { openT, roarT, shake, name };
}

// ── LAYOUT CONSTANTS ─────────────────────────────────
const CX = 64;
const CY = 50;        // flower center
const STEM_TOP_Y = 70;
const STEM_BOT_Y = 124;
const NUM_PETALS = 12;

// ── ROTATED-TEARDROP HELPER ──────────────────────────
// Used for petals and leaves: a pointed teardrop along a rotated axis.
function teardropHalfWidth(u, maxWidth) {
  if (u <= 0 || u >= 1) return 0;
  const peak = 0.32;
  if (u < peak) return (u / peak) * (maxWidth / 2);
  return (1 - (u - peak) / (1 - peak)) * (maxWidth / 2);
}

function drawTeardrop(cx, cy, angle, length, maxWidth, colors, options) {
  const cs = Math.cos(angle), sn = Math.sin(angle);
  const litSide = (options && options.litSide !== undefined) ? options.litSide : -1; // -1 = upper side lit
  const seam = options && options.seam;

  // Oversample at 0.5 px steps to avoid gaps from rotation rounding.
  for (let d = 0; d <= length; d += 0.5) {
    const u = d / length;
    const halfW = teardropHalfWidth(u, maxWidth);
    if (halfW <= 0) {
      // tip / base outline single point
      const sx = Math.round(cx + d * cs);
      const sy = Math.round(cy + d * sn);
      px(colors.out, sx, sy);
      continue;
    }
    for (let dy = -halfW; dy <= halfW; dy += 0.5) {
      const distFromEdge = halfW - Math.abs(dy);
      let color;
      if (distFromEdge < 0.55 || u < 0.04 || u > 0.96) {
        color = colors.out;
      } else {
        const t = dy / Math.max(halfW, 0.5); // -1..+1
        const tSigned = t * litSide;         // flip so "lit" side is -1
        if (tSigned < -0.45)      color = colors.hi;
        else if (tSigned < -0.05) color = colors.lit;
        else if (tSigned <  0.45) color = colors.mid;
        else                       color = colors.dark;
      }
      const sx = Math.round(cx + d * cs - dy * sn);
      const sy = Math.round(cy + d * sn + dy * cs);
      px(color, sx, sy);
    }
  }
  // Center seam (a thin midline highlight along the petal axis)
  if (seam) {
    for (let d = length * 0.18; d < length * 0.85; d += 0.5) {
      const sx = Math.round(cx + d * cs);
      const sy = Math.round(cy + d * sn);
      px(seam, sx, sy);
    }
  }
}

// ── STEM ─────────────────────────────────────────────
function drawStem(t, p) {
  // Sway driven by sin; top of stem sways more than base. During roar add a brief jitter.
  const baseSway = Math.sin(t * 0.045);
  for (let y = STEM_TOP_Y; y <= STEM_BOT_Y; y++) {
    const ratioFromBase = (STEM_BOT_Y - y) / (STEM_BOT_Y - STEM_TOP_Y);
    const sway = Math.round(baseSway * 1.8 * ratioFromBase);
    const jitter = p.shake > 0 ? Math.round((Math.random() - 0.5) * 2 * p.shake * ratioFromBase) : 0;
    const cx = CX + sway + jitter;
    // outline
    px(C.out, cx - 4, y);
    px(C.out, cx + 4, y);
    // dark right edge
    px(C.stemDark, cx + 3, y);
    px(C.stemDark, cx + 2, y);
    // mid fill
    px(C.stemMid,  cx - 2, y, 4, 1);
    // lit left
    px(C.stemLit,  cx - 3, y);
    // bright highlight pip near top of stem
    if (y === STEM_TOP_Y + 4) px(C.stemHi, cx - 3, y);
  }
}

// ── LEAVES ───────────────────────────────────────────
function drawLeaves(t, p) {
  // Two leaves: left (around y=88) and right (around y=98), pointing outward.
  const baseSway = Math.sin(t * 0.045);
  const jitter = p.shake > 0 ? Math.sin(t * 0.6) * p.shake * 0.05 : 0;

  // Left leaf
  {
    const attachY = 88;
    const attachX = CX + Math.round(baseSway * 0.6) - 3;
    const angle = Math.PI - Math.PI / 7 + Math.sin(t * 0.06) * 0.05 + jitter;
    drawTeardrop(attachX, attachY, angle, 17, 9,
      { out: C.out, hi: C.leafHi, lit: C.leafLit, mid: C.leafMid, dark: C.leafDark },
      { litSide: -1, seam: C.leafVein });
  }
  // Right leaf
  {
    const attachY = 98;
    const attachX = CX + Math.round(baseSway * 0.6) + 3;
    const angle = -Math.PI / 7 + Math.sin(t * 0.06 + 1.2) * 0.05 - jitter;
    drawTeardrop(attachX, attachY, angle, 17, 9,
      { out: C.out, hi: C.leafHi, lit: C.leafLit, mid: C.leafMid, dark: C.leafDark },
      { litSide: -1, seam: C.leafVein });
  }
}

// ── PETALS ───────────────────────────────────────────
function drawPetals(t, p, layer) {
  // Two passes: 'back' (petal points upward — drawn before disk) and 'front' (petal points
  // downward — drawn after disk). Closed bud → all petals are 'back' so disk + face stay
  // visible below the upward cluster.
  const breath = Math.sin(t * 0.06) * 0.4;
  const diskR = 9 + p.openT * 3;

  for (let i = 0; i < NUM_PETALS; i++) {
    const openAngle = (i / NUM_PETALS) * Math.PI * 2 - Math.PI / 2;
    // Closed: petals fan upward within a 60° cone so the bud reads as a teardrop.
    const closedAngle = -Math.PI / 2 + ((i - (NUM_PETALS - 1) / 2) / NUM_PETALS) * 1.05;
    const angle = closedAngle * (1 - p.openT) + openAngle * p.openT;

    const isFront = Math.sin(angle) > 0;
    if (layer === 'back'  &&  isFront) continue;
    if (layer === 'front' && !isFront) continue;

    // Length / width over the open transition.
    const length = (11 + breath) * (1 - p.openT) + (15 + breath * 0.5) * p.openT;
    const width = 9 * (1 - p.openT) + 7 * p.openT;

    // Base at disk edge, so the petal appears to grow out of the disk surface.
    const baseOffset = diskR - 3;
    const baseX = CX + Math.cos(angle) * baseOffset;
    const baseY = CY + Math.sin(angle) * baseOffset;

    // Tiny per-petal tip wobble when roaring (the flower vibrates)
    let wobAngle = 0;
    if (p.shake > 0) wobAngle = Math.sin(t * 0.9 + i * 1.7) * 0.05 * p.shake;

    drawTeardrop(baseX, baseY, angle + wobAngle, length, width,
      { out: C.out, hi: C.petalHi, lit: C.petalLit, mid: C.petalMid, dark: C.petalDark },
      { litSide: -1, seam: C.petalHi });
  }
}

// ── CENTER DISK ──────────────────────────────────────
// Round disk that holds the face. Radius grows slightly when the flower is open.
function drawDisk(t, p) {
  const baseR = 9;
  const r = baseR + p.openT * 3;  // 9 (closed bud-tight) → 12 (open)
  const jitterX = p.shake > 0 ? Math.round((Math.random() - 0.5) * 2 * p.shake) : 0;
  const jitterY = p.shake > 0 ? Math.round((Math.random() - 0.5) * 2 * p.shake) : 0;
  const cx = CX + jitterX;
  const cy = CY + jitterY;

  // Filled disk with 3-step shading and outline.
  for (let dy = -Math.ceil(r) - 1; dy <= Math.ceil(r) + 1; dy++) {
    for (let dx = -Math.ceil(r) - 1; dx <= Math.ceil(r) + 1; dx++) {
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > r + 0.4) continue;
      let color;
      if (dist > r - 0.6) color = C.centerOut;
      else if (dist > r - 1.6) color = C.centerDark;
      else {
        // upper-left lit, lower-right shadow
        const angle = Math.atan2(dy, dx);
        const lit = Math.cos(angle - (-Math.PI * 0.75)); // -135° = upper-left
        if (lit > 0.5)  color = C.centerHi;
        else if (lit > 0.0) color = C.centerLit;
        else if (lit > -0.5) color = C.centerMid;
        else color = C.centerDark;
      }
      px(color, cx + dx, cy + dy);
    }
  }
  // Specular pip
  px('#ffd860', cx - Math.round(r * 0.55), cy - Math.round(r * 0.55));
}

// ── FACE: BROWS + EYES + MOUTH ───────────────────────
function drawFace(t, p) {
  const jx = p.shake > 0 ? Math.round((Math.random() - 0.5) * 2 * p.shake) : 0;
  const jy = p.shake > 0 ? Math.round((Math.random() - 0.5) * 2 * p.shake) : 0;
  const fx = CX + jx;
  const fy = CY + jy;

  // Eye positions sit on the upper half of the disk so the mouth has room below.
  const eyeSpread = 4 + Math.round(p.openT * 1.0);
  const eyeY = fy - 5;
  const eyeRX = fx + eyeSpread;
  const eyeLX = fx - eyeSpread;

  // ── BROWS (angry V) ──
  const browTilt = 1 + p.roarT * 0.4;
  drawBrow(eyeLX, eyeY - 3, +1, browTilt);
  drawBrow(eyeRX, eyeY - 3, -1, browTilt);

  // ── EYES ──
  const eyeW = 2 + Math.round(p.roarT * 1);
  const eyeH = 1 + Math.round(p.roarT * 1);
  drawEye(eyeLX, eyeY, eyeW, eyeH, p);
  drawEye(eyeRX, eyeY, eyeW, eyeH, p);

  // ── MOUTH ──
  if (p.openT < 0.2) {
    // Closed bud: tiny clenched scowl line with two fang hints
    px(C.mouthOut, fx - 3, fy + 3, 7, 1);
    px(C.tooth,    fx - 2, fy + 3, 5, 1);
    px(C.mouthOut, fx - 2, fy + 4);
    px(C.mouthOut, fx + 2, fy + 4);
  } else {
    drawMouth(fx, fy + 3, p);
  }
}

function drawBrow(cx, cy, dir, tilt) {
  // dir = +1: left brow (inner side is to the RIGHT, outer to the LEFT)
  // dir = -1: right brow (inner side is to the LEFT, outer to the RIGHT)
  // Angry V: INNER end LOW (larger y), OUTER end HIGH (smaller y).
  const len = 6;
  for (let i = 0; i < len; i++) {
    // i=0 outer → i=len-1 inner
    const dx = (-3 + i) * dir;
    const yOff = Math.round((-1 + (i / (len - 1)) * 3) * tilt);
    px(C.brow, cx + dx, cy + yOff, 1, 2);
  }
  // Snarl bunch at the inner tip
  const innerDx = 2 * dir;
  px(C.brow, cx + innerDx, cy + Math.round(2 * tilt) + 1);
}

function drawEye(cx, cy, halfW, halfH, p) {
  // White oval
  for (let dy = -halfH; dy <= halfH; dy++) {
    for (let dx = -halfW; dx <= halfW; dx++) {
      const e = (dx*dx) / (halfW*halfW + 0.01) + (dy*dy) / (halfH*halfH + 0.01);
      if (e > 1.15) continue;
      let color;
      if (e > 0.85) color = C.eyeOut;
      else color = (dy < 0) ? C.eyeWhiteHi : C.eyeWhite;
      px(color, cx + dx, cy + dy);
    }
  }
  // Pupil: small dark square, drifts slightly during roar
  const drift = p.roarT > 0.5 ? (Math.sin(performance.now() * 0.02) | 0) : 0;
  px(C.pupil, cx + drift, cy);
  if (halfW >= 3) px(C.pupil, cx + drift, cy + 1);
}

// ── MOUTH (opens to a snarling maw with sharp triangle teeth) ──
function drawMouth(cx, cy, p) {
  // Mouth size: grows with roarT. Capped so it never overruns the eyes above.
  const mouthW = Math.round(3 + p.roarT * 6);  // half-width: 3 → 9
  const mouthH = Math.round(2 + p.roarT * 5);  // half-height: 2 → 7
  if (mouthW < 1 || mouthH < 1) return;

  // Fill the maw as a slightly squashed ellipse, with shading inside.
  for (let dy = -mouthH; dy <= mouthH; dy++) {
    for (let dx = -mouthW; dx <= mouthW; dx++) {
      const e = (dx*dx) / (mouthW*mouthW + 0.01) + (dy*dy) / (mouthH*mouthH + 0.01);
      if (e > 1.12) continue;
      let color;
      if (e > 0.88) color = C.mouthOut;
      else if (dy < -mouthH * 0.3) color = C.mouthDark;   // upper interior darkest
      else if (dy >  mouthH * 0.5) color = C.mouthMid;     // floor lit a touch by tongue
      else color = C.mouthDark;
      px(color, cx + dx, cy + dy);
    }
  }

  // Tongue (only when roaring is meaningful)
  if (p.roarT > 0.35 && mouthH >= 3) {
    const tw = Math.round(mouthW * 0.55);
    const th = Math.round(mouthH * 0.45);
    const ty = cy + mouthH - th;
    for (let dy = 0; dy < th; dy++) {
      for (let dx = -tw; dx <= tw; dx++) {
        const e = (dx*dx) / (tw*tw + 0.01) + ((dy - th/2)*(dy - th/2)) / (th*th + 0.01);
        if (e > 1.05) continue;
        const color = (dy < th / 2) ? C.tongueHi : C.tongue;
        px(color, cx + dx, ty + dy);
      }
    }
    // tongue outline along top
    for (let dx = -tw; dx <= tw; dx++) px(C.mouthOut, cx + dx, ty);
  }

  // Triangle teeth — top row pointing down, bottom row pointing up.
  if (p.roarT > 0.25 && mouthW >= 4) {
    const numTeeth = 4 + Math.round(p.roarT * 2); // 4 → 6
    const span = mouthW * 2 - 2;
    const step = span / numTeeth;
    const toothH = Math.max(2, Math.round(mouthH * 0.45));

    // top teeth (point down, sit just inside the upper mouth line)
    for (let i = 0; i < numTeeth; i++) {
      const tx = Math.round(cx - mouthW + 1 + i * step + step / 2);
      drawTooth(tx, cy - mouthH + 1, toothH, +1);
    }
    // bottom teeth (point up, sit on the lower mouth line; offset between top teeth)
    if (p.roarT > 0.6) {
      for (let i = 0; i < numTeeth - 1; i++) {
        const tx = Math.round(cx - mouthW + 1 + i * step + step);
        drawTooth(tx, cy + mouthH - 1, Math.max(2, toothH - 1), -1);
      }
    }
  }
}

function drawTooth(cx, cy, height, dir) {
  // dir: +1 points DOWN (apex below base), -1 points UP (apex above base)
  for (let r = 0; r < height; r++) {
    const halfW = Math.max(0, Math.round((height - r) * 0.6));
    const y = cy + dir * r;
    if (halfW > 0) px(C.tooth, cx - halfW, y, halfW * 2 + 1, 1);
    else px(C.tooth, cx, y);
    // outline edges
    if (halfW >= 1) {
      px(C.mouthOut, cx - halfW, y);
      px(C.mouthOut, cx + halfW, y);
    } else {
      px(C.mouthOut, cx, y);
    }
    // tiny shadow on right side
    if (halfW >= 2) px(C.toothSh, cx + halfW - 1, y);
  }
}

// ── ROAR FX: short radial dashes when roaring ────────
function drawRoarFX(t, p) {
  if (p.roarT < 0.35) return;
  const intensity = (p.roarT - 0.35) / 0.65;
  const numBeams = 10;
  // Pulse: a 12-frame heartbeat
  const beat = ((t % 12) / 12);
  const r0 = 18 + beat * 14;
  for (let i = 0; i < numBeams; i++) {
    const a = (i / numBeams) * Math.PI * 2 + t * 0.02;
    const r1 = r0 + 1 + (i & 1) * 2;
    const x0 = CX + Math.round(Math.cos(a) * r0);
    const y0 = CY + Math.round(Math.sin(a) * r0);
    const x1 = CX + Math.round(Math.cos(a) * r1);
    const y1 = CY + Math.round(Math.sin(a) * r1);
    // Draw a 2-pixel dash
    px(C.roarBeam, x0, y0);
    px(C.roarBeam2, x1, y1);
    if (intensity > 0.6) {
      const x2 = CX + Math.round(Math.cos(a) * (r1 + 2));
      const y2 = CY + Math.round(Math.sin(a) * (r1 + 2));
      px(C.roarBeam, x2, y2);
    }
  }
}

// ── BACKGROUND ───────────────────────────────────────
function drawBackground() {
  // Dark backdrop with a soft nested-rectangle vignette behind the flower.
  px('#08120a', 0, 0, 128, 128);
  px('#0e1a10', 12, 14, 104, 100);
  px('#142214', 22, 24, 84, 78);
  px('#1a2a1a', 32, 32, 64, 58);
}

// ── COMPOSITE ────────────────────────────────────────
function drawFrame(t) {
  ctx.clearRect(0, 0, 128, 128);
  const p = phase(t);

  drawBackground();
  drawStem(t, p);
  drawLeaves(t, p);

  // Z-order: back petals → disk → front petals (so front petals overlap the lower edge of disk)
  drawPetals(t, p, 'back');
  drawDisk(t, p);
  drawFace(t, p);
  drawPetals(t, p, 'front');

  // Roar FX on top of everything
  drawRoarFX(t, p);
}

// ── AUDIO (roar) ─────────────────────────────────────
let audioCtx = null;
let soundOn = false;
let roarLastFired = -1;

function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
}

function fireRoar() {
  if (!soundOn || !audioCtx) return;
  const now = audioCtx.currentTime;
  const dur = (T_ROAR_BUILDUP + T_ROAR_HOLD + T_ROAR_FADE) / 60; // matches roar phase
  // Brown-ish noise via filtered white noise.
  const bufferSize = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    last = (last + 0.04 * white) / 1.04;
    data[i] = last * 4;
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(120, now);
  lp.frequency.linearRampToValueAtTime(360, now + 0.15);
  lp.frequency.linearRampToValueAtTime(220, now + dur);
  lp.Q.value = 4;

  // Pitched growl from a detuned saw.
  const saw = audioCtx.createOscillator();
  saw.type = 'sawtooth';
  saw.frequency.setValueAtTime(70, now);
  saw.frequency.linearRampToValueAtTime(48, now + dur);

  const sawGain = audioCtx.createGain();
  sawGain.gain.setValueAtTime(0.0, now);
  sawGain.gain.linearRampToValueAtTime(0.18, now + 0.08);
  sawGain.gain.linearRampToValueAtTime(0.12, now + dur - 0.1);
  sawGain.gain.linearRampToValueAtTime(0.0, now + dur);

  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.0, now);
  noiseGain.gain.linearRampToValueAtTime(0.35, now + 0.05);
  noiseGain.gain.linearRampToValueAtTime(0.30, now + dur - 0.08);
  noiseGain.gain.linearRampToValueAtTime(0.0, now + dur);

  noise.connect(lp).connect(noiseGain).connect(audioCtx.destination);
  saw.connect(sawGain).connect(audioCtx.destination);

  noise.start(now); noise.stop(now + dur + 0.05);
  saw.start(now);   saw.stop(now + dur + 0.05);
}

// ── LOOP + UI ────────────────────────────────────────
let frame = 0;
let paused = false;

function loop() {
  drawFrame(frame);
  if (!paused) {
    // Fire roar audio at the start of the buildup phase, once per loop.
    const tNow = ((frame % FRAMES) + FRAMES) % FRAMES;
    const roarStart = T_CLOSED + T_OPENING;
    if (soundOn && tNow >= roarStart && tNow < roarStart + 2 && roarLastFired !== Math.floor(frame / FRAMES)) {
      roarLastFired = Math.floor(frame / FRAMES);
      fireRoar();
    }
    frame++;
  }
  requestAnimationFrame(loop);
}
loop();

document.getElementById('soundToggle').addEventListener('click', (e) => {
  ensureAudio();
  soundOn = !soundOn;
  if (soundOn && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  e.target.textContent = 'SOUND: ' + (soundOn ? 'ON' : 'OFF');
});
document.getElementById('pauseToggle').addEventListener('click', (e) => {
  paused = !paused;
  e.target.textContent = paused ? 'PLAY' : 'PAUSE';
});
</script>
