<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Skull — floating rotating gleaming crystal (React Artifact)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(120% 95% at 50% 34%, #150a2e 0%, #0a0518 55%, #03010a 100%);
    color: #c9b6ff; font: 14px/1.5 system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  #root { width: 100%; }
  .wrap { display: flex; flex-direction: column; align-items: center; padding: 22px 16px 40px; }
  h1 { font-weight: 600; letter-spacing: .1em; margin: 6px 0 2px; color: #ecdcff;
       text-shadow: 0 0 18px rgba(170,90,255,.5); }
  .sub { opacity: .6; margin: 0 0 16px; max-width: 560px; text-align: center; font-size: 12.5px; }
  canvas {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    width: min(80vw, 540px); height: auto; aspect-ratio: 1 / 1;
    background: #06030f;
    border-radius: 6px;
    filter: drop-shadow(0 0 40px rgba(150, 80, 255, .45));
  }
  .row { display: flex; gap: 9px; margin: 16px 0 0; flex-wrap: wrap; justify-content: center; }
  button {
    background: #1c1138; color: #e3d4ff; border: 1px solid #4a2f80;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit;
  }
  button[data-on="true"] { background: #432a78; border-color: #7a52c8; }
  .palette-strip { display: flex; gap: 6px; margin: 0 0 14px; }
  .swatch { width: 22px; height: 22px; border: 2px solid #06030f; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>

<!-- ════════════════════════════════════════════════════════════════
     RENDERING ENGINE  (plain JS — charted 3D mesh, pixel-perfect)
     A real parametric skull surface (charted cross-sections + carved
     sockets/nasal/teeth) software-rasterized as translucent crystal.
     Kept separate from the React/JSX layer so it's framework-agnostic
     and independently testable.
════════════════════════════════════════════════════════════════════ -->
<script id="engine">
window.CrystalSkullEngine = (function () {
  const W = 96, H = 96, CX = 48, TAU = Math.PI * 2;
  const SCALE = 31, CY = 49;            // projection: model units → pixels
  const clamp = (v,a,b)=> v<a?a:v>b?b:v;

  // ── THEMES (cool interior/shadow → neon highlight) ──────────────────
  const THEME = {
    amethyst: { deep:[26,12,52], mid:[92,40,150], surf:[176,96,224], rim:[120,235,255],
                glow:[190,90,255], spark:[245,235,255], halo:[120,55,200] },
    glacier:  { deep:[10,28,64],  mid:[36,110,180], surf:[120,210,245], rim:[200,250,255],
                glow:[110,210,255], spark:[245,253,255], halo:[60,130,210] },
    venom:    { deep:[10,40,30],  mid:[40,140,84],  surf:[150,235,140], rim:[210,255,170],
                glow:[120,255,150], spark:[240,255,225], halo:[60,170,90] },
  };
  const lerp3 = (a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];

  // ── deterministic hashes ────────────────────────────────────────────
  function hash3(x,y,z){
    let n=((x|0)*92837111)^((y|0)*689287499)^((z|0)*283923481);
    n=(n^(n>>>13))>>>0; return ((n*(n*15731+789221)+1376312589)>>>0)/4294967296;
  }

  // ── 1. CHARTED SKULL PROFILE (radius & height vs v) ─────────────────
  // v: 0 = chin, 1 = crown.  Explicit control points → no drift.
  const A_PTS = [ [0.00,0.10],[0.05,0.24],[0.10,0.37],[0.15,0.47],[0.20,0.55],
    [0.26,0.65],[0.32,0.75],[0.38,0.84],[0.44,0.91],[0.50,0.95],[0.56,0.97],
    [0.63,0.96],[0.70,0.92],[0.77,0.84],[0.84,0.72],[0.90,0.56],[0.95,0.37],[1.00,0.05] ];
  function interp(pts,v){
    if (v<=pts[0][0]) return pts[0][1];
    if (v>=pts[pts.length-1][0]) return pts[pts.length-1][1];
    for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1];
      if(v>=a[0]&&v<=b[0]){ const t=(v-a[0])/(b[0]-a[0]); return a[1]+(b[1]-a[1])*t; } }
    return 0;
  }
  const widthR = v => interp(A_PTS,v);
  const yOf    = v => -1.12 + 2.12 * v;           // model height
  const YC = (yOf(0)+yOf(1))/2;

  function angDiff(u,uc){ let d=u-uc; while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU; return d; }

  // Feature relief: signed radial offset + cavity scalar (carved into the form)
  const TEETH_FREQ = 18;
  function relief(u,v){
    let off=0, cav=0, tooth=0;
    // eye sockets — deep round cavities
    for(const s of [-1,1]){
      const du=angDiff(u,s*0.46)/0.30, dv=(v-0.555)/0.072;
      const g=Math.exp(-(du*du+dv*dv)); off-=0.26*g; cav=Math.max(cav,g);
    }
    // nasal aperture — vertical teardrop
    { const du=angDiff(u,0)/0.115, dv=(v-0.45)/0.075; const g=Math.exp(-(du*du+dv*dv));
      off-=0.20*g; cav=Math.max(cav,g*0.95);
      const du2=angDiff(u,0)/0.16, dv2=(v-0.405)/0.028; off-=0.07*Math.exp(-(du2*du2+dv2*dv2)); }
    // mouth groove + carved teeth (connected to the jaw)
    { const inM=Math.abs(angDiff(u,0))<0.62; const dv=(v-0.305)/0.030; const band=Math.exp(-dv*dv);
      if(inM){ off-=0.135*band; cav=Math.max(cav,band*0.85);
        const t=Math.max(0,Math.cos(angDiff(u,0)*TEETH_FREQ)); tooth=t*band;
        off+=0.075*tooth;
        const gd=(v-0.305)/0.006; const gap=Math.exp(-(gd*gd)); off-=0.05*gap*inM; } }   // upper/lower split
    // brow ridge (raised)
    { const du=angDiff(u,0)/0.55, dv=(v-0.62)/0.028; off+=0.045*Math.exp(-(du*du+dv*dv)); }
    // cheekbones (raised)
    for(const s of [-1,1]){ const du=angDiff(u,s*0.72)/0.26, dv=(v-0.43)/0.07;
      off+=0.055*Math.exp(-(du*du+dv*dv)); }
    // temple hollows (slight)
    for(const s of [-1,1]){ const du=angDiff(u,s*1.0)/0.3, dv=(v-0.6)/0.09;
      off-=0.03*Math.exp(-(du*du+dv*dv)); }
    return [off,cav,tooth];
  }

  // surface point + analytic-ish normal (finite diff) at (u,v)
  function posN(u,v){
    const P = (u,v)=>{
      const A=widthR(v); const r=A+relief(u,v)[0];
      const su=Math.sin(u), cu=Math.cos(u);
      const cd=(v-0.07)/0.07; const chin=0.20*Math.exp(-(cd*cd))*Math.max(0,cu)*Math.max(0,cu);
      return [ r*su*1.0, yOf(v), r*cu*1.08 + chin ];
    };
    const p=P(u,v);
    const e=0.012;
    const pu=P(u+e,v), pv=P(u,Math.min(1,v+e));
    const du=[pu[0]-p[0],pu[1]-p[1],pu[2]-p[2]];
    const dv=[pv[0]-p[0],pv[1]-p[1],pv[2]-p[2]];
    let nx=du[1]*dv[2]-du[2]*dv[1], ny=du[2]*dv[0]-du[0]*dv[2], nz=du[0]*dv[1]-du[1]*dv[0];
    const l=Math.hypot(nx,ny,nz)||1; nx/=l; ny/=l; nz/=l;
    // orient outward (away from vertical axis)
    if (nx*Math.sin(u)+nz*Math.cos(u) < 0){ nx=-nx; ny=-ny; nz=-nz; }
    const rel=relief(u,v);
    return { p, n:[nx,ny,nz], cav:rel[1], tooth:rel[2] };
  }

  // ── 2. BUILD STATIC MESH (charted grid) ─────────────────────────────
  const NU=64, NV=46;
  const VC=(NU)*(NV+1);
  const MPX=new Float32Array(VC), MPY=new Float32Array(VC), MPZ=new Float32Array(VC);
  const MNX=new Float32Array(VC), MNY=new Float32Array(VC), MNZ=new Float32Array(VC);
  const MCAV=new Float32Array(VC), MTOOTH=new Float32Array(VC);
  function vIdx(iu,iv){ return iv*NU + (iu%NU); }
  for(let iv=0; iv<=NV; iv++){
    const v=iv/NV;
    for(let iu=0; iu<NU; iu++){
      const u=iu/NU*TAU;
      const s=posN(u,v); const k=vIdx(iu,iv);
      MPX[k]=s.p[0]; MPY[k]=s.p[1]; MPZ[k]=s.p[2];
      MNX[k]=s.n[0]; MNY[k]=s.n[1]; MNZ[k]=s.n[2];
      MCAV[k]=s.cav; MTOOTH[k]=s.tooth;
    }
  }
  // triangle list (two per quad)
  const TRIS=[];
  for(let iv=0; iv<NV; iv++) for(let iu=0; iu<NU; iu++){
    const a=vIdx(iu,iv), b=vIdx(iu+1,iv), c=vIdx(iu,iv+1), d=vIdx(iu+1,iv+1);
    TRIS.push(a,b,c, b,d,c);
  }

  // sparkle hero-anchors stuck to the surface (forehead, cheek, a tooth)
  const ANCHORS=[ posN(0,0.66), posN(-0.62,0.43), posN(0.30,0.305), posN(0.55,0.50) ];

  // per-frame transformed vertex arrays
  const TX=new Float32Array(VC), TY=new Float32Array(VC), TZ=new Float32Array(VC);
  const RNX=new Float32Array(VC), RNY=new Float32Array(VC), RNZ=new Float32Array(VC);
  const zbuf=new Float32Array(W*H);

  function create(){ return { angle:0.35, bobT:0, lastT:-1, parts:[], emit:0 }; }

  // ── 3. RENDER A FRAME ───────────────────────────────────────────────
  function render(buf, st, timeMs, opts){
    opts=opts||{};
    const theme = THEME[opts.theme]?opts.theme:'amethyst';
    const TH = THEME[theme];
    const speed = opts.speed==null?1:opts.speed;
    const dir = opts.dir||1;
    let dt = st.lastT<0?16:(timeMs-st.lastT); dt=clamp(dt,0,60); st.lastT=timeMs;
    if(!opts.paused){ st.angle += dt*0.00060*speed*dir; st.bobT += dt; }
    const th=st.angle, ct=Math.cos(th), sn=Math.sin(th);
    const bob = Math.sin(st.bobT*0.0016)*2.6;
    const pulse = 0.5+0.5*Math.sin(st.bobT*0.0034);
    const time = st.bobT;

    // background gradient + breathing halo
    for(let y=0;y<H;y++){ const t=y/H, r=12+t*8,g=6+t*6,b=24+t*16;
      for(let x=0;x<W;x++){ const i=(y*W+x)*4; buf[i]=r;buf[i+1]=g;buf[i+2]=b;buf[i+3]=255; } }
    const hcx=CX, hcy=CY-2+bob;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const dx=(x-hcx)/40,dy=(y-hcy)/44,d=dx*dx+dy*dy;
      if(d>1)continue; const g=(1-d)*(1-d)*(0.45+0.55*pulse); const i=(y*W+x)*4;
      buf[i]=Math.min(255,buf[i]+TH.halo[0]*0.22*g); buf[i+1]=Math.min(255,buf[i+1]+TH.halo[1]*0.22*g); buf[i+2]=Math.min(255,buf[i+2]+TH.halo[2]*0.24*g); }

    // back aura particles (behind the skull)
    drawParticles(buf,st,false,bob,TH);

    // transform vertices
    for(let k=0;k<VC;k++){
      const x=MPX[k],z=MPZ[k];
      const xr=x*ct+z*sn, zr=-x*sn+z*ct;
      TX[k]=CX+xr*SCALE; TY[k]=CY-(MPY[k]-YC)*SCALE+bob; TZ[k]=zr;
      const nx=MNX[k],nz=MNZ[k];
      RNX[k]=nx*ct+nz*sn; RNY[k]=MNY[k]; RNZ[k]=-nx*sn+nz*ct;
    }
    zbuf.fill(-1e9);

    // light + half vectors
    const L1=[-0.42,0.50,0.76], L2=[0.55,0.12,0.55];
    const H1=norm3(L1[0],L1[1],L1[2]+1), H2=norm3(L2[0],L2[1],L2[2]+1);

    // rasterize
    for(let t=0;t<TRIS.length;t+=3){
      const i0=TRIS[t],i1=TRIS[t+1],i2=TRIS[t+2];
      // backface cull (keep front hemisphere)
      if(RNZ[i0]+RNZ[i1]+RNZ[i2] <= 0.02) continue;
      rasterTri(buf,i0,i1,i2,TH,H1,H2,L1,L2,pulse,time);
    }

    // hero star sparkles anchored to the surface
    for(let a=0;a<ANCHORS.length;a++){
      const A=ANCHORS[a]; const x=A.p[0],z=A.p[2];
      const zr=-x*sn+z*ct; const nx=A.n[0]*ct+A.n[2]*sn, nz=-A.n[0]*sn+A.n[2]*ct;
      if(nz<=0.15) continue;                                   // only when facing us
      const sx=CX+(x*ct+z*sn)*SCALE, sy=CY-(A.p[1]-YC)*SCALE+bob;
      const ph=a*1.7; const tw=Math.pow(Math.max(0,Math.sin(time*0.006+ph)),6)*nz;
      if(tw<0.05) continue;
      star(buf, sx|0, sy|0, tw, TH.spark);
    }

    // bloom for the gleam
    bloom(buf);

    // front aura particles
    updateParticles(st,dt,bob,opts);
    drawParticles(buf,st,true,bob,TH);
  }

  function norm3(x,y,z){ const l=Math.hypot(x,y,z)||1; return [x/l,y/l,z/l]; }

  // ── per-pixel crystal shading inside the triangle rasterizer ────────
  function rasterTri(buf,i0,i1,i2,TH,H1,H2,L1,L2,pulse,time){
    let ax=TX[i0],ay=TY[i0], bx=TX[i1],by=TY[i1], cx=TX[i2],cy=TY[i2];
    const area=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax);
    if(area===0) return;
    const inv=1/area;
    let minX=Math.max(0,Math.floor(Math.min(ax,bx,cx)));
    let maxX=Math.min(W-1,Math.ceil(Math.max(ax,bx,cx)));
    let minY=Math.max(0,Math.floor(Math.min(ay,by,cy)));
    let maxY=Math.min(H-1,Math.ceil(Math.max(ay,by,cy)));
    for(let y=minY;y<=maxY;y++){
      for(let x=minX;x<=maxX;x++){
        const px=x+0.5,py=y+0.5;
        let w0=((bx-ax)*(py-ay)-(by-ay)*(px-ax))*inv;   // weight of i2
        let w1=((cx-bx)*(py-by)-(cy-by)*(px-bx))*inv;   // weight of i0
        let w2=1-w0-w1;                                  // weight of i1
        if(w0<-0.0001||w1<-0.0001||w2<-0.0001) continue;
        const z=w1*TZ[i0]+w2*TZ[i1]+w0*TZ[i2];
        const idxz=y*W+x; if(z<=zbuf[idxz]) continue; zbuf[idxz]=z;
        // interpolate
        let nx=w1*RNX[i0]+w2*RNX[i1]+w0*RNX[i2];
        let ny=w1*RNY[i0]+w2*RNY[i1]+w0*RNY[i2];
        let nz=w1*RNZ[i0]+w2*RNZ[i1]+w0*RNZ[i2];
        const nl=Math.hypot(nx,ny,nz)||1; nx/=nl;ny/=nl;nz/=nl;
        const cav=w1*MCAV[i0]+w2*MCAV[i1]+w0*MCAV[i2];
        const tooth=w1*MTOOTH[i0]+w2*MTOOTH[i1]+w0*MTOOTH[i2];
        const mx=w1*MPX[i0]+w2*MPX[i1]+w0*MPX[i2];
        const my=w1*MPY[i0]+w2*MPY[i1]+w0*MPY[i2];
        const mz=w1*MPZ[i0]+w2*MPZ[i1]+w0*MPZ[i2];

        const ndv=clamp(nz,0,1);
        // base glass color: deep interior → bright surface by facing, cooled in cavities
        let col = lerp3(TH.deep, TH.surf, Math.pow(ndv,0.8));
        col = lerp3(col, TH.mid, 0.35);
        if(cav>0.02){ col = lerp3(col, TH.deep, Math.min(0.92,cav*1.1)); }   // sockets darker/internal
        // diffuse-ish gentle modeling
        const d1=Math.max(0,nx*L1[0]+ny*L1[1]+nz*L1[2]);
        const d2=Math.max(0,nx*L2[0]+ny*L2[1]+nz*L2[2]);
        let r=col[0]*(0.55+0.5*d1+0.22*d2);
        let g=col[1]*(0.55+0.5*d1+0.22*d2);
        let b=col[2]*(0.55+0.5*d1+0.22*d2);
        // teeth read brighter (ivory crystal)
        if(tooth>0.15){ const tt=Math.min(1,(tooth-0.15)*2.0); r=r+(238-r)*tt; g=g+(244-g)*tt; b=b+(252-b)*tt; }
        // translucent internal glow — through thin/edge areas & out of cavities
        const glow=(0.30+0.55*pulse)*(0.5*(1-ndv)+cav*0.30+0.10);
        r+=TH.glow[0]*0.18*glow; g+=TH.glow[1]*0.18*glow; b+=TH.glow[2]*0.18*glow;
        // neon Fresnel rim (glassy edge)
        const fres=Math.pow(1-ndv,2.4);
        r+=(TH.rim[0]-r)*fres*0.6; g+=(TH.rim[1]-g)*fres*0.6; b+=(TH.rim[2]-b)*fres*0.6;
        // sharp specular gleam (two lights)
        const s1=Math.pow(Math.max(0,nx*H1[0]+ny*H1[1]+nz*H1[2]),46);
        const s2=Math.pow(Math.max(0,nx*H2[0]+ny*H2[1]+nz*H2[2]),70);
        const sp=s1*0.95+s2*0.7; r+=sp*190; g+=sp*195; b+=sp*205;
        // twinkling micro-sparkles stuck to the crystal
        const qx=Math.round(mx*7.5),qy=Math.round(my*7.5),qz=Math.round(mz*7.5);
        if(hash3(qx,qy,qz)>0.86 && ndv>0.25){
          const phase=hash3(qx+9,qy-4,qz+7)*TAU;
          const tw=Math.pow(Math.max(0,Math.sin(time*0.009+phase)),10);
          r+=tw*255; g+=tw*255; b+=tw*255;
        }
        const o=idxz*4;
        buf[o]=Math.min(255,r); buf[o+1]=Math.min(255,g); buf[o+2]=Math.min(255,b); buf[o+3]=255;
      }
    }
  }

  // additive star sprite (gleam)
  function star(buf,cx,cy,inten,col){
    const add=(x,y,a)=>{ if(x<0||x>=W||y<0||y>=H)return; const i=(y*W+x)*4;
      buf[i]=Math.min(255,buf[i]+col[0]*a); buf[i+1]=Math.min(255,buf[i+1]+col[1]*a); buf[i+2]=Math.min(255,buf[i+2]+col[2]*a); };
    add(cx,cy,inten);
    for(let r=1;r<=3;r++){ const a=inten*(1-r/4);
      add(cx+r,cy,a); add(cx-r,cy,a); add(cx,cy+r,a); add(cx,cy-r,a); }
    add(cx+1,cy+1,inten*0.4); add(cx-1,cy-1,inten*0.4); add(cx+1,cy-1,inten*0.4); add(cx-1,cy+1,inten*0.4);
  }

  // cheap bloom: bright pixels bleed into neighbours (the magical gleam)
  const bloomSrc=new Float32Array(W*H);
  function bloom(buf){
    for(let i=0;i<W*H;i++){ const o=i*4; const lum=(buf[o]+buf[o+1]+buf[o+2])/3;
      bloomSrc[i]= lum>180 ? (lum-180)/75 : 0; }
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const s=bloomSrc[y*W+x]; if(s<=0.02)continue;
      const a=s*0.5;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy)continue;
        const nx=x+dx,ny=y+dy; if(nx<0||nx>=W||ny<0||ny>=H)continue; const o=(ny*W+nx)*4; const w=(dx&&dy)?0.5:1;
        buf[o]=Math.min(255,buf[o]+30*a*w); buf[o+1]=Math.min(255,buf[o+1]+30*a*w); buf[o+2]=Math.min(255,buf[o+2]+34*a*w); } }
  }

  // ── 4. PARTICLE AURA (dense, twinkling, clustered) ──────────────────
  function updateParticles(st,dt,bob,opts){
    const sec=dt/1000;
    for(let i=st.parts.length-1;i>=0;i--){ const p=st.parts[i]; p.life-=sec;
      if(p.life<=0){ st.parts.splice(i,1); continue; }
      p.x+=p.vx*sec+Math.sin(p.t+st.bobT*0.003)*0.18; p.y+=p.vy*sec; p.vy+=5*sec; p.t+=sec; }
    if(opts.paused) return;
    st.emit+=dt*0.10;
    while(st.emit>1 && st.parts.length<110){ st.emit-=1;
      const a=Math.random()*TAU, rr=20+Math.random()*16;
      st.parts.push({ x:CX+Math.cos(a)*rr*0.95, y:CY+Math.sin(a)*rr,
        vx:(Math.random()-0.5)*7, vy:-(8+Math.random()*14),
        life:0.7+Math.random()*1.2, t:Math.random()*6,
        big:Math.random()<0.28, front:Math.random()<0.5, hot:Math.random()<0.4 }); }
  }
  function drawParticles(buf,st,front,bob,TH){
    const add=(x,y,r,g,b)=>{ x|=0;y|=0; if(x<0||x>=W||y<0||y>=H)return; const i=(y*W+x)*4;
      buf[i]=Math.min(255,buf[i]+r); buf[i+1]=Math.min(255,buf[i+1]+g); buf[i+2]=Math.min(255,buf[i+2]+b); };
    for(const p of st.parts){ if(!!p.front!==front) continue;
      const f=clamp(p.life/1.2,0,1); const tw=(0.55+0.45*Math.sin(p.t*10+p.x))*f;
      const c=p.hot?[255*tw,240*tw,255*tw]:[TH.glow[0]*tw,TH.glow[1]*tw,TH.glow[2]*tw];
      add(p.x,p.y,c[0],c[1],c[2]);
      if(p.big){ add(p.x+1,p.y,c[0]*0.5,c[1]*0.5,c[2]*0.5); add(p.x-1,p.y,c[0]*0.5,c[1]*0.5,c[2]*0.5);
        add(p.x,p.y+1,c[0]*0.5,c[1]*0.5,c[2]*0.5); add(p.x,p.y-1,c[0]*0.5,c[1]*0.5,c[2]*0.5); } }
  }

  return { W, H, create, render, themes:Object.keys(THEME) };
})();
</script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useRef, useEffect, useState } = React;
const E = window.CrystalSkullEngine;

function CrystalSkull() {
  const canvasRef = useRef(null);
  const optsRef = useRef({ speed: 1, dir: 1, theme: 'amethyst', paused: false });
  const [ui, setUi] = useState({ speed: 1, dir: 1, theme: 'amethyst', paused: false });
  useEffect(() => { optsRef.current = { ...ui }; }, [ui]);

  useEffect(() => {
    const cv = canvasRef.current;
    cv.width = E.W; cv.height = E.H;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;          // CRITICAL — crisp 16-bit pixels
    const img = ctx.createImageData(E.W, E.H);
    const st = E.create();
    let raf;
    const loop = (t) => { E.render(img.data, st, t, optsRef.current); ctx.putImageData(img, 0, 0); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);

  const themes = E.themes;
  const swatches = { amethyst: ['#3a1d6e','#ff6ed2','#9af0ff'],
                     glacier:  ['#1c4e8c','#46c4e8','#f7ffff'],
                     venom:    ['#186048','#6edc6e','#eaffaa'] };

  return (
    <div className="wrap">
      <h1>CRYSTAL SKULL</h1>
      <p className="sub">A floating, slowly rotating gleaming crystal skull — a charted 3D parametric mesh
        with carved sockets, nasal cavity and connected teeth, rendered as translucent glass: internal glow,
        neon Fresnel edges, sharp specular gleam and twinkling sparkles. 96×96 native, pixel-perfect.</p>
      <div className="palette-strip">
        {swatches[ui.theme].map((c,i) => <div key={i} className="swatch" style={{background:c}} />)}
      </div>
      <canvas ref={canvasRef} />
      <div className="row">
        <button data-on={ui.paused} onClick={() => setUi(s => ({...s, paused: !s.paused}))}>{ui.paused ? 'Play' : 'Pause'}</button>
        <button data-on={ui.speed !== 1} onClick={() => setUi(s => ({...s, speed: s.speed === 1 ? 0.4 : s.speed === 0.4 ? 2 : 1}))}>Speed ×{ui.speed}</button>
        <button data-on={ui.dir === -1} onClick={() => setUi(s => ({...s, dir: -s.dir}))}>Reverse</button>
        {themes.map(th => (
          <button key={th} data-on={ui.theme === th} onClick={() => setUi(s => ({...s, theme: th}))}>{th[0].toUpperCase() + th.slice(1)}</button>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<CrystalSkull />);
</script>
