<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetaPixel — Asset Foundry</title>
<style>
  :root {
    --bg: #0d0d10;
    --panel: #17181c;
    --panel-edge: #2a2c33;
    --ink: #eaeaea;
    --ink-dim: #9aa0aa;
    --accent: #ff8a3d;
    --accent-hot: #ffd23f;
    --accent-cold: #4cc3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: 'Courier New', ui-monospace, Menlo, monospace;
    line-height: 1.55;
    padding: 28px 20px 80px;
    max-width: 980px;
    margin: 0 auto;
  }
  header { border-bottom: 1px solid var(--panel-edge); padding-bottom: 18px; margin-bottom: 24px; }
  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
  }
  header p { margin: 8px 0 0; color: var(--ink-dim); font-size: 13px; letter-spacing: 0.08em; }
  .project {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    padding: 20px;
    margin-bottom: 28px;
    border-radius: 4px;
  }
  .project h2 {
    margin: 0 0 6px;
    font-size: 18px;
    color: var(--accent-hot);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .project .meta { color: var(--ink-dim); font-size: 12px; margin-bottom: 16px; letter-spacing: 0.06em; }
  .stage {
    background: #ffffff;
    border: 1px solid var(--panel-edge);
    padding: 12px;
    display: inline-block;
    border-radius: 2px;
  }
  canvas.display {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    width: 512px;
    height: 512px;
    max-width: 100%;
    height: auto;
    aspect-ratio: 1/1;
  }
  .controls { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    background: var(--accent);
    color: #1a1a1a;
    border: 0;
    padding: 10px 18px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.12s;
  }
  button:hover:not(:disabled) { background: var(--accent-hot); }
  button:disabled { background: #3a3c42; color: #6a6e76; cursor: progress; }
  button.ghost {
    background: transparent;
    color: var(--accent-cold);
    border: 1px solid var(--accent-cold);
  }
  button.ghost:hover:not(:disabled) { background: var(--accent-cold); color: #0a0a0a; }
  .status {
    margin-top: 10px;
    font-size: 12px;
    color: var(--ink-dim);
    min-height: 1.2em;
    letter-spacing: 0.04em;
  }
  .status.ok { color: var(--accent-hot); }
  .status.err { color: #ff6464; }
  footer { color: var(--ink-dim); font-size: 11px; text-align: center; margin-top: 40px; letter-spacing: 0.1em; }
  footer a { color: var(--accent-cold); text-decoration: none; }
</style>
</head>
<body>

<header>
  <h1>MetaPixel</h1>
  <p>Pixel art foundry — animations and stills, 512×512 GIF + PNG ready for download.</p>
</header>

<!-- ─────────────────────────────────────────────────────────────────── -->
<!-- PROJECT 01 — Roaring Fire Loop                                       -->
<!-- ─────────────────────────────────────────────────────────────────── -->
<section class="project" id="project-fire">
  <h2>01 — Roaring Fire Loop</h2>
  <div class="meta">Single hero flame · 4 tendrils + pale-yellow base + rising sparks · 30-frame seamless loop @ 15fps · 512×512 GIF</div>
  <div class="stage">
    <canvas id="fire-display" class="display" width="64" height="64"></canvas>
  </div>
  <div class="controls">
    <button id="fire-gif">Download GIF</button>
    <button id="fire-png" class="ghost">Download PNG (current frame)</button>
  </div>
  <div class="status" id="fire-status">Ready.</div>
</section>

<footer>
  Built with vanilla canvas2D · GIFs encoded by <a href="https://github.com/jnordberg/gif.js" target="_blank" rel="noopener">gif.js</a>
</footer>

<!-- gif.js for export -->
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════
// SHARED UTILITIES
// ═══════════════════════════════════════════════════════════════════════

function px(ctx, color, x, y, w, h) {
  ctx.fillStyle = color;
  ctx.fillRect(x | 0, y | 0, (w || 1) | 0, (h || 1) | 0);
}

// Fetch the gif.js worker script and turn it into a same-origin blob URL.
// This sidesteps the CORS blocks some browsers apply to cross-origin Workers.
let gifWorkerUrlPromise = null;
function getGifWorkerUrl() {
  if (gifWorkerUrlPromise) return gifWorkerUrlPromise;
  gifWorkerUrlPromise = fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js')
    .then(r => r.text())
    .then(t => URL.createObjectURL(new Blob([t], { type: 'application/javascript' })));
  return gifWorkerUrlPromise;
}

// Build a 512×512 export canvas by drawing the native-res scene and
// nearest-neighbor scaling it up.
function makeExportCanvas(drawScene, nativeSize, t) {
  const native = document.createElement('canvas');
  native.width = nativeSize; native.height = nativeSize;
  const nctx = native.getContext('2d');
  nctx.imageSmoothingEnabled = false;
  drawScene(nctx, nativeSize, nativeSize, t);

  const out = document.createElement('canvas');
  out.width = 512; out.height = 512;
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = false;
  octx.drawImage(native, 0, 0, 512, 512);
  return out;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}

// Render a project to GIF given a draw callback, frame count, fps, native size.
async function renderGif({ drawScene, nativeSize, frames, fps, filename, statusEl, button }) {
  button.disabled = true;
  statusEl.className = 'status';
  statusEl.textContent = 'Loading encoder…';
  try {
    const workerUrl = await getGifWorkerUrl();
    const gif = new GIF({
      workers: 2,
      quality: 1,
      width: 512,
      height: 512,
      workerScript: workerUrl,
    });
    const delay = Math.round(1000 / fps);
    for (let f = 0; f < frames; f++) {
      const c = makeExportCanvas(drawScene, nativeSize, f);
      gif.addFrame(c, { delay });
      statusEl.textContent = `Rendering frame ${f + 1}/${frames}…`;
      // yield to let the UI breathe
      await new Promise(r => setTimeout(r, 0));
    }
    statusEl.textContent = 'Compressing GIF…';
    await new Promise((resolve, reject) => {
      gif.on('progress', (p) => { statusEl.textContent = `Compressing… ${Math.round(p * 100)}%`; });
      gif.on('finished', (blob) => { downloadBlob(blob, filename); resolve(); });
      gif.on('abort', reject);
      gif.render();
    });
    statusEl.className = 'status ok';
    statusEl.textContent = `Saved ${filename} (${frames} frames, ${fps}fps).`;
  } catch (err) {
    console.error(err);
    statusEl.className = 'status err';
    statusEl.textContent = 'Failed: ' + (err && err.message ? err.message : err);
  } finally {
    button.disabled = false;
  }
}

function downloadFramePng({ drawScene, nativeSize, currentFrame, filename, statusEl }) {
  const c = makeExportCanvas(drawScene, nativeSize, currentFrame());
  c.toBlob((blob) => {
    downloadBlob(blob, filename);
    statusEl.className = 'status ok';
    statusEl.textContent = `Saved ${filename}.`;
  }, 'image/png');
}

// ═══════════════════════════════════════════════════════════════════════
// PROJECT 01 — ROARING FIRE LOOP
// ═══════════════════════════════════════════════════════════════════════
//
// Single hero flame matching the v2 reference: a 4-tendril composition
// (tall S-curve on the left, two jagged center spires, a stepped-outward
// tendril on the right) rising from a wide pale-yellow base, with
// isolated pixel sparks rising independently.
//
// Wave frequencies are integer multiples of (2π / FIRE_FRAMES) so the
// loop seams cleanly.

const FIRE_FRAMES = 30;
const FIRE_FPS    = 15;
const FIRE_NATIVE = 64;
const FIRE_TAU    = (Math.PI * 2) / FIRE_FRAMES;

// Strict 4-color palette from the v2 spec.
const FIRE = {
  OUTLINE: '#D95738',   // dark red-orange — outline & sparks
  BODY:    '#F16E32',   // bright orange — main flame body
  CORE:    '#F7A833',   // yellow-orange — inner core
  HOT:     '#FFF7A4',   // pale yellow — hot center & base
};

// ── Tendril shape functions ──────────────────────────────────────────
// u: 0 at base, 1 at tip. t: loop frame. Returns x-offset from baseX.

// LEFT TENDRIL — tall S-curve that leans inward (toward center) at the
// lower bend, outward at the upper bend, with a small hook curling
// back inward at the very top.
function leftSCurveX(u, t) {
  // Full sine cycle over 0..1 → +amp at u=0.25, -amp at u=0.75.
  const sCurve = Math.sin(u * Math.PI * 2) * 4;
  // Hook bump near the tip — curls back toward center.
  const hook = u > 0.82 ? Math.sin((u - 0.82) * Math.PI / 0.18) * 2.2 : 0;
  // Subtle loop-locked wobble so the flame breathes between frames.
  const wobble = Math.sin(t * FIRE_TAU + u * 1.5) * 0.45;
  return sCurve + hook + wobble;
}
function leftSCurveW(u) {
  if (u < 0.15) return 3.0;
  if (u < 0.55) return 3.0 - (u - 0.15) * 1.5;
  if (u < 0.85) return 2.4 - (u - 0.55) * 4.2;
  return Math.max(0.4, 1.14 - (u - 0.85) * 5.5);
}

// RIGHT TENDRIL — shorter, "steps out to the right" before sharpening
// to a point. Single outward bend rather than a full S.
function rightStepX(u, t) {
  // Ramp outward then settle. Peaks around u=0.35.
  let step;
  if      (u < 0.10) step = u * 25;                 // 0 → 2.5
  else if (u < 0.40) step = 2.5 + (u - 0.10) * 7;   // 2.5 → 4.6
  else if (u < 0.75) step = 4.6 - (u - 0.40) * 9;   // 4.6 → 1.45
  else                step = 1.45 - (u - 0.75) * 6; // 1.45 → -0.05
  const wobble = Math.sin(t * FIRE_TAU + u * 1.5 + 1.7) * 0.45;
  return step + wobble;
}
function rightStepW(u) {
  if (u < 0.20) return 3.2;                       // wider base
  if (u < 0.60) return 3.2 - (u - 0.20) * 2.0;    // 3.2 → 2.4
  if (u < 0.88) return 2.4 - (u - 0.60) * 5.2;    // 2.4 → 0.95
  return Math.max(0.4, 0.95 - (u - 0.88) * 5.0);
}

// CENTER SPIRES — short and mostly vertical with small jagged jitter.
function spireX(u, t, seed) {
  const jitter = Math.sin(u * 8.4 + seed) * 0.55;
  const wobble = Math.sin(t * FIRE_TAU + seed * 2.1) * 0.45;
  return jitter + wobble;
}
function spireW(u) {
  if (u < 0.20) return 2.1;
  if (u < 0.70) return 2.1 - (u - 0.20) * 1.5;
  return Math.max(0.4, 1.35 - (u - 0.70) * 4.5);
}

// Tendril roster — order matters for paint stacking (later tendrils
// over earlier ones). Tallest first so center spires don't disappear
// behind the big side flames.
const TENDRILS = [
  { name: 'left-S',       baseX: 23, baseY: 52, height: 42,
    xOff: leftSCurveX,    width: leftSCurveW, seed: 0 },
  { name: 'right-step',   baseX: 41, baseY: 52, height: 38,
    xOff: rightStepX,     width: rightStepW,  seed: 0 },
  { name: 'center-left',  baseX: 29, baseY: 51, height: 22,
    xOff: spireX,         width: spireW,      seed: 1.9 },
  { name: 'center-right', baseX: 35, baseY: 51, height: 26,
    xOff: spireX,         width: spireW,      seed: 3.7 },
];

// ── Tendril renderer ─────────────────────────────────────────────────
// Layers paint outside-in: OUTLINE, BODY, CORE, HOT. Each successive
// layer is inset by 1 px and trimmed earlier at the top so the inner
// hot colors only show in the lower portion of each flame — matches
// the reference where the pale yellow stops well below the tips.
const FIRE_LAYERS = [
  { color: FIRE.OUTLINE, inset: -1, topTrim: 0.00, cap: true  },
  { color: FIRE.BODY,    inset:  0, topTrim: 0.00, cap: false },
  { color: FIRE.CORE,    inset:  1, topTrim: 0.20, cap: false },
  { color: FIRE.HOT,     inset:  2, topTrim: 0.55, cap: false },
];

function paintTendril(ctx, tendril, t, layer) {
  const { baseX, baseY, height, xOff, width, seed } = tendril;
  const maxR = Math.floor(height * (1 - layer.topTrim));
  for (let r = 0; r <= maxR; r++) {
    const u = r / height;
    const xc = baseX + xOff(u, t, seed);
    const halfW = width(u) - layer.inset;
    if (halfW < 0.4) continue;
    const y  = baseY - r;
    const x0 = Math.round(xc - halfW);
    const x1 = Math.round(xc + halfW);
    px(ctx, layer.color, x0, y, x1 - x0 + 1, 1);
  }
  // OUTLINE gets an extra cap row above the topmost body row so the tip
  // is closed off.
  if (layer.cap) {
    const u = 1;
    const xc = baseX + xOff(u, t, seed);
    const y  = baseY - height - 1;
    px(ctx, layer.color, Math.round(xc), y, 1, 1);
  }
}

// ── Base blob (pale yellow puddle at the bottom) ─────────────────────
// Hand-shaped row-by-row to give the bottom a flat-ish lip with rounded
// shoulders. The blob is wider than the combined tendril roots so a
// strip of pale yellow always shows between the tendrils.
const BASE_CX = 32;
const BASE_ROWS = [
  // [y, halfWidth, drawOuterPixels]
  // drawOuterPixels=true gives the row an OUTLINE+BODY ring; false makes
  // it pure HOT (used for the very-bottom flat lip).
  [49, 11, true ],   // top — narrowest
  [50, 13, true ],
  [51, 14, true ],   // widest belly
  [52, 14, true ],
  [53, 13, true ],
  [54, 11, true ],
  [55,  9, false],   // flat lip
];

function drawBase(ctx, t) {
  // Small loop-locked breath so the base pulses subtly.
  const breath = Math.sin(t * FIRE_TAU) * 0.4;
  for (const [y, halfW, hasOuter] of BASE_ROWS) {
    const w = halfW + (hasOuter ? Math.round(breath) : 0);
    if (hasOuter) {
      // Outline at the edges, body just inside, hot fill inside that.
      px(ctx, FIRE.OUTLINE, BASE_CX - w,     y, 1, 1);
      px(ctx, FIRE.OUTLINE, BASE_CX + w,     y, 1, 1);
      px(ctx, FIRE.BODY,    BASE_CX - w + 1, y, 1, 1);
      px(ctx, FIRE.BODY,    BASE_CX + w - 1, y, 1, 1);
      // Inner band: CORE then HOT.
      if (w >= 4) {
        px(ctx, FIRE.CORE,  BASE_CX - w + 2, y, 1, 1);
        px(ctx, FIRE.CORE,  BASE_CX + w - 2, y, 1, 1);
        px(ctx, FIRE.HOT,   BASE_CX - w + 3, y, (w - 3) * 2 + 1, 1);
      } else {
        px(ctx, FIRE.HOT,   BASE_CX - w + 2, y, (w - 2) * 2 + 1, 1);
      }
    } else {
      // Flat lip — solid hot strip with two outline corners.
      px(ctx, FIRE.OUTLINE, BASE_CX - w,     y, 1, 1);
      px(ctx, FIRE.OUTLINE, BASE_CX + w,     y, 1, 1);
      px(ctx, FIRE.HOT,     BASE_CX - w + 1, y, (w - 1) * 2 + 1, 1);
    }
  }
}

// ── Sparks (floating pixels rising and fading) ───────────────────────
// Each spark traces a short vertical path over a fraction of the loop,
// fading in and out at the ends so it pops in/out rather than appearing
// to teleport. Mix of single pixels and 1×2 / 2×1 clusters for variety.
const SPARKS = [
  // [x, baseY, riseDist, color, phase, shape]   shape: 'dot' | 'h2' | 'v2'
  [11, 28, 10, FIRE.OUTLINE,  0,  'dot'],
  [14, 22,  8, FIRE.BODY,     6,  'dot'],
  [22, 20,  9, FIRE.OUTLINE,  12, 'h2' ],
  [33, 16, 10, FIRE.OUTLINE,  18, 'dot'],
  [42, 18,  9, FIRE.BODY,     24, 'v2' ],
  [49, 24, 10, FIRE.OUTLINE,  3,  'dot'],
  [53, 30,  8, FIRE.OUTLINE,  21, 'dot'],
];

function drawSparks(ctx, t) {
  for (const [x, baseY, rise, color, phase, shape] of SPARKS) {
    const localT = ((t + phase) % FIRE_FRAMES) / FIRE_FRAMES;  // 0..1
    // Only visible during the middle 70% of its cycle.
    if (localT < 0.10 || localT > 0.85) continue;
    const visU = (localT - 0.10) / 0.75;             // 0..1 within visible window
    const y = Math.round(baseY - visU * rise);
    if (shape === 'dot')      px(ctx, color, x, y, 1, 1);
    else if (shape === 'h2')  px(ctx, color, x, y, 2, 1);
    else /* v2 */             px(ctx, color, x, y, 1, 2);
  }
}

// ── Scene composer ───────────────────────────────────────────────────
function drawFireScene(ctx, W, H, t) {
  // White backdrop — the reference is on plain white.
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // 1. Base blob first so tendrils paint over its top edge.
  drawBase(ctx, t);

  // 2. Tendrils — paint by COLOR layer (all outlines, then all bodies,
  //    etc.) so adjacent tendrils don't get their bodies stained by
  //    neighbors' outlines.
  for (const layer of FIRE_LAYERS) {
    for (const tendril of TENDRILS) {
      paintTendril(ctx, tendril, t, layer);
    }
  }

  // 3. Sparks on top.
  drawSparks(ctx, t);
}

// ── Live preview loop ────────────────────────────────────────────────
const fireDisplay = document.getElementById('fire-display');
const fireCtx = fireDisplay.getContext('2d');
fireCtx.imageSmoothingEnabled = false;
let fireFrame = 0;
let fireLast = 0;
function fireTick(now) {
  if (now - fireLast >= 1000 / FIRE_FPS) {
    drawFireScene(fireCtx, FIRE_NATIVE, FIRE_NATIVE, fireFrame);
    fireFrame = (fireFrame + 1) % FIRE_FRAMES;
    fireLast = now;
  }
  requestAnimationFrame(fireTick);
}
requestAnimationFrame(fireTick);

// ── Download buttons ─────────────────────────────────────────────────
const fireStatus = document.getElementById('fire-status');
document.getElementById('fire-gif').addEventListener('click', (e) => {
  renderGif({
    drawScene: drawFireScene,
    nativeSize: FIRE_NATIVE,
    frames: FIRE_FRAMES,
    fps: FIRE_FPS,
    filename: 'roaring-fire-loop-512.gif',
    statusEl: fireStatus,
    button: e.currentTarget,
  });
});
document.getElementById('fire-png').addEventListener('click', () => {
  downloadFramePng({
    drawScene: drawFireScene,
    nativeSize: FIRE_NATIVE,
    currentFrame: () => fireFrame,
    filename: 'roaring-fire-frame-512.png',
    statusEl: fireStatus,
  });
});

</script>
</body>
</html>
