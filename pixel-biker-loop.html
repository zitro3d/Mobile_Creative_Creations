<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Biker Loop</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0604;
    color: #ffd83d;
    font-family: "Impact", "Arial Black", sans-serif;
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .stage {
    position: relative;
    width: min(92vw, 720px);
    aspect-ratio: 4 / 3;
    background:
      radial-gradient(ellipse at 50% 110%, #c52a18 0%, #5a1208 28%, #1a0a06 60%, #0d0604 100%);
    border: 3px solid #1a0a06;
    border-radius: 12px;
    box-shadow:
      inset 0 0 0 2px #2a1408,
      0 12px 36px rgba(0, 0, 0, 0.55);
    overflow: hidden;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .hud {
    position: absolute;
    top: 10px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ffd83d;
    letter-spacing: 6px;
    font-size: 14px;
    text-shadow: 2px 2px 0 #1a0a06;
    pointer-events: none;
    z-index: 2;
  }
  .ctrls {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    align-items: center;
    color: #d6c7b3;
    font-family: "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 1px;
    font-size: 12px;
  }
  button {
    background: #1a0a06;
    color: #ffd83d;
    border: 2px solid #c52a18;
    font-family: "Impact", "Arial Black", sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #c52a18; color: #fff; }
  input[type="range"] { width: 120px; accent-color: #ffd83d; }
</style>
</head>
<body>
  <div class="stage">
    <div class="hud">NIGHTHAG ON WHEELS</div>
    <canvas id="game"></canvas>
  </div>
  <div class="ctrls">
    <button id="speedDown">- SLOWER</button>
    <span>SPEED</span>
    <input id="speed" type="range" min="0.3" max="2.5" step="0.1" value="1.1">
    <button id="speedUp">+ FASTER</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // Logical canvas — sprite drawn at native pixel res then CSS-scaled.
  const W = 320, H = 240;
  canvas.width = W; canvas.height = H;

  // ---- Sprite + wheel constants (native 148x157, wheels masked out) ----
  // Measured from the cropped sprite. Wheels are erased in the PNG so we
  // can paint our own rotating wheels and they sync visually with feet.
  const SPRITE_W = 148;
  const SPRITE_H = 157;
  const REAR  = { cx: 66,  cy: 130, r: 22 };
  const FRONT = { cx: 125, cy: 130, r: 20 };
  // Crank (pedal axis) sits between the two hubs.
  const CRANK = { x: (REAR.cx + FRONT.cx) / 2 + 4,    // slight forward bias
                  y: (REAR.cy + FRONT.cy) / 2 + 2 };
  // Pivot point for body sway — saddle / pelvis area
  const PIVOT = { x: 95, y: 80 };
  // Pedal crank arm length in sprite-px
  const PEDAL_R = 7;

  const sprite = new Image();
  sprite.src = 'assets/pixel-biker.png';

  // ---- Background scrolling speed lines
  const lines = [];
  for (let i = 0; i < 26; i++) {
    lines.push({
      x: Math.random() * W,
      y: 30 + Math.random() * (H - 80),
      len: 6 + Math.random() * 24,
      a:   0.10 + Math.random() * 0.30,
      v:   1.0 + Math.random() * 2.0,
    });
  }
  // ---- Dust motes
  const dust = [];
  function spawnDust(x, y) {
    dust.push({
      x, y,
      vx: -0.4 - Math.random() * 0.5,
      vy: -0.1 - Math.random() * 0.3,
      r:  1 + Math.random() * 1.6,
      a:  0.55 + Math.random() * 0.25,
      life: 1.0,
      decay: 0.018 + Math.random() * 0.012,
    });
  }

  let speedMul = 1.1;
  document.getElementById('speed').addEventListener('input', (e) => {
    speedMul = parseFloat(e.target.value);
  });
  document.getElementById('speedUp').addEventListener('click', () => {
    speedMul = Math.min(2.5, speedMul + 0.2);
    document.getElementById('speed').value = speedMul.toFixed(1);
  });
  document.getElementById('speedDown').addEventListener('click', () => {
    speedMul = Math.max(0.3, speedMul - 0.2);
    document.getElementById('speed').value = speedMul.toFixed(1);
  });

  let frame = 0;

  // Render a rotating wheel in place of the masked sprite wheel. Visible
  // spokes turn with `t` so motion is unmistakable.
  function drawWheel(cx, cy, r, t) {
    // Tire (black ring) — outer rim
    ctx.fillStyle = '#100604';
    ctx.beginPath();
    ctx.arc(cx, cy, r + 1, 0, Math.PI * 2);
    ctx.fill();
    // Cream interior — the painted wheels were near-white inside
    ctx.fillStyle = '#e8dcc4';
    ctx.beginPath();
    ctx.arc(cx, cy, r - 1, 0, Math.PI * 2);
    ctx.fill();
    // Spokes — 8 dark radials from hub to rim, rotating with t.
    // Two opposite spokes drawn thicker so the rotation reads clearly
    // (a "keyspoke" the eye can lock onto).
    ctx.strokeStyle = '#1a0a06';
    ctx.lineCap = 'butt';
    const spokes = 8;
    for (let i = 0; i < spokes; i++) {
      const a = t + (Math.PI * 2 / spokes) * i;
      const isKey = (i === 0);
      ctx.lineWidth = isKey ? 1.6 : 0.9;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 2,
                 cy + Math.sin(a) * 2);
      ctx.lineTo(cx + Math.cos(a) * (r - 2),
                 cy + Math.sin(a) * (r - 2));
      ctx.stroke();
    }
    // Hub
    ctx.fillStyle = '#1a0a06';
    ctx.beginPath();
    ctx.arc(cx, cy, 2.4, 0, Math.PI * 2);
    ctx.fill();
    // Tiny highlight pip on the hub face so the rotation has a
    // catch-light
    ctx.fillStyle = '#ffd060';
    ctx.beginPath();
    ctx.arc(cx - 0.8, cy - 0.8, 0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw the pedal crank + two feet orbiting opposite each other.
  // Stylized as dark boots with brass-tinted toecaps so they read
  // even at small scale.
  function drawPedalsAndFeet(cx, cy, t) {
    // Crank arm cross — two arms at 180° pointing through pedals
    ctx.strokeStyle = '#3a2818';
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    const p1x = cx + Math.cos(t) * PEDAL_R;
    const p1y = cy + Math.sin(t) * PEDAL_R;
    const p2x = cx + Math.cos(t + Math.PI) * PEDAL_R;
    const p2y = cy + Math.sin(t + Math.PI) * PEDAL_R;
    ctx.beginPath();
    ctx.moveTo(p1x, p1y);
    ctx.lineTo(p2x, p2y);
    ctx.stroke();
    // Hub plate at the crank
    ctx.fillStyle = '#3a2818';
    ctx.beginPath();
    ctx.arc(cx, cy, 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffd060';
    ctx.beginPath();
    ctx.arc(cx - 0.6, cy - 0.6, 0.6, 0, Math.PI * 2);
    ctx.fill();
    // Pedals + boots — front foot brighter (sunlit), rear foot dim
    drawBoot(p1x, p1y, 1.0);
    drawBoot(p2x, p2y, 0.6);
  }

  function drawBoot(x, y, brightness) {
    // Dark boot rectangle + brass toecap; small enough to feel like
    // a 16-bit foot pixel cluster.
    ctx.fillStyle = brightness > 0.8 ? '#1a0a06' : '#0e0604';
    ctx.fillRect(x - 3.5, y - 1.2, 7, 2.6);
    // Toecap forward (right)
    ctx.fillStyle = brightness > 0.8 ? '#ffd060' : '#a07028';
    ctx.fillRect(x + 2, y - 0.8, 1.6, 1.8);
    // Sole bottom edge
    ctx.fillStyle = '#3a2818';
    ctx.fillRect(x - 3.5, y + 1.0, 7, 0.6);
  }

  // Faint shadow / knee marker — a small dark blob over each thigh
  // area that bobs with pedal phase. Sells leg motion without
  // repainting the baked-in legs.
  function drawKneeMarkers(spriteOX, spriteOY, scale, t) {
    // Knees sit just above the crank. Phase opposite to give the
    // up-down piston feel.
    const knee1Phase = -Math.sin(t)         * 2.2;    // ±2 px
    const knee2Phase = -Math.sin(t + Math.PI) * 2.2;
    const KNEE_L = { x: 92, y: 110 };           // rear leg knee
    const KNEE_R = { x: 108, y: 110 };          // front leg knee
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#0a0604';
    // Rear knee
    let kx = spriteOX + KNEE_L.x * scale;
    let ky = spriteOY + (KNEE_L.y + knee1Phase) * scale;
    ctx.beginPath();
    ctx.ellipse(kx, ky, 3 * scale, 2.2 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    // Front knee
    kx = spriteOX + KNEE_R.x * scale;
    ky = spriteOY + (KNEE_R.y + knee2Phase) * scale;
    ctx.beginPath();
    ctx.ellipse(kx, ky, 3 * scale, 2.2 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawGround(groundY) {
    ctx.save();
    const g = ctx.createLinearGradient(0, groundY - 4, 0, H);
    g.addColorStop(0,   'rgba(255, 140, 60, 0.22)');
    g.addColorStop(0.4, 'rgba(120, 40, 20, 0.55)');
    g.addColorStop(1,   'rgba(10, 4, 2, 0.92)');
    ctx.fillStyle = g;
    ctx.fillRect(0, groundY - 4, W, H - groundY + 4);
    // Pebble line streaming past
    ctx.fillStyle = 'rgba(10, 4, 2, 0.85)';
    for (let i = 0; i < 18; i++) {
      const px = (i * 19 + (frame * speedMul * 1.4) % 19) % W;
      ctx.fillRect(Math.floor(px), Math.floor(groundY), 2, 1);
    }
    ctx.restore();
  }

  function loop() {
    frame++;
    ctx.clearRect(0, 0, W, H);

    // ---- Speed lines (back layer) ----
    for (const ln of lines) {
      ln.x -= ln.v * speedMul;
      if (ln.x + ln.len < 0) {
        ln.x = W + Math.random() * 40;
        ln.y = 30 + Math.random() * (H - 80);
      }
      ctx.fillStyle = 'rgba(255, 220, 160, ' + ln.a + ')';
      ctx.fillRect(Math.round(ln.x), Math.round(ln.y), Math.round(ln.len), 1);
    }

    // ---- Compose the sprite + procedural lower body together ----
    // Use sprite native scale so canvas pixel-art stays crisp on the
    // CSS upscale. Stage scale picked to land the sprite at a
    // comfortable size in the stage.
    const scale  = 1.45;
    const dw     = SPRITE_W * scale;
    const dh     = SPRITE_H * scale;
    const baseX  = (W - dw) / 2;
    const bob    = Math.sin(frame * 0.32 * speedMul) * 2.4;
    const baseY  = H - dh - 16 + bob;

    // Ground line just under the wheels (sprite-native cy=152 ≈
    // wheel bottom). Use a stable groundY independent of bob so the
    // surface doesn't slide.
    const groundY = H - 14;
    drawGround(groundY);

    // Pedal cycle phase — wheels and feet share it so they LOOK in
    // sync. Higher gain than the bob so the wheels visibly turn.
    const t = frame * 0.22 * speedMul;
    // Body sway — rotate the WHOLE composition about the pivot,
    // ±~2.3° per stroke, in phase with the bob.
    const sway = Math.sin(frame * 0.32 * speedMul) * 0.04;

    ctx.save();
    // Translate to pivot in stage coords, rotate, translate back
    const pivotSX = baseX + PIVOT.x * scale;
    const pivotSY = baseY + PIVOT.y * scale;
    ctx.translate(pivotSX, pivotSY);
    ctx.rotate(sway);
    ctx.translate(-pivotSX, -pivotSY);

    // 1. Wheels first (so the bike frame in sprite overlays them
    //    at the fork joints)
    drawWheel(baseX + REAR.cx * scale,
              baseY + REAR.cy * scale,
              REAR.r * scale, t);
    drawWheel(baseX + FRONT.cx * scale,
              baseY + FRONT.cy * scale,
              FRONT.r * scale, t);

    // 2. The masked sprite (head + torso + arm + bike-frame partial)
    if (sprite.complete && sprite.naturalWidth) {
      ctx.drawImage(sprite, 0, 0, SPRITE_W, SPRITE_H,
                    baseX, baseY, dw, dh);
    }

    // 3. Pedals + feet rotating around the crank — drawn on top so
    //    the front pedal occludes the bike frame realistically.
    drawPedalsAndFeet(baseX + CRANK.x * scale,
                      baseY + CRANK.y * scale, t);

    // 4. Knee markers — small dark blobs that bob with pedal phase
    //    so the legs read as actively pumping (the painted legs
    //    are static; this is the cheat that sells motion).
    drawKneeMarkers(baseX, baseY, scale, t);

    ctx.restore();

    // ---- Spawn dust behind the rear wheel
    if (frame % Math.max(2, Math.round(6 / speedMul)) === 0) {
      const wx = baseX + (REAR.cx - REAR.r * 0.6) * scale;
      const wy = groundY - 1;
      spawnDust(wx, wy);
    }
    // ---- Update + draw dust
    for (let i = dust.length - 1; i >= 0; i--) {
      const d = dust[i];
      d.x += d.vx * speedMul;
      d.y += d.vy;
      d.vy += 0.012;
      d.life -= d.decay;
      if (d.life <= 0) { dust.splice(i, 1); continue; }
      ctx.fillStyle = 'rgba(180, 140, 100, ' + (d.a * d.life) + ')';
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(loop);
  }

  sprite.addEventListener('load',  () => requestAnimationFrame(loop));
  sprite.addEventListener('error', () => requestAnimationFrame(loop));
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
