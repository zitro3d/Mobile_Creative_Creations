<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electric Hand — arc lightning rising from a cupped palm</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 30%, #0a1422 0%, #05080f 60%, #000 100%);
    color: #9fd0ff; font: 14px/1.5 system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100%;
  }
  h1 { font-weight: 600; letter-spacing: .08em; margin: 18px 0 4px; color: #d6ecff; }
  .sub { opacity: .6; margin: 0 0 16px; max-width: 560px; text-align: center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    height: min(82vh, 1320px);
    width: auto; aspect-ratio: 160 / 220;
    filter: drop-shadow(0 0 34px rgba(90, 170, 255, .35));
    background: #04060c;
  }
  .row { display: flex; gap: 10px; margin: 14px 0 30px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #122033; color: #d6ecff; border: 1px solid #2f5680;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit;
  }
  button[aria-pressed="true"] { background: #244a72; }
  .palette-strip { display: flex; gap: 8px; margin-bottom: 14px; }
  .swatch { width: 24px; height: 24px; border: 2px solid #05080f; border-radius: 4px; }
</style>
</head>
<body>
  <h1>ELECTRIC HAND</h1>
  <p class="sub">Arc lightning rises from the cupped palm and wraps around in a circular helix, throwing
  branching offshoots and sparks that detach into new strands and fade out.</p>
  <div class="palette-strip">
    <div class="swatch" style="background:#1a3a8a" title="deep electric blue"></div>
    <div class="swatch" style="background:#3aa0ff" title="arc blue"></div>
    <div class="swatch" style="background:#7fe6ff" title="cyan"></div>
    <div class="swatch" style="background:#e8f6ff" title="hot core"></div>
    <div class="swatch" style="background:#e8a878" title="palm skin"></div>
  </div>
  <canvas id="cv" width="160" height="220"></canvas>
  <div class="row">
    <button id="bSpeed"  aria-pressed="false">Slower</button>
    <button id="bStorm"  aria-pressed="false">Storm</button>
    <button id="bColor"  aria-pressed="false">Violet</button>
  </div>

<script>
(() => {
const W = 160, H = 220, TAU = Math.PI * 2;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { willReadFrequently: true });

// ── Skin palette ──────────────────────────────────────
const OUTLINE  = [34, 20, 26];
const SKIN_SH  = [120,  74,  60];
const SKIN_CUP = [150,  95,  74];
const SKIN_MID = [196, 132, 102];
const SKIN_LT  = [228, 176, 140];
const SKIN_HI  = [248, 212, 180];

// ── Buffers ───────────────────────────────────────────
const base = new Uint8ClampedArray(W * H * 4);   // background + hand, baked once
const mask = new Uint8Array(W * H);              // 1 = hand skin
const acc  = new Float32Array(W * H);            // electric light accumulation
const idx  = (x, y) => (y * W + x) * 4;
const inB  = (x, y) => x >= 0 && x < W && y >= 0 && y < H;
const skinAt = (x, y) => inB(x, y) && mask[y * W + x] === 1;

function setBase(x, y, c) {
  if (!inB(x, y)) return;
  const i = idx(x, y);
  base[i] = c[0]; base[i+1] = c[1]; base[i+2] = c[2]; base[i+3] = 255;
}

// ── Deterministic hash noise in [-1,1] ────────────────
function hash(n) {
  n = (n << 13) ^ n;
  return 1 - ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 1073741824;
}
function rng(seed){ let s = seed >>> 0; return () => { s = (s*1664525 + 1013904223) >>> 0; return s/4294967296; }; }

// ════════════════════════════════════════════════════════
//  BUILD THE BACKGROUND + HAND (baked into `base`)
// ════════════════════════════════════════════════════════

// Deep vertical gradient backdrop
for (let y = 0; y < H; y++) {
  const t = y / H;
  const r = Math.round( 8 + t * 6);
  const g = Math.round(14 + t * 10);
  const b = Math.round(28 + t * 16);
  for (let x = 0; x < W; x++) setBase(x, y, [r, g, b]);
}

// Stamp a soft disc into the skin mask
function stampDisc(cx, cy, r) {
  const r2 = r * r;
  for (let dy = -Math.ceil(r); dy <= Math.ceil(r); dy++)
    for (let dx = -Math.ceil(r); dx <= Math.ceil(r); dx++)
      if (dx*dx + dy*dy <= r2) {
        const x = Math.round(cx) + dx, y = Math.round(cy) + dy;
        if (inB(x, y)) mask[y * W + x] = 1;
      }
}
// Stroke a tapered capsule chain (base→knuckle→tip) into the mask
function stampLimb(pts, radii) {
  for (let s = 0; s < pts.length - 1; s++) {
    const [ax, ay] = pts[s], [bx, by] = pts[s+1];
    const ra = radii[s], rb = radii[s+1];
    const steps = Math.ceil(Math.hypot(bx-ax, by-ay)) + 1;
    for (let i = 0; i <= steps; i++) {
      const f = i / steps;
      stampDisc(ax + (bx-ax)*f, ay + (by-ay)*f, ra + (rb-ra)*f);
    }
  }
}

// Wrist / forearm
stampLimb([[80, 220], [80, 178]], [19, 18]);
// Palm
stampDisc(80, 170, 27);
stampDisc(80, 162, 24);
// Thumb (left side, angled up)
stampLimb([[55, 176], [45, 160], [50, 145]], [9, 6.5, 4.5]);
// Four fingers, cupping inward toward the centre column
stampLimb([[64, 152], [64, 134], [71, 123]], [6.5, 5, 4]);   // pinky
stampLimb([[75, 150], [76, 127], [81, 115]], [7,   5.5, 4]); // ring
stampLimb([[87, 150], [89, 125], [86, 113]], [7,   5.5, 4]); // middle
stampLimb([[98, 152], [100,130], [91, 122]], [6.5, 5, 4]);   // index

// Shade the masked hand into `base`
const outside = (x, y) => !skinAt(x, y);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  if (mask[y * W + x] !== 1) continue;
  // Outline: any 4-neighbour outside the silhouette
  if (outside(x-1,y) || outside(x+1,y) || outside(x,y-1) || outside(x,y+1)) { setBase(x,y,OUTLINE); continue; }
  let col = SKIN_MID;
  const ul = outside(x-2,y-2) || outside(x-2,y-1) || outside(x-1,y-2);
  const ul1 = outside(x-1,y-1);
  const dr = outside(x+2,y+2) || outside(x+2,y+1) || outside(x+1,y+2);
  if (ul)  col = SKIN_LT;
  if (ul1) col = SKIN_HI;
  if (dr)  col = SKIN_SH;
  // Cupped-palm concavity shadow
  const px = (x - 80) / 17, py = (y - 174) / 12;
  if (!ul && !dr && px*px + py*py < 1) col = (px*px + py*py < 0.45) ? SKIN_SH : SKIN_CUP;
  setBase(x, y, col);
}

// ════════════════════════════════════════════════════════
//  ELECTRICITY SYSTEM
// ════════════════════════════════════════════════════════
const CX = 80, ORIGIN_Y = 150;   // energy springs from the cupped palm

// Additive glow stamp (core + cross + diagonal bleed)
function addGlow(x, y, a) {
  x |= 0; y |= 0;
  if (x < 1 || x >= W-1 || y < 1 || y >= H-1) { if (inB(x,y)) acc[y*W+x] += a; return; }
  const i = y * W + x;
  acc[i]     += a;
  acc[i-1]   += a*0.42; acc[i+1]   += a*0.42;
  acc[i-W]   += a*0.42; acc[i+W]   += a*0.42;
  acc[i-W-1] += a*0.20; acc[i-W+1] += a*0.20;
  acc[i+W-1] += a*0.20; acc[i+W+1] += a*0.20;
}
// Bresenham segment of glow
function glowLine(x0, y0, x1, y1, a) {
  x0|=0; y0|=0; x1|=0; y1|=0;
  let dx = Math.abs(x1-x0), dy = -Math.abs(y1-y0);
  let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx + dy;
  for (;;) {
    addGlow(x0, y0, a);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
// Recursive midpoint-displaced jagged bolt (lightning look)
function jaggedBolt(x0, y0, x1, y1, disp, a, seed, depth) {
  if (depth <= 0 || (Math.abs(x1-x0) + Math.abs(y1-y0)) < 3) { glowLine(x0,y0,x1,y1,a); return; }
  let mx = (x0+x1)/2, my = (y0+y1)/2;
  const nx = -(y1-y0), ny = (x1-x0), nl = Math.hypot(nx, ny) || 1;
  const off = hash(seed) * disp;
  mx += nx/nl * off; my += ny/nl * off;
  jaggedBolt(x0,y0,mx,my, disp*0.55, a, seed*2+1, depth-1);
  jaggedBolt(mx,my,x1,y1, disp*0.55, a, seed*2+7, depth-1);
}

// ── Main helical arcs ─────────────────────────────────
let arcSeed = 1;
const seedRand = rng(7);
function spawnArc(now) {
  const dir = seedRand() < 0.5 ? -1 : 1;
  const a = {
    id: arcSeed++,
    born: now,
    life: 0.85 + seedRand() * 0.6,
    grow: 0.16 + seedRand() * 0.08,
    theta0: seedRand() * TAU,
    radius: 13 + seedRand() * 17,
    turns: (1.0 + seedRand() * 1.5) * dir,
    swirl: (0.5 + seedRand() * 0.9) * dir,
    height: 96 + seedRand() * 34,
    branches: [],
  };
  const nb = 2 + (seedRand() * 2 | 0);
  for (let i = 0; i < nb; i++) {
    a.branches.push({ t: 0.32 + seedRand() * 0.6, side: seedRand() < 0.5 ? -1 : 1,
                      len: 8 + seedRand() * 14, fired: false, fireT: 0, seed: (seedRand()*1e6)|0 });
  }
  return a;
}
let arcs = [];
const boltlets = [];   // detached offshoot strands that fade
const sparks = [];     // tiny flying points

// ── UI state ──────────────────────────────────────────
let speedMul = 1.0, storm = false, violet = false;

// Colour map: accumulation → additive electric RGB
function electricAdd(v) {
  if (violet) {
    let aR = v*150, aG = v*55, aB = v*240;
    if (v > 1) { const e = v-1; aR += e*235; aG += e*150; aB += e*60; }
    return [aR, aG, aB];
  }
  let aR = v*62, aG = v*140, aB = v*235;
  if (v > 1) { const e = v-1; aR += e*240; aG += e*150; aB += e*45; }
  return [aR, aG, aB];
}

// ── Per-arc path point at parameter t ─────────────────
function arcPoint(a, t, time, flick) {
  const ang = a.theta0 + t * a.turns * TAU + time * a.swirl;
  // radius widens off the palm then tapers to a point at the crown
  const rad = a.radius * (0.30 + 0.95 * t) * (1 - 0.55 * t * t);
  const front = (Math.sin(ang) + 1) * 0.5;                 // 0 back .. 1 toward viewer
  let x = CX + Math.cos(ang) * rad;
  let y = ORIGIN_Y - a.height * t - Math.sin(ang) * rad * 0.22;  // ellipse squash for 3D read
  // High-frequency lightning jitter, refreshed a few times a second
  const j = a.radius * 0.18 + t * 4;
  x += hash((a.id*131 + (t*40|0)*7 + flick*53)) * j;
  y += hash((a.id*977 + (t*40|0)*13 + flick*29)) * j * 0.7;
  return { x, y, front };
}

// ════════════════════════════════════════════════════════
//  RENDER LOOP
// ════════════════════════════════════════════════════════
const out = ctx.createImageData(W, H);
let last = performance.now(), startMs = last, frame = 0;

function tick(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  dt *= speedMul;
  const time = (now - startMs) / 1000 * speedMul;
  frame++;
  const flick = (frame >> 1);          // jitter flicker index (~30 Hz)

  // Decay the light buffer for short electric trails
  const decay = storm ? 0.40 : 0.34;
  for (let i = 0; i < acc.length; i++) acc[i] *= decay;

  // Maintain a population of live arcs
  const want = storm ? 8 : 5;
  arcs = arcs.filter(a => (now - a.born) / 1000 < a.life);
  while (arcs.length < want) arcs.push(spawnArc(now - seedRand() * 200));

  const rand = Math.random;

  // Pulsing palm core where the energy is born
  const corePulse = 0.55 + 0.45 * Math.sin(time * 9) + 0.3 * hash(frame*17);
  for (let dy = -5; dy <= 4; dy++) for (let dx = -6; dx <= 6; dx++) {
    if (dx*dx + dy*dy*1.7 <= 30) addGlow(CX+dx, ORIGIN_Y+dy, 0.12 * Math.max(0.2, corePulse));
  }

  // Draw each arc
  for (const a of arcs) {
    const age = (now - a.born) / 1000;
    const lifeF = age / a.life;
    const grown = Math.min(1, age / a.grow);              // growth front climbs the helix
    const fade  = lifeF < 0.7 ? 1 : 1 - (lifeF - 0.7) / 0.3;  // tail fade-out
    const N = 30;
    let prev = arcPoint(a, 0, time, flick);
    for (let i = 1; i <= N; i++) {
      const t = i / N;
      if (t > grown) break;
      const p = arcPoint(a, t, time, flick);
      const bright = (0.45 + 0.55 * p.front) * fade;
      glowLine(prev.x, prev.y, p.x, p.y, 0.9 * bright);
      // brighter hot tip at the leading edge
      if (t + 1/N > grown) addGlow(p.x, p.y, 1.3 * fade);
      prev = p;
    }

    // Fire branch offshoots as the growth front passes their anchor
    for (const br of a.branches) {
      if (!br.fired && grown >= br.t) { br.fired = true; br.fireT = now; }
      if (!br.fired) continue;
      const bage = (now - br.fireT) / 1000;
      if (bage > 0.34) continue;
      const bfade = (1 - bage / 0.34) * fade;
      if (bfade <= 0.02) continue;
      const p = arcPoint(a, br.t, time, flick);
      const ang = a.theta0 + br.t * a.turns * TAU + time * a.swirl;
      // shoot outward + upward off the strand
      const ox = Math.cos(ang) * br.side + (br.side) * 0.6;
      const oy = -0.7 - rand() * 0.3;
      const ol = Math.hypot(ox, oy) || 1;
      const ex = p.x + ox/ol * br.len, ey = p.y + oy/ol * br.len;
      jaggedBolt(p.x, p.y, ex, ey, br.len * 0.45, 0.95 * bfade, br.seed + flick*101, 4);
      // occasionally the offshoot detaches into a free strand that drifts and dies
      if (bage < 0.05 && rand() < 0.18) {
        boltlets.push({ x: ex, y: ey, ang: Math.atan2(oy, ox), len: 6 + rand()*10,
                        born: now, life: 0.28 + rand()*0.22, seed: (rand()*1e6)|0 });
      }
      // throw sparks
      if (rand() < (storm ? 0.5 : 0.3)) {
        sparks.push({ x: ex, y: ey, vx: (rand()-0.5)*60 + ox/ol*40, vy: oy/ol*50 - rand()*30,
                      born: now, life: 0.25 + rand()*0.3 });
      }
    }
  }

  // Detached offshoot strands — flicker briefly, then disappear
  for (let i = boltlets.length - 1; i >= 0; i--) {
    const b = boltlets[i];
    const bage = (now - b.born) / 1000;
    if (bage > b.life) { boltlets.splice(i, 1); continue; }
    const f = 1 - bage / b.life;
    b.ang += (hash(b.seed + flick) * 0.25);
    const ex = b.x + Math.cos(b.ang) * b.len, ey = b.y + Math.sin(b.ang) * b.len;
    jaggedBolt(b.x, b.y, ex, ey, b.len * 0.5, 0.8 * f, b.seed + flick*61, 4);
  }

  // Sparks — tiny streaks flung from the arcs
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    const sage = (now - s.born) / 1000;
    if (sage > s.life) { sparks.splice(i, 1); continue; }
    const f = 1 - sage / s.life;
    const px = s.x, py = s.y;
    s.vy += 50 * dt;                       // slight gravity
    s.x += s.vx * dt; s.y += s.vy * dt;
    glowLine(px, py, s.x, s.y, 1.0 * f);
  }

  // ── Composite: base + additive electricity ──────────
  out.data.set(base);
  for (let i = 0; i < acc.length; i++) {
    const v = acc[i];
    if (v <= 0.025) continue;
    const ci = i * 4;
    const [aR, aG, aB] = electricAdd(v);
    out.data[ci]   = Math.min(255, out.data[ci]   + aR);
    out.data[ci+1] = Math.min(255, out.data[ci+1] + aG);
    out.data[ci+2] = Math.min(255, out.data[ci+2] + aB);
  }
  ctx.putImageData(out, 0, 0);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ── UI ────────────────────────────────────────────────
document.getElementById('bSpeed').onclick = e => {
  const slow = e.target.getAttribute('aria-pressed') === 'true';
  e.target.setAttribute('aria-pressed', String(!slow));
  e.target.textContent = slow ? 'Slower' : 'Normal';
  speedMul = slow ? 1.0 : 0.5;
};
document.getElementById('bStorm').onclick = e => {
  storm = e.target.getAttribute('aria-pressed') !== 'true';
  e.target.setAttribute('aria-pressed', String(storm));
};
document.getElementById('bColor').onclick = e => {
  violet = e.target.getAttribute('aria-pressed') !== 'true';
  e.target.setAttribute('aria-pressed', String(violet));
  e.target.textContent = violet ? 'Blue' : 'Violet';
};
})();
</script>
</body>
</html>
