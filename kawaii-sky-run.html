  // ---------- setup ----------
  // Orientation-aware play field: the SHORT screen side maps to REF logical
  // units, the long side flexes — so portrait is tall & narrow, landscape is
  // wide & short. Rotate the phone to try both.
  let W = 390, H = 780;
  const cv = document.getElementById('game'), ctx = cv.getContext('2d');
  const DPR = Math.min(3, window.devicePixelRatio || 1);
  function computeSize(){
    const ww=Math.max(1,innerWidth), wh=Math.max(1,innerHeight), REF=430;
    if(wh>=ww){ W=REF; H=Math.round(REF*Math.min(2.3,Math.max(1.3, wh/ww))); }   // portrait
    else { H=REF; W=Math.round(REF*Math.min(2.4,Math.max(1.3, ww/wh))); }         // landscape
  }
  function sizeCanvas(){ cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    const s=Math.min(innerWidth/W, innerHeight/H); cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px'; }
  computeSize(); sizeCanvas();
  function onResize(){ computeSize(); sizeCanvas(); if(typeof reset==='function'){ reset(); state=START; } }
  addEventListener('resize', onResize);
  addEventListener('orientationchange', ()=>setTimeout(onResize,160));

  // ---------- input ----------

  function charSlot(i){ const gap=Math.min(90, W*0.26), n=charImgs.length; return { x: W/2 + (i-(n-1)/2)*gap, y: H*0.82, r: 31 }; }

  // ---------- update ----------

    speed=Math.min(speed+0.0007, speedTopNow());                   // ramp toward this zone's top speed

        else { f.got=0.001; combo++; comboT=150; let g=10*feastMult(); if(f.bonus) g*=3; if(starMode>0) g*=2;   // feast x1..x5 · bonus x3 · star x2
          score+=g; munch++; runCoins++; player.flap=0.5; player.squash=0.55;
          flash=4; flashCol='255,255,255'; pop(f.x,f.y-12,'+'+g, combo%5===0);
          burst(f.x,f.y, foodCols(f.type)); sMunch();
          const fm=feastMult(); if(fm>feastShown){ feastShown=fm; sFeast(fm); pop(player.x,player.y-62,'FEAST x'+fm+'!',true);
            burst(player.x,player.y,['#ff5a8a','#ffd166','#a9d0ff','#fff','#c9a6ff']); flash=7; flashCol='255,220,120'; player.squash=0.65; }   // milestone celebration

    }

  // ---------- CLOUDS mode: bounce platforms ----------
  function updatePlatforms(){
    if(--platT<=0){
      const roll=Math.random();
      const kind = roll<0.16 ? 'super' : (roll<0.46 ? 'mini' : 'normal');   // 16% super · 30% soft · 54% normal
      const r = kind==='mini'? rnd(28,36) : kind==='super'? rnd(46,56) : rnd(40,50);
      platforms.push({x:W+50,y:rnd(H*0.34,H*0.82),r,kind,pop:0,cool:0});
      platT=rnd(40,64) / (ZONES[zoneIdx].bounce||1);
    }
    const px=player.x, foot=player.y+38;
    for(let i=platforms.length-1;i>=0;i--){ const c=platforms[i]; c.x-=speed; if(c.pop>0)c.pop*=0.85;
      if(player.vy>-1.5 && Math.abs(c.x-px)<c.r*1.05 && foot>c.y-c.r*0.65 && foot<c.y+c.r*0.95 && (c.cool|0)<=0){
        const power = c.kind==='mini'? -6.8 : c.kind==='super'? -12.6 : -9.0;   // soft / normal / SUPER launch
        player.vy=power; c.pop=1; c.cool=12; player.squash=1; player.flap=0.9; safeBounce();   // squish-then-spring

  // ---------- draw: world ----------

    ctx.save(); ctx.globalAlpha=night?.85:.5; ctx.fillStyle=rgbCss(sunC[0]); circle(W*0.76,H*0.2, night?32:54); ctx.fill();
    if(night){ ctx.globalAlpha=.25; circle(W*0.76,H*0.2,44); ctx.fill(); } ctx.restore();   // moon glow
    for(const c of clouds){ ctx.save(); ctx.globalAlpha=night?.5:.7; ctx.fillStyle= night?'#c9c4e4':'#fffdf8';
      circle(c.x,c.y,c.s); ctx.fill(); circle(c.x+c.s*.8,c.y+6,c.s*.7); ctx.fill(); circle(c.x-c.s*.8,c.y+8,c.s*.65); ctx.fill(); ctx.restore(); }

  // each biome has its own signature drifting particle so every level FEELS different

    else if(a==='petal'){ const col=z.ambCol||'#ffd0e0'; for(let i=0;i<13;i++){ const px=((i*61+frame*0.9)%(W+40))-20, py=((i*70+frame*1.25)%(H+40))-20;

  }
  function drawGround(){ const gy=H-40; ctx.fillStyle=rgbCss(grC[0]); rr(0,gy,W,40,0); ctx.fill();

    ctx.fillStyle='rgba(255,140,165,.5)'; circle(cx-5*s,cy+1.4*s,1.5*s); ctx.fill(); circle(cx+5*s,cy+1.4*s,1.5*s); ctx.fill();

      ctx.fillStyle='#eaf6ff'; ctx.beginPath(); ctx.moveTo(-r*.5,r*.2); ctx.lineTo(r*.5,r*.2); ctx.lineTo(r*.36,r*1.05); ctx.lineTo(-r*.36,r*1.05); ctx.closePath(); ctx.fill(); ctx.stroke();  // cup
      ctx.fillStyle='#dff0ff'; ctx.beginPath(); ctx.moveTo(-r*.6,r*.22); ctx.quadraticCurveTo(-r*.5,-r*.7,0,-r*.85); ctx.quadraticCurveTo(r*.5,-r*.7,r*.6,r*.22); ctx.closePath(); ctx.fill(); ctx.stroke();  // ice mound
      ctx.fillStyle='rgba(120,190,255,.6)'; ctx.beginPath(); ctx.moveTo(-r*.4,-r*.18); ctx.quadraticCurveTo(0,-r*.55,r*.4,-r*.12); ctx.quadraticCurveTo(0,r*.12,-r*.4,-r*.18); ctx.fill();  // syrup
      ctx.fillStyle='#fff'; circle(-r*.24,-r*.46,r*.1); ctx.fill();
      kawaiiFace(0,0,fs*0.88);
    } else if(f.type==='planet'){                     // GALAXY — ringed planet mochi
      ctx.strokeStyle='#ffd6ff'; ctx.lineWidth=r*.15; ctx.save(); ctx.rotate(-0.4); ctx.beginPath(); ctx.ellipse(0,0,r*1.32,r*.5,0,Math.PI*0.05,Math.PI*0.95); ctx.stroke(); ctx.restore();  // ring back
      const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.2,0,0,r); g.addColorStop(0,'#8a6ad0'); g.addColorStop(1,'#4a2a7a');
      ctx.fillStyle=g; ctx.lineWidth=2.4; ctx.strokeStyle=INK; circle(0,0,r*.9); ctx.fill(); ctx.stroke();
      ctx.strokeStyle='#ffe0ff'; ctx.lineWidth=r*.15; ctx.save(); ctx.rotate(-0.4); ctx.beginPath(); ctx.ellipse(0,0,r*1.32,r*.5,0,Math.PI*1.05,Math.PI*1.95); ctx.stroke(); ctx.restore();  // ring front
      star(r*.4,-r*.42,r*.16,'#fff');
      kawaiiFace(0,r*.05,fs*0.9);
    } else { // star cookie
      ctx.fillStyle='#ffcf6b'; ctx.lineWidth=2.5; ctx.strokeStyle=INK; starPath(r*1.15); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#ffdf9a'; starPath(r*.78); ctx.fill();
      ctx.fillStyle='#fff'; for(let i=0;i<5;i++){ const a=-Math.PI/2+i*1.2566+0.3; circle(Math.cos(a)*r*.52,Math.sin(a)*r*.52,1.1); ctx.fill(); }
      kawaiiFace(0,r*.06,fs*0.95);
    }
    ctx.restore();
  }

  // ---------- draw: hero sprite ----------
  function drawHero(){
    // Animation temporarily OFF — using the clean STILL sprite until a new
    // (non-wobbly) animation is provided. Flip ANIM_ON to true + swap
    // HERO_FRAMES to re-enable the looping animation.
    const cimg = charImgs[currentChar];
    const ready = cimg && cimg.complete && cimg.naturalWidth>0;
    const DW = 140;
    const DH = ready ? DW*(cimg.naturalHeight/cimg.naturalWidth) : DW*(352/380);
    const idle = Math.sin(frame*0.09)*2.4;            // gentle living idle-bob
    const sq = 1 + player.flap*0.11 - player.squash*0.13;   // stretch on rise, squish on impact
    ctx.save();
    ctx.translate(player.x, player.y + idle);
    if(starMode>0){ ctx.save(); ctx.globalAlpha=0.5+0.25*Math.sin(frame*0.4);   // rainbow star-aura
      const cols=['#ff9ecf','#ffd18a','#fbf08a','#a3e0b0','#a9d0ff','#c9a6ff'];
      for(let k=0;k<6;k++){ ctx.fillStyle=cols[k]; const a=frame*0.08+k*1.047; star(Math.cos(a)*58,Math.sin(a)*52,6,cols[k]); }
      ctx.restore(); }
    ctx.rotate(player.tilt);                          // eased tilt (smoothed in update)
    if(invuln>0 && starMode<=0 && state===PLAY) ctx.globalAlpha = 0.45 + 0.45*Math.abs(Math.sin(frame*0.32));   // soft hurt pulse
    ctx.scale(1/sq, sq);
    if(ready) ctx.drawImage(cimg, -DW*0.5, -DH*0.5, DW, DH);
    else { ctx.fillStyle='#a3ddc1'; circle(0,0,40); ctx.fill(); }
    ctx.scale(sq, 1/sq);                              // undo squash for a round shield
    if(shield>0){ ctx.globalAlpha=0.4+0.15*Math.sin(frame*0.2); ctx.fillStyle='rgba(150,210,255,.16)'; circle(0,0,DW*0.52); ctx.fill();
      ctx.globalAlpha=0.7; ctx.strokeStyle='#8fd0ff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,DW*0.52,0,7); ctx.stroke(); }
    ctx.restore();
  }

  // ---------- draw: fx + hud ----------
  function drawFx(){
    for(const p of parts){ ctx.save(); ctx.globalAlpha=1-p.life/p.max; ctx.fillStyle=p.col;
      if(p.heart){ heartPath(p.x,p.y,p.r*1.4); ctx.fill(); } else { circle(p.x,p.y,p.r); ctx.fill(); } ctx.restore(); }
    for(const p of pops){ ctx.save(); ctx.globalAlpha=1-p.life/p.max; ctx.textAlign='center';
      ctx.font='900 '+(p.big?26:20)+'px "Trebuchet MS"'; ctx.lineWidth=4; ctx.strokeStyle='#fff'; ctx.fillStyle=p.big?'#ff7a9c':'#7a5a63';
      ctx.strokeText(p.txt,p.x,p.y); ctx.fillText(p.txt,p.x,p.y); ctx.restore(); }
  }
  function brokenHeart(x,y,s){ ctx.fillStyle='#d7c2ce'; heartPath(x,y,s); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    ctx.strokeStyle='#a98fb0'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x,y-s*.5); ctx.lineTo(x-s*.24,y-s*.08); ctx.lineTo(x+s*.18,y+s*.12); ctx.lineTo(x-s*.06,y+s*.32); ctx.stroke(); }
  function drawHud(){
    ctx.save(); ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    const tx=(t,x,yy,size,col)=>{ ctx.font='700 '+size+'px "Trebuchet MS"'; ctx.lineWidth=3.5; ctx.lineJoin='round';
      ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.strokeText(t,x,yy); ctx.fillStyle=col; ctx.fillText(t,x,yy); };
    // Health
    tx('Health',18,30,17,'#9a82b0');
    for(let i=0;i<MAXH;i++){ const hx=26+i*23, hy=47;
      if(i<health){ ctx.fillStyle='#ff7a9c'; heartPath(hx,hy,9); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
      else if(i===health){ brokenHeart(hx,hy,9); }
      else { ctx.fillStyle='rgba(255,255,255,.5)'; heartPath(hx,hy,9); ctx.fill(); } }
    // Score / Munch Points
    tx('Score',18,80,17,'#9a82b0');
    tx('Munch Points: '+score,18,100,16,'#7a5a8a');
    // Feast multiplier (grows as you chain snacks & thread hazards; bleeds if you idle)
    if(combo>0){ const m=feastMult(); const col=m>=4?'#ff3d7a':(m>=3?'#ff5a8a':(m>=2?'#ff8f4a':'#e0954a'));
      tx('FEAST  x'+m,18,124,18,col);
      ctx.fillStyle='rgba(255,255,255,.55)'; rr(20,131,96,7,3.5); ctx.fill();
      ctx.fillStyle=col; rr(20,131,96*clamp(comboT/150,0,1),7,3.5); ctx.fill(); }
    // coins (top-right)
    ctx.textAlign='right'; tx('🪙 '+runCoins, W-16, 32, 18, '#c99a2e'); ctx.textAlign='left';
    // active power-up timers (top-right, under coins)
    let py=58;
    const timer=(kind,frac)=>{ ctx.save(); ctx.translate(W-26,py);
      ctx.fillStyle='rgba(255,255,255,.85)'; circle(0,0,12); ctx.fill();
      ctx.save(); ctx.scale(0.55,0.55); powIcon(kind, 12); ctx.restore();
      ctx.strokeStyle= kind==='star'?'#ffcf3a':(kind==='magnet'?'#e8556a':'#7fc8ff'); ctx.lineWidth=2.6;
      ctx.beginPath(); ctx.arc(0,0,15,-Math.PI/2,-Math.PI/2+Math.max(0.02,frac)*6.283); ctx.stroke(); ctx.restore(); py+=32; };
    if(starMode>0) timer('star', starMode/380);
    if(magnet>0)   timer('magnet', magnet/440);
    if(shield>0)   timer('shield', 1);
    ctx.restore();
  }
  function centerText(t,y,size,col,strokeW){ ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='900 '+size+'px "Trebuchet MS"'; ctx.lineWidth=strokeW||6; ctx.strokeStyle='#fff'; ctx.fillStyle=col;
    ctx.strokeText(t,W/2,y); ctx.fillText(t,W/2,y); }
  // ---------- procedural logo (matches the Kawaii Sky Run wordmark) ----------
  function sparkle4(x,y,r,col){ ctx.save(); ctx.fillStyle=col; ctx.translate(x,y); ctx.beginPath();
    for(let i=0;i<4;i++){ const a=i*Math.PI/2; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); ctx.lineTo(Math.cos(a+.785)*r*.3,Math.sin(a+.785)*r*.3);} ctx.closePath(); ctx.fill(); ctx.restore(); }
  function puffyText(t,x,y,size,fill,hi){
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.font='900 '+size+'px "Trebuchet MS","Arial Black",sans-serif';
    ctx.strokeStyle='#d7a271'; ctx.lineWidth=size*0.42; ctx.strokeText(t,x,y);     // tan outer edge
    ctx.strokeStyle='#faf0da'; ctx.lineWidth=size*0.24; ctx.strokeText(t,x,y);     // cream inner edge
    ctx.fillStyle=fill; ctx.fillText(t,x,y);
    ctx.save(); ctx.beginPath(); ctx.rect(x-size*5,y-size*0.55,size*10,size*0.42); ctx.clip();
    ctx.fillStyle=hi; ctx.fillText(t,x,y); ctx.restore();                          // glossy top sheen
  }
  function miniMacaron(x,y,s){ ctx.save(); ctx.translate(x,y); ctx.lineJoin='round'; ctx.strokeStyle='#8f7f9e'; ctx.lineWidth=2;
    ctx.fillStyle='#bcd0e8'; ctx.beginPath(); ctx.arc(0,-s*.32,s,Math.PI*1.05,Math.PI*1.95); ctx.lineTo(s*.7,-s*.18); ctx.lineTo(-s*.7,-s*.18); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#eadff0'; rr(-s*.82,-s*.26,s*1.64,s*.34,3); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#a9d8c0'; ctx.beginPath(); ctx.arc(0,s*.08,s,Math.PI*.05,Math.PI*.95); ctx.lineTo(-s*.7,0); ctx.lineTo(s*.7,0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore(); }
  function drawLogo(cx,cy){
    sparkle4(cx-96,cy+4,6,'#e8c56a'); sparkle4(cx+98,cy-22,7,'#e8c56a'); sparkle4(cx+44,cy+4,4.5,'#e8c56a'); sparkle4(cx-44,cy-40,4,'#e8c56a');
    puffyText('KAWAII',cx,cy,44,'#a9dcc0','#cbeeda');
    puffyText('SKY RUN',cx,cy+48,44,'#f8c99f','#ffe3c8');
    miniMacaron(cx+8,cy+70,7);
    puffyText('Snack Dash',cx,cy+96,19,'#eab98f','#ffe3c8');
    ctx.fillStyle='#d7a271'; circle(cx-72,cy+96,2.4); ctx.fill(); circle(cx+72,cy+96,2.4); ctx.fill();
  }
  function drawSoundBtn(){ const x=W-30, y=34; ctx.save(); ctx.translate(x,y);
    ctx.fillStyle='rgba(255,255,255,.72)'; circle(0,0,17); ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='rgba(122,90,138,.35)'; ctx.stroke();
    ctx.fillStyle='#7a5a8a'; ctx.beginPath(); ctx.moveTo(-8,-3.5); ctx.lineTo(-3,-3.5); ctx.lineTo(2,-8); ctx.lineTo(2,8); ctx.lineTo(-3,3.5); ctx.lineTo(-8,3.5); ctx.closePath(); ctx.fill();  // speaker
    if(!muted){ ctx.strokeStyle='#7a5a8a'; ctx.lineWidth=1.8; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(3,0,4.5,-0.9,0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(3,0,8,-0.9,0.9); ctx.stroke(); }   // sound waves
    else { ctx.strokeStyle='#d05a6a'; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(4,-6); ctx.lineTo(12,6); ctx.moveTo(12,-6); ctx.lineTo(4,6); ctx.stroke(); }   // muted X
    ctx.restore(); }
  function drawStart(){
    if(logoReady){ const lw=Math.min(330,W-30), lh=lw*(468.52/788.31); ctx.drawImage(logo,(W-lw)/2,H*0.05,lw,lh); }
    else drawLogo(W/2, H*0.20);
    ctx.globalAlpha=.6+.4*Math.sin(frame*.1); centerText('TAP TO FLY!',H*0.60,26,'#ff7a9c',5); ctx.globalAlpha=1;
    centerText('tap to rise · eat the snacks · bounce the clouds',H*0.60+28,14,'#9a7f88',3);
    if(best>0) centerText('BEST '+best,H*0.66,15,'#9a7f88',3);
    if(dailyMsg){ ctx.globalAlpha=.7+.3*Math.sin(frame*.14); centerText('🎁 DAILY BONUS +'+dailyAmt+'!',H*0.70,18,'#3fae7a',4); ctx.globalAlpha=1; }
    drawSoundBtn();
    // ---- character select + coin bank ----
    centerText('🪙 '+coins+' coins',H*0.82-66,16,'#c99a2e',3);
    centerText('CHOOSE YOUR FLYER',H*0.82-46,13,'#9a82b0',3);
    for(let i=0;i<charImgs.length;i++){ const s=charSlot(i), img=charImgs[i], sel=(i===currentChar), lock=!unlocked[i];
      ctx.save();
      if(lock && denyShake>0) ctx.translate(rnd(-3.5,3.5),0);
      ctx.fillStyle= sel?'#fff8fc':'rgba(255,255,255,.6)'; circle(s.x,s.y,s.r); ctx.fill();
      ctx.lineWidth= sel?4:2; ctx.strokeStyle= sel?'#ff7a9c':(lock?'rgba(180,150,120,.5)':'rgba(122,90,138,.3)'); ctx.stroke();
      ctx.save(); ctx.beginPath(); ctx.arc(s.x,s.y,s.r-2,0,7); ctx.clip();
      if(img&&img.complete&&img.naturalWidth){ if(lock) ctx.globalAlpha=0.45; const iw=s.r*2.15, ih=iw*(img.naturalHeight/img.naturalWidth); ctx.drawImage(img,s.x-iw/2,s.y-ih/2+3,iw,ih); }
      ctx.restore();
      ctx.textAlign='center'; ctx.textBaseline='middle';
      if(lock){ ctx.font='700 20px "Trebuchet MS"'; ctx.fillStyle='rgba(90,70,90,.85)'; ctx.fillText('🔒',s.x,s.y);
        ctx.font='700 12px "Trebuchet MS"'; ctx.fillStyle= coins>=CHAR_COST[i]?'#3fae7a':'#c99a2e'; ctx.fillText('🪙'+CHAR_COST[i], s.x, s.y+s.r+16); }
      else { if(sel) star(s.x,s.y-s.r-7,4.5,'#ffd85a'); ctx.font='700 11px "Trebuchet MS"'; ctx.fillStyle= sel?'#ff7a9c':'#9a82b0'; ctx.fillText(CHAR_NAMES[i]||'', s.x, s.y+s.r+16); }
      ctx.restore();
    }
    ctx.textBaseline='alphabetic';
  }
  function drawOver(){ ctx.save(); ctx.fillStyle='rgba(122,90,99,.4)'; ctx.fillRect(0,0,W,H);
    centerText('ALL FULL!',H*0.36,42,'#fff'); centerText('SCORE '+score,H*0.45,30,'#ffe14d');
    centerText('🍩 '+munch+' munched',H*0.51,20,'#fff',4);
    centerText('🪙 +'+runCoins+' coins  (total '+coins+')',H*0.56,17,'#ffe14d',4);
    centerText('BEST '+best,H*0.60,17,'#fff',4);
    if(frame-overFrame>16){ ctx.globalAlpha=.6+.4*Math.sin(frame*.1); centerText('TAP TO RETRY',H*0.66,22,'#fff'); ctx.globalAlpha=1; } ctx.restore(); drawSoundBtn(); }

  // ---------- render ----------
  function render(){
    ctx.save(); if(shake>0) ctx.translate(rnd(-shake,shake)*.4,rnd(-shake,shake)*.4);
    drawSky(); drawGround();
    for(const f of foods) drawFood(f);
    drawPlatforms();
    drawHazards();
    drawCoins(); drawPowerups();
    drawHero(); drawFx();
    ctx.restore();
    if(flash>0){ ctx.fillStyle='rgba('+flashCol+','+(flash/16)+')'; ctx.fillRect(0,0,W,H); }
    if(state!==START) drawHud();   // title screen shows the logo instead
    if(state===PLAY && zoneBannerT>0){ const b=zoneBannerT;
      const a=b>120?(150-b)/30 : (b<30? b/30 : 1);
      ctx.save(); ctx.globalAlpha=clamp(a,0,1);
      centerText(ZONES[zoneIdx].name, H*0.15, 30, '#fff', 7);
      centerText('✦ new skies ✦', H*0.15+26, 14, '#ffe08a', 4); ctx.restore(); }
    if(state===START) drawStart();
    if(state===OVER) drawOver();
    if(state===PLAY && frame<150){ ctx.save(); ctx.globalAlpha=Math.max(0,1-frame/150); ctx.textAlign='center';
      ctx.font='700 16px "Trebuchet MS"'; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.strokeStyle='#fff'; ctx.fillStyle='#7a5a8a';
      const t='TAP to fly up ✨ bounce off the clouds';
      ctx.strokeText(t,W/2,H-58); ctx.fillText(t,W/2,H-58); ctx.restore(); }
  }

  // ---------- fixed-timestep loop ----------
  let acc=0,last=performance.now(); const STEP=1000/60;
  function loop(now){ acc+=Math.min(now-last,100); last=now; while(acc>=STEP){ update(); acc-=STEP; } render(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
