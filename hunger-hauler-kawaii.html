<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kawaii Sky Run — Kawaii Dragon</title>
<style>
  html,body{margin:0;height:100%;background:#efe9e0;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{box-shadow:0 20px 60px rgba(0,0,0,.4);border-radius:22px;}
</style>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  const W=390,H=560, DPR=2;
  const cv=document.getElementById('c'); const ctx=cv.getContext('2d');
  cv.width=W*DPR; cv.height=H*DPR; ctx.scale(DPR,DPR);
  function fit(){ const s=Math.min(innerWidth/W,innerHeight/H); cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px'; }
  addEventListener('resize',fit); fit();

  const P = {
    mint:'#a3ddc1', mintSh:'#8bccab', mintHi:'#c6edd9',
    peach:'#f8cfa4', peachSh:'#eeb989', peachHi:'#ffe7cb',
    line:'#4f7d68',
    blush:'#f2a1ab', mouth:'#e77f8e',
    gold:'#e7c05c', star:'#f6e0a0',
    heartA:'#f7b7b0', heartB:'#f39aa4', bow:'#8ecfe0',
  };
  const circle=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.closePath();};
  const ell=(x,y,rx,ry,rot)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,7);ctx.closePath();};
  function O(w){ ctx.lineJoin='round'; ctx.lineCap='round'; ctx.lineWidth=w||3; ctx.strokeStyle=P.line; }
  function blob(pts){ const n=pts.length; ctx.beginPath();
    ctx.moveTo((pts[0][0]+pts[n-1][0])/2,(pts[0][1]+pts[n-1][1])/2);
    for(let i=0;i<n;i++){ const c=pts[i], nx=pts[(i+1)%n]; ctx.quadraticCurveTo(c[0],c[1],(c[0]+nx[0])/2,(c[1]+nx[1])/2); }
    ctx.closePath(); }
  function star4(x,y,r,col){ ctx.save(); ctx.fillStyle=col; ctx.translate(x,y); ctx.beginPath();
    for(let i=0;i<4;i++){ const a=i*Math.PI/2; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); ctx.lineTo(Math.cos(a+.785)*r*.36,Math.sin(a+.785)*r*.36);} ctx.closePath(); ctx.fill(); ctx.restore(); }
  function heart(x,y,s,col){ ctx.save(); ctx.fillStyle=col; ctx.translate(x,y); ctx.beginPath();
    ctx.moveTo(0,s*.32); ctx.bezierCurveTo(-s,-s*.5,-s*.5,-s,0,-s*.35); ctx.bezierCurveTo(s*.5,-s,s,-s*.5,0,s*.32); ctx.closePath(); ctx.fill(); ctx.restore(); }
  function bow(x,y,s,col){ ctx.save(); ctx.translate(x,y); ctx.fillStyle=col; O(1.6);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-s,-s*.7); ctx.lineTo(-s,s*.7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(s,-s*.7); ctx.lineTo(s,s*.7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; circle(0,0,s*.28); ctx.fill(); ctx.restore(); }
  function flower(x,y,r,col){ ctx.save(); ctx.translate(x,y); ctx.fillStyle=col;
    for(let i=0;i<5;i++){ const a=i*1.256; circle(Math.cos(a)*r,Math.sin(a)*r,r*.62); ctx.fill(); }
    ctx.fillStyle=P.gold; circle(0,0,r*.5); ctx.fill(); ctx.restore(); }

  function dragon(){ ctx.save();
    // ---- WING (behind, upper-left) ----
    ctx.save();
    const wing=[[0,-26],[-22,-56],[-46,-54],[-32,-38],[-48,-30],[-30,-20],[-42,-10],[-18,-12],[-2,-20]];
    let wg=ctx.createLinearGradient(-50,-56,-4,-10); wg.addColorStop(0,P.peachHi); wg.addColorStop(1,P.peach);
    ctx.fillStyle=wg; blob(wing); ctx.fill(); O(3); ctx.stroke();
    ctx.strokeStyle=P.peachSh; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(-4,-22); ctx.lineTo(-40,-48); ctx.moveTo(-4,-20); ctx.lineTo(-38,-24); ctx.moveTo(-6,-18); ctx.lineTo(-28,-12); ctx.stroke();
    bow(-26,-40,5.5,P.bow); star4(-36,-28,3.6,P.gold);
    ctx.restore();

    // ---- TAIL (behind, lower-left, curling) ----
    ctx.save();
    const tail=[[-30,32],[-52,34],[-66,26],[-72,10],[-60,4],[-72,-6],[-62,-20],[-48,-16],[-46,2],[-34,20]];
    ctx.fillStyle=P.mint; blob(tail); ctx.fill(); O(3); ctx.stroke();
    ctx.fillStyle=P.peach; const tip=[[-62,-16],[-77,-24],[-83,-13],[-72,-10],[-80,-1],[-67,-1],[-59,-8]];
    blob(tip); ctx.fill(); O(2.6); ctx.stroke();
    star4(-42,12,3.4,P.gold); flower(-54,16,3.2,'#f4b8d0'); star4(-30,8,2.6,P.star);
    ctx.restore();

    // ---- BACK RIDGE SPIKES ----
    ctx.save(); ctx.fillStyle=P.peach; O(2.2);
    for(const s of [[18,-54],[2,-44],[-14,-32],[-26,-18]]){ ctx.beginPath(); ctx.ellipse(s[0],s[1],6.5,8.5,0.5,0,7); ctx.fill(); ctx.stroke(); }
    ctx.restore();

    // ---- BODY + HEAD silhouette (distinct head + sitting body) ----
    const body=[
      [34,-60],[60,-48],[68,-30],          // head crown -> cheek
      [80,-18],[82,-6],[72,2],[60,6],       // snout
      [56,18],[52,40],[38,58],              // chest -> belly -> front foot
      [10,64],[-18,58],[-40,42],[-48,20],   // bottom / back
      [-42,-2],[-30,-28],[-6,-52]           // back up to head
    ];
    ctx.fillStyle=P.mint; blob(body); ctx.fill(); O(3.2); ctx.stroke();
    ctx.save(); blob(body); ctx.clip();
    ctx.fillStyle=P.mintHi; ctx.globalAlpha=.55; ell(30,-34,30,20,-.25); ctx.fill();
    ctx.globalAlpha=.3; ctx.fillStyle=P.mintSh; ell(-6,44,40,22,0); ctx.fill(); ctx.restore();

    // ---- PEACH BELLY PATCH ----
    ctx.save();
    const belly=[[50,10],[56,26],[48,46],[30,56],[16,50],[26,32],[32,16],[42,6]];
    ctx.fillStyle=P.peach; blob(belly); ctx.fill(); O(2.4); ctx.stroke(); ctx.restore();

    // ---- FEET + little ARM ----
    ctx.fillStyle=P.mint; O(2.6);
    ell(30,60,12,8,0); ctx.fill(); ctx.stroke();                 // front foot
    ell(-6,62,12,8,0); ctx.fill(); ctx.stroke();                 // back foot
    ctx.strokeStyle=P.peachSh; ctx.lineWidth=1.7;
    ctx.beginPath(); ctx.moveTo(26,62); ctx.lineTo(26,66); ctx.moveTo(33,62); ctx.lineTo(33,66);
    ctx.moveTo(-10,64); ctx.lineTo(-10,68); ctx.moveTo(-3,64); ctx.lineTo(-3,68); ctx.stroke();
    ctx.fillStyle=P.mint; O(2.6); ell(50,30,8,10,-.25); ctx.fill(); ctx.stroke();  // arm

    // ---- HORNS ----
    ctx.save(); ctx.fillStyle=P.peach; O(2.6);
    let h=[[38,-56],[34,-76,],[48,-70],[46,-54]]; blob(h); ctx.fill(); ctx.stroke();
    ctx.fillStyle=P.peachHi; ell(40,-64,2.6,5,-.2); ctx.fill();
    ctx.fillStyle=P.peach; O(2.6); h=[[54,-52],[56,-70],[66,-58],[62,-48]]; blob(h); ctx.fill(); ctx.stroke();
    ctx.restore();

    // ---- FACE ----
    // ear fin behind eye
    ctx.fillStyle=P.mintSh; O(2.2); ell(34,-34,6,9,-.35); ctx.fill(); ctx.stroke();
    // BIG kawaii eye
    ctx.save();
    const ex=54, ey=-30, ew=14, eh=19;
    ell(ex,ey,ew,eh,0.05); ctx.save(); ctx.clip();
    let ig=ctx.createLinearGradient(ex,ey-eh,ex,ey+eh); ig.addColorStop(0,'#9bd8b6'); ig.addColorStop(.5,'#3f7d84'); ig.addColorStop(1,'#22333f');
    ctx.fillStyle=ig; ctx.fillRect(ex-ew-2,ey-eh-2,ew*2+4,eh*2+4);
    ctx.fillStyle='rgba(150,220,200,.5)'; ell(ex+2,ey+eh*.5,ew*.8,eh*.4,0); ctx.fill();
    ctx.fillStyle='#fff'; ell(ex-4,ey-eh*.42,ew*.42,eh*.34,-.3); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.92)'; ell(ex+6,ey+eh*.08,ew*.24,eh*.18,-.3); ctx.fill();
    ctx.restore();
    O(3); ell(ex,ey,ew,eh,0.05); ctx.stroke();
    ctx.strokeStyle=P.line; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(ex,ey,ew,Math.PI*1.06,Math.PI*1.78); ctx.stroke();
    star4(ex-6,ey-10,3.2,'#fff'); star4(ex+8,ey-3,2,'#fff'); star4(ex+1,ey+9,1.7,'#eafff5');
    ctx.restore();
    // blush
    ctx.fillStyle='rgba(242,161,171,.62)'; ell(68,-10,8,5.5,0); ctx.fill();
    ctx.fillStyle='rgba(242,161,171,.3)'; ell(40,-16,6,4.5,0); ctx.fill();
    // nostril + happy mouth
    ctx.fillStyle=P.line; circle(78,-8,1.4); ctx.fill();
    ctx.strokeStyle=P.line; ctx.lineWidth=2.3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(70,0); ctx.quadraticCurveTo(76,6,82,1); ctx.stroke();
    ctx.fillStyle=P.mouth; ell(76,3,2.8,1.6,0); ctx.fill();

    // body sparkles
    star4(18,22,2.8,P.gold); star4(4,42,2.3,P.star); star4(40,34,2,P.gold);

    // ---- floating hearts (kiss, to the right) ----
    heart(96,-2,9,P.heartB); heart(108,-16,6,P.heartA); heart(114,4,4,P.heartA); star4(101,-4,2,P.gold);
    ctx.restore();
  }

  function bg(){ ctx.fillStyle='#fdfbf6'; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.globalAlpha=.5; let g=ctx.createRadialGradient(W/2,H*0.44,20,W/2,H*0.44,220); g.addColorStop(0,'#eafaf2'); g.addColorStop(1,'#fdfbf6'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore(); }
  bg();
  ctx.save(); ctx.translate(W*0.44, H*0.46); ctx.scale(2.1,2.1); dragon(); ctx.restore();
  ctx.save(); ctx.textAlign='center'; ctx.fillStyle='#5f7d70'; ctx.font='700 18px "Trebuchet MS",sans-serif';
  ctx.fillText('KAWAII HERO — matching your reference', W/2, H-40);
  ctx.fillStyle='#9aa7a0'; ctx.font='400 12px "Trebuchet MS",sans-serif';
  ctx.fillText('mint + peach · huge sparkle eye · soft sage line · blush · charms', W/2, H-22); ctx.restore();
})();
</script>
