  // ---------- palette ----------
  const SKY0='#bff0e0', SKY1='#ffe2c2', SKY2='#ffd0dd', SKY3='#d9c4ef';
  const INK='#7a5a63';   // soft food outline (never black)

  // ---------- helpers ----------
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const circle=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.closePath();};
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function heartPath(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.32);ctx.bezierCurveTo(x-s,y-s*.5,x-s*.5,y-s,x,y-s*.35);ctx.bezierCurveTo(x+s*.5,y-s,x+s,y-s*.5,x,y+s*.32);ctx.closePath();}
  function star(x,y,r,col){ctx.save();ctx.fillStyle=col;ctx.translate(x,y);ctx.beginPath();for(let i=0;i<5;i++){const a=-1.57+i*1.2566;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(a+.628)*r*.45,Math.sin(a+.628)*r*.45);}ctx.closePath();ctx.fill();ctx.restore();}

  // ---------- state ----------
  const START=0, PLAY=1, OVER=2;
  let state=START, frame=0, score=0, munch=0, best=+(localStorage.getItem('hh_best')||0);
  let health=3; const MAXH=5;
  let speed=2.4, spawnT=60, invuln=0, shake=0, flash=0, flashCol='255,120,120';
  const player={ x:W*0.30, y:H*0.42, vy:0, flap:0 };
  let foods=[], parts=[], pops=[], clouds=[], combo=0;

  // ---------- food catalogue (kawaii) ----------
  const TYPES=['donut','boba','dango'];
  function spawnFood(){
    const type=TYPES[(Math.random()*TYPES.length)|0];
    foods.push({ type, x:W+40, y:rnd(H*0.16,H*0.74), r:24, bob:rnd(0,6.28), rot:rnd(-.2,.2), got:0 });
  }
  function initClouds(){ clouds=[]; for(let i=0;i<5;i++) clouds.push({x:rnd(0,W),y:rnd(40,H*0.5),s:rnd(26,46),v:rnd(.15,.4)}); }
  initClouds();

  // ---------- audio ----------
  let ac=null;
  function blip(f,d,t,v){ try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(); o.type=t||'sine'; o.frequency.value=f;
    g.gain.value=v||.06; o.connect(g); g.connect(ac.destination); const n=ac.currentTime; o.start(n);
    o.frequency.exponentialRampToValueAtTime(f*1.6,n+d); g.gain.exponentialRampToValueAtTime(.0001,n+d); o.stop(n+d);}catch(e){} }
  const sMunch=()=>blip(560+Math.random()*140,.12,'sine',.07);
  const sHurt =()=>blip(200,.25,'triangle',.09);

  // ---------- input ----------
  function flap(){
    if(state===START){ state=PLAY; player.vy=-6; return; }
    if(state===OVER){ if(frame-overFrame>16) reset(); return; }
    player.vy=-6.4; player.flap=1;
  }
  let overFrame=0;
  addEventListener('pointerdown',e=>{e.preventDefault();flap();},{passive:false});
  addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();flap();} });

  function reset(){ state=PLAY; frame=0; score=0; munch=0; health=3; speed=2.4; spawnT=50;
    invuln=90; combo=0; player.y=H*0.42; player.vy=0; player.flap=0; foods=[]; parts=[]; pops=[]; }

  // ---------- fx ----------
  function burst(x,y,cols){ for(let i=0;i<12;i++){ const a=rnd(0,6.28),sp=rnd(1.5,5);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:0,max:rnd(20,36),r:rnd(2,4.5),
      col:cols[(Math.random()*cols.length)|0], heart:Math.random()<.4}); } }
  function pop(x,y,txt,big){ pops.push({x,y,txt,life:0,max:36,big}); }
  function hurt(){ if(invuln>0) return; health--; invuln=80; shake=14; flash=10; flashCol='255,120,120'; combo=0; sHurt();
    if(health<=0){ state=OVER; overFrame=frame; best=Math.max(best,score); localStorage.setItem('hh_best',best); } }

  // ---------- update ----------
  function update(){
    frame++;
    if(flash>0)flash--; if(shake>0)shake--; if(invuln>0)invuln--;
    for(const c of clouds){ c.x-=c.v*(state===PLAY?1:.4); if(c.x<-60){c.x=W+40;c.y=rnd(40,H*0.5);} }
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.96;p.life++;if(p.life>=p.max)parts.splice(i,1);}
    for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.life++;p.y-=1.1;if(p.life>=p.max)pops.splice(i,1);}
    player.flap*=.86;

    if(state===START){ player.y=H*0.42+Math.sin(frame*0.06)*10; return; }
    if(state!==PLAY) return;

    speed+=0.0006;
    // physics
    player.vy=clamp(player.vy+0.42,-9,11); player.y+=player.vy;
    // floor / ceiling
    if(player.y<44){ player.y=44; player.vy=1; hurt(); }
    if(player.y>H-70){ player.y=H-70; player.vy=-3; hurt(); }
    // spawns
    if(--spawnT<=0){ spawnFood(); spawnT=Math.max(46,86-frame*0.02); }
    // hitbox around head/body (right-center of sprite)
    const DW=140, hbx=player.x+DW*0.13, hby=player.y, hw=40, hh=40;
    for(let i=foods.length-1;i>=0;i--){ const f=foods[i]; f.x-=speed; f.bob+=0.08;
      if(f.got>0){ f.got+=0.14; if(f.got>=1) foods.splice(i,1); continue; }
      // AABB collision
      if(Math.abs(f.x-hbx)<hw*0.5+f.r && Math.abs(f.y+Math.sin(f.bob)*3-hby)<hh*0.5+f.r){
        f.got=0.001; combo++; const g=10*(1+Math.floor(combo/5));
        score+=g; munch++; player.flap=0.6;
        flash=4; flashCol='255,255,255';
        pop(f.x,f.y-12,'+'+g, combo%5===0);
        burst(f.x,f.y, foodCols(f.type)); sMunch();
        if(munch%10===0 && health<MAXH){ health++; pop(player.x,player.y-46,'+♥',true); }
      } else if(f.x<-40){ foods.splice(i,1); hurt(); }   // missed food costs health
    }
  }
  function foodCols(t){ return ({donut:['#ff9ecf','#8ee0d0','#ffe14d'],boba:['#d9a86a','#3a2a22','#fff'],dango:['#ff9ecf','#fff3e0','#a3e0b0']})[t]; }

  // ---------- draw: world ----------
  function drawSky(){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,SKY0);g.addColorStop(.4,SKY1);g.addColorStop(.72,SKY2);g.addColorStop(1,SKY3);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.globalAlpha=.5; ctx.fillStyle='#fff6d8'; circle(W*0.76,H*0.2,54); ctx.fill(); ctx.restore();
    for(const c of clouds){ ctx.save(); ctx.globalAlpha=.7; ctx.fillStyle='#fffdf8';
      circle(c.x,c.y,c.s); ctx.fill(); circle(c.x+c.s*.8,c.y+6,c.s*.7); ctx.fill(); circle(c.x-c.s*.8,c.y+8,c.s*.65); ctx.fill(); ctx.restore(); }
    // sparkles
    for(let i=0;i<7;i++){ const sx=(i*61+frame*0.3)%W, sy=90+((i*130)%(H*0.5)); star(sx,sy,2.2,'rgba(255,255,255,.7)'); }
  }
  function drawGround(){ const gy=H-40; ctx.fillStyle='#e7b9d0'; rr(0,gy,W,40,0); ctx.fill();
    ctx.fillStyle='#f6d3e4'; for(let x=-20;x<W+20;x+=44){ const off=(frame*speed)%44; circle(x-off+22,gy,16); ctx.fill(); } }

  // ---------- draw: food (kawaii) ----------
  function drawFood(f){ const y=f.y+Math.sin(f.bob)*3; ctx.save(); ctx.translate(f.x,y); ctx.rotate(f.rot);
    if(f.got>0){ const s=1-f.got; ctx.scale(s,s); ctx.globalAlpha=s; }
    ctx.lineJoin='round'; ctx.lineCap='round'; const r=f.r;
    if(f.type==='donut'){
      ctx.fillStyle='#e7a86b'; circle(0,0,r); ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.stroke();
      ctx.fillStyle='#ff9ecf'; circle(0,0,r*.94); ctx.fill();               // pink glaze
      ctx.fillStyle='rgba(255,255,255,.35)'; circle(-r*.3,-r*.3,r*.5); ctx.fill();
      ctx.fillStyle='#2b1f26'; circle(0,0,r*.34); ctx.fill();               // hole
      ctx.fillStyle='#f6d3e4'; circle(0,0,r*.34); ctx.globalAlpha=0; ctx.fill(); ctx.globalAlpha=1;
      ['#8ee0d0','#ffe14d','#ff7a9c','#a9e0ff'].forEach((c,i)=>{ctx.strokeStyle=c;ctx.lineWidth=3;const a=i*1.5;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.55,Math.sin(a)*r*.55);ctx.lineTo(Math.cos(a+.4)*r*.72,Math.sin(a+.4)*r*.72);ctx.stroke();});
    } else if(f.type==='boba'){
      // cup
      ctx.fillStyle='#f7ede0'; ctx.beginPath(); ctx.moveTo(-r*.8,-r); ctx.lineTo(r*.8,-r); ctx.lineTo(r*.6,r); ctx.lineTo(-r*.6,r); ctx.closePath(); ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.stroke();
      // tea
      ctx.save(); ctx.beginPath(); ctx.moveTo(-r*.74,-r*.4); ctx.lineTo(r*.74,-r*.4); ctx.lineTo(r*.6,r*.9); ctx.lineTo(-r*.6,r*.9); ctx.closePath(); ctx.clip();
      ctx.fillStyle='#d9a86a'; ctx.fillRect(-r,-r,r*2,r*2);
      ctx.fillStyle='#3a2a22'; for(const p of [[-r*.35,r*.55],[0,r*.62],[r*.35,r*.55],[-r*.15,r*.35],[r*.18,r*.38]]) { circle(p[0],p[1],r*.16); ctx.fill(); }
      ctx.restore();
      // lid + straw
      ctx.fillStyle='#cdeadd'; rr(-r*.9,-r*1.16,r*1.8,r*.28,4); ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.stroke();
      ctx.strokeStyle='#ff9ecf'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(r*.2,-r*1.1); ctx.lineTo(r*.5,-r*1.8); ctx.stroke();
    } else { // dango — 3 stacked balls on a stick
      ctx.strokeStyle='#c9a26a'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(0,-r*1.2); ctx.lineTo(0,r*1.3); ctx.stroke();
      const balls=[['#ff9ecf',-r*.78],['#fff3e0',0],['#a3e0b0',r*.78]];
      for(const b of balls){ ctx.fillStyle=b[0]; circle(0,b[1],r*.6); ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.6)'; circle(-r*.2,b[1]-r*.2,r*.14); ctx.fill(); }
    }
    ctx.restore();
  }

  // ---------- draw: hero sprite ----------
  function drawHero(){
    const DW=140, DH=DW*(352/380);
    const bob=(state===PLAY)?0:Math.sin(frame*0.06)*0; // physics handles play bob
    const tilt=clamp(player.vy*0.035,-0.35,0.55);
    const sq=1+player.flap*0.12;                     // flap squash-stretch
    ctx.save();
    ctx.translate(player.x, player.y+bob);
    ctx.rotate(tilt);
    if(invuln>0 && state===PLAY && (frame&4)) ctx.globalAlpha=0.5;   // hurt blink
    ctx.scale(1/sq, sq);
    if(heroReady) ctx.drawImage(hero, -DW*0.5, -DH*0.5, DW, DH);
    else { ctx.fillStyle='#a3ddc1'; circle(0,0,40); ctx.fill(); }
    ctx.restore();
  }

  // ---------- draw: fx + hud ----------
  function drawFx(){
    for(const p of parts){ ctx.save(); ctx.globalAlpha=1-p.life/p.max; ctx.fillStyle=p.col;
      if(p.heart){ heartPath(p.x,p.y,p.r*1.4); ctx.fill(); } else { circle(p.x,p.y,p.r); ctx.fill(); } ctx.restore(); }
    for(const p of pops){ ctx.save(); ctx.globalAlpha=1-p.life/p.max; ctx.textAlign='center';
      ctx.font='900 '+(p.big?26:20)+'px "Trebuchet MS"'; ctx.lineWidth=4; ctx.strokeStyle='#fff'; ctx.fillStyle=p.big?'#ff7a9c':'#7a5a63';
      ctx.strokeText(p.txt,p.x,p.y); ctx.fillText(p.txt,p.x,p.y); ctx.restore(); }
  }
  function pill(x,y,w,h){ ctx.save(); ctx.fillStyle='rgba(255,255,255,.82)'; rr(x,y,w,h,h/2); ctx.fill();
    ctx.strokeStyle='rgba(122,90,99,.25)'; ctx.lineWidth=1.5; ctx.stroke(); ctx.restore(); }
  function drawHud(){
    // score + munch (top-left)
    pill(14,16,132,32); ctx.textAlign='left'; ctx.textBaseline='middle';
    star(30,32,7,'#ffcf5a'); ctx.fillStyle='#7a5a63'; ctx.font='900 17px "Trebuchet MS"'; ctx.fillText(score,44,33);
    pill(14,54,132,30); ctx.fillStyle='#e78fb8'; ctx.font='900 15px "Trebuchet MS"'; ctx.fillText('🍩 '+munch+' munch',28,70);
    // hearts (top-right)
    for(let i=0;i<MAXH;i++){ const hx=W-30-i*30, hy=32;
      if(i<health){ ctx.fillStyle='#ff7a9c'; heartPath(hx,hy,11); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
      else if(i<3){ ctx.fillStyle='rgba(255,255,255,.5)'; heartPath(hx,hy,11); ctx.fill(); } }
  }
  function centerText(t,y,size,col,strokeW){ ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='900 '+size+'px "Trebuchet MS"'; ctx.lineWidth=strokeW||6; ctx.strokeStyle='#fff'; ctx.fillStyle=col;
    ctx.strokeText(t,W/2,y); ctx.fillText(t,W/2,y); }
  function drawStart(){
    centerText('HUNGER',H*0.22,44,'#7a5a63');
    centerText('HAULER',H*0.22+50,44,'#ff7a9c');
    ctx.globalAlpha=.6+.4*Math.sin(frame*.1); centerText('TAP TO FLY',H*0.63,22,'#7a5a63',5); ctx.globalAlpha=1;
    centerText('catch the treats · keep your hearts',H*0.63+28,14,'#9a7f88',3);
    if(best>0) centerText('BEST '+best,H*0.70,16,'#9a7f88',3); }
  function drawOver(){ ctx.save(); ctx.fillStyle='rgba(122,90,99,.4)'; ctx.fillRect(0,0,W,H);
    centerText('ALL FULL!',H*0.36,42,'#fff'); centerText('SCORE '+score,H*0.45,30,'#ffe14d');
    centerText('🍩 '+munch+' munched',H*0.51,20,'#fff',4); centerText('BEST '+best,H*0.56,18,'#fff',4);
    if(frame-overFrame>16){ ctx.globalAlpha=.6+.4*Math.sin(frame*.1); centerText('TAP TO RETRY',H*0.66,22,'#fff'); ctx.globalAlpha=1; } ctx.restore(); }

  // ---------- render ----------
  function render(){
    ctx.save(); if(shake>0) ctx.translate(rnd(-shake,shake)*.4,rnd(-shake,shake)*.4);
    drawSky(); drawGround();
    for(const f of foods) drawFood(f);
    drawHero(); drawFx();
    ctx.restore();
    if(flash>0){ ctx.fillStyle='rgba('+flashCol+','+(flash/16)+')'; ctx.fillRect(0,0,W,H); }
    drawHud();
    if(state===START) drawStart();
    if(state===OVER) drawOver();
  }

  // ---------- fixed-timestep loop ----------
  let acc=0,last=performance.now(); const STEP=1000/60;
  function loop(now){ acc+=Math.min(now-last,100); last=now; while(acc>=STEP){ update(); acc-=STEP; } render(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
