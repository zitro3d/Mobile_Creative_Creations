<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magical Portal — Animated 64×128 HD</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: linear-gradient(135deg, #050214 0%, #0e0625 50%, #050214 100%);
    min-height: 100vh;
    padding: 24px 16px 40px;
    color: #f0e0ff;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  h1 {
    margin: 0;
    letter-spacing: 0.1em;
    font-size: clamp(20px, 3.6vw, 30px);
    background: linear-gradient(90deg, #ff59b3, #ffd947, #4ee2ec, #a2f075);
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
  }
  .sub { margin: 0; color: #a090c0; font-size: 13px; text-align: center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: transparent;
    max-height: 80vh;
    width: auto;
    filter: drop-shadow(0 0 24px rgba(255, 89, 179, 0.35))
            drop-shadow(0 0 48px rgba(78, 226, 236, 0.20))
            drop-shadow(0 0 72px rgba(255, 217, 71, 0.12));
  }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {

    border: 1px solid #5a3a85;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit;
  }
  button:hover { background: #3a2055; }
  button[aria-pressed="true"] { background: #5a3a85; }
</style>

<body>
  <h1>MAGICAL PORTAL · ANIMATED</h1>
  <p class="sub">64×128 strict matrix · 24 fps · 72-frame loop · flame flickers, crystals pulse, energy flows</p>
  <div id="root"></div>
  <div class="controls">
    <button id="pause" aria-pressed="false">Pause</button>
    <button id="slow" aria-pressed="false">Slower</button>
    <button id="lArch"   aria-pressed="true">Arch</button>
    <button id="lVortex" aria-pressed="true">Vortex</button>
    <button id="lDust"   aria-pressed="true">Dust</button>
  </div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useRef, useEffect } = React;

const PORTAL_W = 192;
const PORTAL_H = 256;
const TOTAL_FRAMES = 72;

const PALETTE = [
  'transparent',
  '#000000',
  '#170f26',
  '#341e54',
  '#6a357a',
  '#ff59b3',
  '#4ee2ec',
  '#a2f075',
  '#ffd947',
  '#fff6cc',
];

function buildGrid(frame, layers) {
  // Three logical layers, each independently togglable:
  //   layers.arch   — the static doorway frame + closed purple sill
  //   layers.vortex — the swirling spiral inside the door opening
  //   layers.dust   — the magical particles bursting toward the camera
  layers = layers || { arch: true, vortex: true, dust: true };
  // Portal proper still uses the original 64x128 grid — every line of the
  // existing build code references these dims, so nothing inside the portal
  // build needs to move. We composite the portal into the larger canvas at
  // the end.
  const W = 64, H = 128;
  const g = Array.from({ length: H }, () => Array(W).fill(0));
  const set = (r, c, v) => {
    if (r >= 0 && r < H && c >= 0 && c < W) g[r][c] = v;
  };
  const fill = (r1, c1, r2, c2, v) => {
    for (let r = r1; r <= r2; r++)
      for (let c = c1; c <= c2; c++)
        set(r, c, v);
  };

  // ── BLACK VOID (arch layer background) ──
  if (layers.arch) {
    fill(16, 19, 115, 44, 1);
  }

  // ── SWIRLING VORTEX inside the doorway (vortex layer) ──
  // For each void pixel, compute polar coordinates from the central
  // vanishing point and pick a colour from the 3-spiral-arm pattern.
  // The arms wind inward (TWIST*d term) and rotate over the loop, giving
  // the "pulling backward" swirl. Same 3 cool colours as before so the
  // vortex doesn't fight the arch's warm gold/magenta palette.
  if (layers.vortex) {
    const VCX = 32, VCY = 65;
    const HALF_W = 12.5, HALF_H = 49.5;
    const N_ARMS = 3;
    const TWIST = 5;
    const t = frame / TOTAL_FRAMES;
    const rotation = t * Math.PI * 2;     // one full rotation per loop
    const TAU = Math.PI * 2;

    for (let r = 16; r <= 115; r++) {
      for (let c = 19; c <= 44; c++) {
        const dy = (r - VCY) / HALF_H;    // normalised to half-height
        const dx = (c - VCX) / HALF_W;
        const d = Math.sqrt(dx * dx + dy * dy);

        // Hot cream vanishing-point core
        if (d < 0.10) {
          set(r, c, 9);
          continue;
        }

        const theta = Math.atan2(dy, dx);
        // arms move inward over time → "pulling backward" feel
        const arg = N_ARMS * theta + TWIST * d + rotation;
        const phase = ((arg / TAU) % 1 + 1) % 1;

        let color;
        if      (phase < 0.34) color = 9;   // cream — bright arm
        else if (phase < 0.67) color = 6;   // cyan — mid
        else                   color = 3;   // plum — gap / arm trail
        set(r, c, color);
      }
    }

    // Twinkle around the hot core
    const tw = frame % 3;
    if (tw === 0) set(VCY - 1, VCX, 6);
    if (tw === 1) set(VCY, VCX + 1, 6);
    if (tw === 2) set(VCY + 1, VCX, 6);
  }

  // ── ARCH LAYER (everything from here through the sparkles) ──
  if (layers.arch) {

  // ── PURPLE SILL — closes the bottom of the doorway "box" ──
  fill(112, 19, 115, 44, 3);            // plum floor
  fill(112, 19, 112, 44, 4);            // a brighter magenta highlight on the lip
  set(112, 19, 2); set(112, 44, 2);    // dark outline corners
  set(115, 19, 2); set(115, 44, 2);

  // ── PINK RIM ──
  fill(14, 17, 15, 46, 5);
  fill(14, 17, 115, 18, 5);
  fill(14, 45, 115, 46, 5);

  // ── LEFT PILLAR ──
  for (let r = 14; r <= 115; r++) {
    let pattern;
    if (r <= 24)       pattern = [2,3,3,4,4,7,7,7,8,8,8,9,9];
    else if (r <= 50)  pattern = [2,3,3,4,4,4,7,7,7,8,8,9,8];
    else if (r <= 75)  pattern = [2,3,3,3,4,4,7,7,7,7,8,8,7];
    else if (r <= 100) pattern = [2,3,3,3,4,4,4,4,7,7,7,4,4];
    else               pattern = [2,2,3,3,3,4,4,4,4,3,3,3,3];
    for (let i = 0; i < 13; i++) set(r, 4 + i, pattern[i]);
  }
  // ── RIGHT PILLAR (mirror) ──
  for (let r = 14; r <= 115; r++) {
    let pattern;
    if (r <= 24)       pattern = [2,3,3,4,4,7,7,7,8,8,8,9,9];
    else if (r <= 50)  pattern = [2,3,3,4,4,4,7,7,7,8,8,9,8];
    else if (r <= 75)  pattern = [2,3,3,3,4,4,7,7,7,7,8,8,7];
    else if (r <= 100) pattern = [2,3,3,3,4,4,4,4,7,7,7,4,4];
    else               pattern = [2,2,3,3,3,4,4,4,4,3,3,3,3];
    for (let i = 0; i < 13; i++) set(r, 47 + i, pattern[12 - i]);
  }

  // ── ANIMATED PILLAR PULSE — bright cream pixels travel down inner edge ──
  // 36*3 = 108, and 108 % 108 = 0 → seamless over the loop.
  const pulseY1 = 14 + ((frame * 3) % 108);
  const pulseY2 = 14 + ((frame * 3 + 54) % 108);
  for (const py of [pulseY1, pulseY2]) {
    if (py >= 14 && py <= 113) {
      // Brighten inner-edge pillar pixels
      if (g[py][15]) set(py, 15, 9);
      if (g[py][16]) set(py, 16, 9);
      if (g[py][47]) set(py, 47, 9);
      if (g[py][48]) set(py, 48, 9);
    }
  }

  // ── ANIMATED CRYSTAL NODES (hot core pulses) ──
  // 3 frames per state × 4 states = 12-frame cycle; 36 % 12 = 0 → seamless.
  const crystalPhase = Math.floor((frame % 12) / 3);
  const crystalShapes = [
    [
      [60, [0,0,0,6,0,0,0]],
      [61, [0,0,6,6,6,0,0]],
      [62, [0,6,6,6,6,6,0]],
      [63, [6,6,6,6,6,6,6]],
      [64, [6,6,9,9,9,6,6]],
      [65, [6,9,9,9,9,9,6]],
      [66, [6,6,9,9,9,6,6]],
      [67, [6,6,6,6,6,6,6]],
      [68, [0,6,6,6,6,6,0]],
      [69, [0,0,6,6,6,0,0]],
      [70, [0,0,0,6,0,0,0]],
    ],
    [
      [60, [0,0,0,6,0,0,0]],
      [61, [0,0,6,6,6,0,0]],
      [62, [0,6,6,9,6,6,0]],
      [63, [6,6,9,9,9,6,6]],
      [64, [6,9,9,9,9,9,6]],
      [65, [9,9,9,9,9,9,9]],
      [66, [6,9,9,9,9,9,6]],
      [67, [6,6,9,9,9,6,6]],
      [68, [0,6,6,9,6,6,0]],
      [69, [0,0,6,6,6,0,0]],
      [70, [0,0,0,6,0,0,0]],
    ],
    [
      [60, [0,0,0,9,0,0,0]],
      [61, [0,0,6,9,6,0,0]],
      [62, [0,6,9,9,9,6,0]],
      [63, [6,9,9,9,9,9,6]],
      [64, [9,9,9,9,9,9,9]],
      [65, [9,9,9,9,9,9,9]],
      [66, [9,9,9,9,9,9,9]],
      [67, [6,9,9,9,9,9,6]],
      [68, [0,6,9,9,9,6,0]],
      [69, [0,0,6,9,6,0,0]],
      [70, [0,0,0,9,0,0,0]],
    ],
    [
      [60, [0,0,0,6,0,0,0]],
      [61, [0,0,6,6,6,0,0]],
      [62, [0,6,6,9,6,6,0]],
      [63, [6,6,9,9,9,6,6]],
      [64, [6,9,9,9,9,9,6]],
      [65, [9,9,9,9,9,9,9]],
      [66, [6,9,9,9,9,9,6]],
      [67, [6,6,9,9,9,6,6]],
      [68, [0,6,6,9,6,6,0]],
      [69, [0,0,6,6,6,0,0]],
      [70, [0,0,0,6,0,0,0]],
    ],
  ];
  const crystal = crystalShapes[crystalPhase];
  for (const [r, row] of crystal)
    for (let c = 0; c < row.length; c++)
      if (row[c] !== 0) set(r, c, row[c]);
  for (const [r, row] of crystal)
    for (let c = 0; c < row.length; c++)
      if (row[c] !== 0) set(r, 63 - c, row[c]);

  // ── TOP CROWN BODY ──
  fill(5, 4, 13, 59, 3);
  fill(5, 4, 5, 59, 2);
  fill(6, 4, 13, 4, 2);
  fill(6, 59, 13, 59, 2);
  fill(13, 4, 13, 59, 2);
  for (let r = 7; r <= 11; r++) {
    for (let c = 6; c <= 57; c++) {
      if ((r * 3 + c) % 9 === 0) g[r][c] = 4;
    }
  }
  const crownGold = [[7,12],[7,51],[8,18],[8,45],[9,22],[9,41],[10,9],[10,54],[11,15],[11,48],[8,30],[8,33],[10,27],[10,36]];
  for (const [r, c] of crownGold) set(r, c, 8);
  const crownCream = [[7,8],[7,55],[8,14],[8,49],[9,18],[9,45],[10,11],[10,52],[6,22],[6,41]];
  for (const [r, c] of crownCream) set(r, c, 9);

  // ── BLINKING STARS in the crown ──
  const blinkStars = [[7,15,9],[8,22,9],[9,33,8],[10,41,9],[11,28,8],[7,48,9],[6,30,9],[6,38,8]];
  for (const [r, c, v] of blinkStars) {
    if ((frame + r * 5 + c * 3) % 9 < 5) set(r, c, v);
  }

  // ── CORNER FLARES ──
  fill(4, 0, 4, 7, 3);
  set(4, 0, 2); set(4, 7, 2);
  fill(3, 1, 3, 6, 3);
  set(3, 1, 2); set(3, 6, 2);
  fill(2, 2, 2, 5, 3);
  set(2, 2, 2); set(2, 5, 2);
  fill(1, 3, 1, 4, 2);
  set(3, 3, 8); set(3, 4, 8);
  set(2, 3, 9); set(2, 4, 9);
  fill(4, 56, 4, 63, 3);
  set(4, 56, 2); set(4, 63, 2);
  fill(3, 57, 3, 62, 3);
  set(3, 57, 2); set(3, 62, 2);
  fill(2, 58, 2, 61, 3);
  set(2, 58, 2); set(2, 61, 2);
  fill(1, 59, 1, 60, 2);
  set(3, 59, 8); set(3, 60, 8);
  set(2, 59, 9); set(2, 60, 9);

  // ── ANIMATED FLAME (3-state flicker) ──
  const flamePhase = frame % 3;
  if (flamePhase === 0) {
    // Centered
    set(0, 31, 9); set(0, 32, 9);
    set(1, 30, 8); set(1, 31, 9); set(1, 32, 9); set(1, 33, 8);
    fill(2, 29, 2, 34, 8);
    set(2, 30, 9); set(2, 31, 9); set(2, 32, 9); set(2, 33, 9);
    fill(3, 28, 3, 35, 8);
    set(3, 30, 9); set(3, 31, 9); set(3, 32, 9); set(3, 33, 9);
    fill(4, 27, 4, 36, 8);
    set(4, 30, 9); set(4, 31, 9); set(4, 32, 9); set(4, 33, 9);
  } else if (flamePhase === 1) {
    // Lean left
    set(0, 30, 9); set(0, 31, 9);
    set(1, 29, 8); set(1, 30, 9); set(1, 31, 9); set(1, 32, 8);
    fill(2, 28, 2, 33, 8);
    set(2, 29, 9); set(2, 30, 9); set(2, 31, 9); set(2, 32, 9);
    fill(3, 27, 3, 34, 8);
    set(3, 28, 9); set(3, 29, 9); set(3, 30, 9); set(3, 31, 9); set(3, 32, 9);
    fill(4, 27, 4, 36, 8);
    set(4, 28, 9); set(4, 29, 9); set(4, 30, 9); set(4, 31, 9); set(4, 32, 9);
  } else {
    // Lean right
    set(0, 32, 9); set(0, 33, 9);
    set(1, 31, 8); set(1, 32, 9); set(1, 33, 9); set(1, 34, 8);
    fill(2, 30, 2, 35, 8);
    set(2, 31, 9); set(2, 32, 9); set(2, 33, 9); set(2, 34, 9);
    fill(3, 29, 3, 36, 8);
    set(3, 31, 9); set(3, 32, 9); set(3, 33, 9); set(3, 34, 9); set(3, 35, 9);
    fill(4, 27, 4, 36, 8);
    set(4, 31, 9); set(4, 32, 9); set(4, 33, 9); set(4, 34, 9); set(4, 35, 9);
  }

  // ── PEDESTAL ──
  const pedExtent = (r) => {
    if (r === 116) return 0;
    if (r <= 118) return 1;
    if (r <= 120) return 2;
    if (r <= 122) return 3;
    if (r <= 124) return 4;
    return 5;
  };
  for (let r = 116; r <= 127; r++) {
    const ext = pedExtent(r);
    const lLeft = Math.max(0, 4 - ext);
    const lRight = 16;
    for (let c = lLeft; c <= lRight; c++) {
      if (c === lLeft || c === lRight) set(r, c, 2);
      else set(r, c, 3);
    }
    const rLeft = 47;
    const rRight = Math.min(W - 1, 59 + ext);
    for (let c = rLeft; c <= rRight; c++) {
      if (c === rLeft || c === rRight) set(r, c, 2);
      else set(r, c, 3);
    }
  }
  fill(116, 5, 116, 15, 4);
  fill(116, 48, 116, 58, 4);

  // ── GOLD POOL (static base) ──
  fill(120, 22, 121, 41, 8);
  fill(122, 20, 123, 43, 8);
  fill(124, 19, 127, 44, 8);
  set(122,19,4); set(122,44,4); set(124,19,4); set(124,44,4);

  // ── ANIMATED RIPPLES across the pool ──
  // Two waves of cream highlights traveling left to right
  for (let w = 0; w < 2; w++) {
    // 36*2 = 72, 72 % 24 = 0 → seamless. Two staggered waves (w*12) span the pool.
    const wavePos = ((frame * 2 + w * 12) % 24) - 2;
    for (let dx = 0; dx < 3; dx++) {
      const x = 19 + wavePos + dx;
      if (x >= 19 && x <= 44) {
        set(125, x, 9);
        if (dx === 1) set(126, x, 9);
      }
    }
  }
  // Sparse static glints (always there)
  set(127, 28, 9); set(127, 35, 9);

  // ── ANIMATED GOLD DRIPS (falling drops) ──
  // Static base drips at pillar feet
  fill(116, 8, 117, 12, 8);
  fill(116, 51, 117, 55, 8);
  set(116,10,9); set(117,10,9);
  set(116,53,9); set(117,53,9);
  fill(118, 9, 118, 11, 8);
  fill(118, 52, 118, 54, 8);

  // Falling drops — gold pixels descend from pillar base into the pool
  // 36 % 9 = 0 → seamless. Drop visible at sub-frame 1..5 of each 9-frame cycle.
  const dropL = (frame % 9);
  if (dropL >= 1 && dropL <= 5) {
    set(118 + dropL, 10, 8);
    if (dropL >= 3) set(118 + dropL - 1, 10, 4);  // trail
  }
  const dropR = ((frame + 4) % 9);
  if (dropR >= 1 && dropR <= 5) {
    set(118 + dropR, 53, 8);
    if (dropR >= 3) set(118 + dropR - 1, 53, 4);
  }

  // ── ANIMATED RIM ENERGY (cream pulses traveling down both rims) ──
  for (let p = 0; p < 3; p++) {
    const offsetL = ((frame * 3) + p * 36) % 108;
    const yL = 14 + offsetL;
    if (yL >= 14 && yL <= 113) {
      set(yL, 17, 9);
      if (yL + 1 <= 115) set(yL + 1, 17, 8);
    }
    const offsetR = ((frame * 3) + p * 36 + 18) % 108;
    const yR = 14 + offsetR;
    if (yR >= 14 && yR <= 113) {
      set(yR, 46, 9);
      if (yR + 1 <= 115) set(yR + 1, 46, 8);
    }
  }

  // ── TWINKLING SPARKLES ──
  const sparkles = [
    [20,1,5],[21,2,5],[33,2,8],[45,1,6],
    [82,2,8],[83,3,8],[95,1,5],[105,2,6],
    [8,2,8],[13,1,6],[28,0,5],
    [25,61,6],[26,62,6],[40,62,8],[52,61,5],
    [75,60,5],[76,61,5],[90,62,8],[102,60,6],
    [8,61,5],[15,62,8],[35,63,6],
    [2,14,8],[3,22,6],[2,44,6],[3,50,8],[0,10,5],[0,53,5],
    [58,0,5],[72,0,8],[58,63,5],[72,63,8],
  ];
  for (const [r, c, v] of sparkles) {
    const phase = (frame + r * 7 + c * 11) % 12;
    if (phase < 8) {
      if (g[r][c] === 0) set(r, c, v);
    }
  }

  }  // ── end ARCH LAYER ──

  // ── COMPOSITE the 64x128 portal into the 192x256 canvas ──
  // The bigger canvas gives the magical particles room to travel before
  // hitting the edge. The portal is centred (64-px margin on each side).
  const BW = PORTAL_W, BH = PORTAL_H;
  const COL_OFF = (BW - W) >> 1;        // 64
  const ROW_OFF = (BH - H) >> 1;        // 64
  const big = Array.from({ length: BH }, () => Array(BW).fill(0));
  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const v = g[r][c];
      if (v !== 0) big[r + ROW_OFF][c + COL_OFF] = v;
    }
  }
  const setBig = (r, c, v) => {
    if (r >= 0 && r < BH && c >= 0 && c < BW) big[r][c] = v;
  };

  // ── MAGICAL DUST PARTICLES erupting from the vortex (top layer) ──
  // Each particle now has random life / distance / angle jitter so the
  // burst feels organic and particles die off at unpredictable points.
  // Speed is fixed at 1 so the loop stays seamless — the variation lives
  // in lifetime, distance, angle, and start offset.
  if (layers.dust) {
    const VCX = 32 + COL_OFF;
    const VCY = 65 + ROW_OFF;
    const NUM_PARTICLES = 32;
    const t = frame / TOTAL_FRAMES;
    const GOLDEN = 2.39996;
    const FORWARD = Math.PI / 2;
    const CONE = 0.85;
    const MAX_DIST = 105;
    const TAU = Math.PI * 2;

    // Cheap deterministic hash → [0, 1)
    const rng = (i, salt) => {
      const x = Math.sin(i * 12.9898 + salt * 78.233) * 43758.5453;
      return x - Math.floor(x);
    };

    const stamp = (cx, cy, sz, col) => {
      if (sz < 0) return;
      for (let dr = -sz; dr <= sz; dr++) {
        for (let dc = -sz; dc <= sz; dc++) {
          if (Math.abs(dr) + Math.abs(dc) <= sz) setBig(cy + dr, cx + dc, col);
        }
      }
    };

    for (let i = 0; i < NUM_PARTICLES; i++) {
      // Random per-particle properties (deterministic per index)
      const startOff   = rng(i, 1);                       // 0–1 random start
      const lifeFactor = 0.30 + rng(i, 2) * 0.70;         // 0.30–1.00 of loop
      const distMult   = 0.65 + rng(i, 3) * 0.75;         // 0.65–1.40
      const angleJit   = (rng(i, 4) - 0.5) * 0.6;         // ±0.30 rad

      // Particle is alive while rawPhase ∈ [0, lifeFactor]
      const rawPhase = (t + startOff) % 1;
      if (rawPhase > lifeFactor || rawPhase < 0.02) continue;
      const phase = rawPhase / lifeFactor;                // normalise 0–1

      // Direction: golden fan, forward-biased, with random jitter.
      // Time term is t*TAU (exactly one full rotation per loop) so the
      // burst lines up at t=0 and t=1 — keeps the loop seamless.
      const raw = (i * GOLDEN + t * TAU) % TAU;
      let off = raw - FORWARD;
      while (off >  Math.PI) off -= TAU;
      while (off < -Math.PI) off += TAU;
      const angle = FORWARD + off * CONE + angleJit;

      // Accelerating radial motion
      const dist = Math.pow(phase, 0.85) * MAX_DIST * distMult;
      const px = Math.round(VCX + Math.cos(angle) * dist);
      const py = Math.round(VCY + Math.sin(angle) * dist);

      let size;
      if      (phase < 0.16) size = 0;
      else if (phase < 0.36) size = 1;
      else if (phase < 0.62) size = 2;
      else if (phase < 0.86) size = 3;
      else                   size = 2;

      let color;
      if      (phase < 0.22) color = 6;
      else if (phase < 0.46) color = 9;
      else if (phase < 0.70) color = 8;
      else if (phase < 0.92) color = 5;
      else                   color = 4;

      // 3-stamp fading tail (gold → cyan → plum)
      const TRAIL_COLORS = [0, 8, 6, 3];
      for (let trail = 3; trail >= 1; trail--) {
        const tp = phase - trail * 0.022;
        if (tp < 0.02) continue;
        const td = Math.pow(tp, 0.85) * MAX_DIST * distMult;
        const tpx = Math.round(VCX + Math.cos(angle) * td);
        const tpy = Math.round(VCY + Math.sin(angle) * td);
        const tsz = Math.max(0, size - trail);
        stamp(tpx, tpy, tsz, TRAIL_COLORS[trail]);
      }

      // Particle head on top of the trail
      stamp(px, py, size, color);
      if (size >= 2) setBig(py, px, 9);   // hot cream core
    }
  }

  return big;
}

// Shared mutable controls (read every frame by the render loop)
const controls = {
  paused: false, slow: false,
  arch:   true,  // doorway frame + closed bottom sill
  vortex: true,  // swirling spiral inside the opening
  dust:   true,  // magical particles erupting toward the camera
};

function Portal() {
  const canvasRef = useRef(null);
  const frameRef = useRef(0);
  const animRef = useRef(0);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const scale = 10;
    canvas.width  = PORTAL_W * scale;
    canvas.height = PORTAL_H * scale;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    let lastTime = 0;
    const renderFrame = (frame) => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const grid = buildGrid(frame, {
        arch:   controls.arch,
        vortex: controls.vortex,
        dust:   controls.dust,
      });
      for (let r = 0; r < PORTAL_H; r++) {
        for (let c = 0; c < PORTAL_W; c++) {
          const idx = grid[r][c];
          if (idx === 0) continue;
          ctx.fillStyle = PALETTE[idx];
          ctx.fillRect(c * scale, r * scale, scale, scale);
        }
      }
    };

    const tick = (now) => {
      const interval = controls.slow ? 125 : (1000 / 24);
      if (!controls.paused && now - lastTime >= interval) {
        renderFrame(frameRef.current);
        frameRef.current = (frameRef.current + 1) % TOTAL_FRAMES;
        lastTime = now;
      }
      animRef.current = requestAnimationFrame(tick);
    };
    renderFrame(frameRef.current);
    animRef.current = requestAnimationFrame(tick);

    return () => cancelAnimationFrame(animRef.current);
  }, []);

  return (
    <canvas ref={canvasRef} aria-label="animated magical portal" />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Portal />);

document.getElementById('pause').onclick = (e) => {
  controls.paused = !controls.paused;
  e.target.setAttribute('aria-pressed', String(controls.paused));
  e.target.textContent = controls.paused ? 'Resume' : 'Pause';
};
document.getElementById('slow').onclick = (e) => {
  controls.slow = !controls.slow;
  e.target.setAttribute('aria-pressed', String(controls.slow));
  e.target.textContent = controls.slow ? 'Normal' : 'Slower';
};

// Layer-visibility toggles
const layerToggle = (id, key) => {
  document.getElementById(id).onclick = (e) => {
    controls[key] = !controls[key];
    e.target.setAttribute('aria-pressed', String(controls[key]));
  };
};
layerToggle('lArch',   'arch');
layerToggle('lVortex', 'vortex');
layerToggle('lDust',   'dust');
</script>
</body>
