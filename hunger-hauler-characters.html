<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hunger Hauler — Mystical Flyers (profile)</title>
<style>
  html,body{margin:0;height:100%;background:#20141f;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{box-shadow:0 20px 60px rgba(0,0,0,.5);border-radius:22px;}
</style>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  const W=390,H=844, DPR=2;
  const cv=document.getElementById('c'); const ctx=cv.getContext('2d');
  cv.width=W*DPR; cv.height=H*DPR; ctx.scale(DPR,DPR);
  function fit(){ const s=Math.min(innerWidth/W,innerHeight/H); cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px'; }
  addEventListener('resize',fit); fit();
  const INK='#3a2233';
  const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();};
  const circle=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.closePath();};
  const ell=(x,y,rx,ry,rot)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,7);ctx.closePath();};
  function outline(w){ ctx.lineJoin='round'; ctx.lineCap='round'; ctx.lineWidth=w||4; ctx.strokeStyle=INK; }
  // single profile eye (facing right), pupil looks forward
  function eye1(x,y,r){ ctx.fillStyle='#fff'; circle(x,y,r); ctx.fill(); outline(2.4); ctx.stroke();
    ctx.fillStyle=INK; circle(x+r*0.35,y+r*0.1,r*0.55); ctx.fill();
    ctx.fillStyle='#fff'; circle(x+r*0.2,y-r*0.15,r*0.22); ctx.fill(); }
  function cheek1(x,y,r){ ctx.fillStyle='rgba(255,120,150,0.5)'; circle(x,y,r); ctx.fill(); }
  function aura(x,y,r,col){ ctx.save(); ctx.globalAlpha=0.42; ctx.fillStyle=col; ctx.filter='blur(9px)'; circle(x,y,r); ctx.fill(); ctx.restore(); }
  function sparkle(x,y,s,col){ ctx.save(); ctx.fillStyle=col||'#fff'; ctx.translate(x,y); ctx.beginPath();
    for(let i=0;i<4;i++){ const a=i*Math.PI/2; ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s); ctx.lineTo(Math.cos(a+0.785)*s*0.34,Math.sin(a+0.785)*s*0.34);} ctx.closePath(); ctx.fill(); ctx.restore(); }
  // wing rising UP and sweeping BACK (left), for a right-facing flyer
  function membraneWingUp(rx,ry,sc,col,hi,back){ ctx.save(); ctx.translate(rx,ry); ctx.scale(sc,sc);
    const g=ctx.createLinearGradient(0,-48,-20,4); g.addColorStop(0,hi); g.addColorStop(1,col); ctx.fillStyle=g; outline(back?3:4);
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.quadraticCurveTo(4,-42,-26,-50);
    ctx.quadraticCurveTo(-14,-34,-20,-27);
    ctx.quadraticCurveTo(-8,-22,-13,-13);
    ctx.quadraticCurveTo(-3,-9,0,0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='rgba(58,34,51,0.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,-1); ctx.lineTo(-23,-46); ctx.moveTo(0,-2); ctx.lineTo(-17,-25); ctx.moveTo(0,-3); ctx.lineTo(-11,-12); ctx.stroke(); ctx.restore(); }
  function feather(L,w,c1,c2){ const g=ctx.createLinearGradient(0,0,L,0); g.addColorStop(0,c1); g.addColorStop(1,c2);
    ctx.fillStyle=g; outline(2.3); ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(L*0.5,-w,L,0); ctx.quadraticCurveTo(L*0.5,w,0,0); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  function featherWingUp(rx,ry,sc,c1,c2,back){ ctx.save(); ctx.translate(rx,ry); ctx.scale(sc,sc);
    for(let i=0;i<4;i++){ ctx.save(); ctx.rotate(-2.5+i*0.34); feather(40-i*3,8,c1,c2); ctx.restore(); } ctx.restore(); }

  // =============================== DRAGON ===============================
  function dragon(){ ctx.save();
    aura(2,-2,42,'#bfe9c9');
    membraneWingUp(-4,-14,0.82,'#7a54c0','#a98adf',true);      // far wing (behind)
    // tail sweeping back-left with spade
    ctx.fillStyle='#5fc790'; outline(4);
    ctx.beginPath(); ctx.moveTo(-22,10); ctx.quadraticCurveTo(-52,12,-52,-10); ctx.quadraticCurveTo(-44,4,-22,2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#ff7ac0'; outline(3); ctx.beginPath(); ctx.moveTo(-52,-10); ctx.lineTo(-63,-16); ctx.lineTo(-56,-6); ctx.lineTo(-64,-1); ctx.lineTo(-50,2); ctx.closePath(); ctx.fill(); ctx.stroke();
    // body + head (one silhouette facing right), slight nose-up tilt
    ctx.save(); ctx.rotate(-0.08);
    const g=ctx.createLinearGradient(0,-26,0,28); g.addColorStop(0,'#8fe0a8'); g.addColorStop(0.6,'#6dcf9a'); g.addColorStop(1,'#49b880');
    ctx.fillStyle=g; outline(4.5);
    ctx.beginPath();
    ctx.moveTo(-26,-8);
    ctx.quadraticCurveTo(-30,-26,-6,-26);        // back hump
    ctx.quadraticCurveTo(14,-27,24,-18);          // toward head top
    ctx.quadraticCurveTo(34,-12,34,-4);           // snout top
    ctx.quadraticCurveTo(30,2,22,2);              // snout front (mouth opens here)
    ctx.quadraticCurveTo(24,10,16,16);            // jaw/chin
    ctx.quadraticCurveTo(0,26,-16,22);            // belly
    ctx.quadraticCurveTo(-28,16,-26,-8);          // back to start
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // cream belly
    ctx.fillStyle='#fff4de'; ell(-6,12,16,9,-0.15); ctx.fill();
    // open mouth (lower jaw) at the snout front
    ctx.fillStyle='#7d1330'; ctx.beginPath(); ctx.moveTo(22,2); ctx.quadraticCurveTo(34,4,33,12); ctx.quadraticCurveTo(26,12,20,8); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ff6f91'; ctx.beginPath(); ctx.moveTo(23,6); ctx.quadraticCurveTo(31,7,30,11); ctx.quadraticCurveTo(26,11,22,9); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(30,2); ctx.lineTo(32,7); ctx.lineTo(27,4); ctx.closePath(); ctx.fill(); // fang
    // horns swept back
    ctx.fillStyle='#fff4de'; outline(3);
    ctx.beginPath(); ctx.moveTo(2,-24); ctx.quadraticCurveTo(-8,-40,-14,-36); ctx.quadraticCurveTo(-6,-28,-4,-22); ctx.closePath(); ctx.fill(); ctx.stroke();
    // spine spikes
    ctx.fillStyle='#ff7ac0'; outline(2.3); for(const sx of[-16,-8,0]){ ctx.beginPath(); ctx.moveTo(sx,-24); ctx.lineTo(sx+4,-33); ctx.lineTo(sx+8,-23); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    // nostril + eye + cheek
    ctx.fillStyle=INK; circle(30,-2,1.5); ctx.fill();
    eye1(16,-8,8); cheek1(14,4,6);
    ctx.restore();
    membraneWingUp(0,-12,1.06,'#9b6fe0','#c9a0ff',false);      // near wing (front, big)
    sparkle(-30,-24,4,'#fff'); sparkle(30,-22,3,'#fff');
    ctx.restore(); }

  // =============================== PHOENIX ===============================
  function phoenix(){ ctx.save(); aura(0,0,44,'#ffb03c');
    featherWingUp(-4,-12,0.8,'#ff4d3d','#ffcf4a',true);
    // flame tail streaming back-left
    for(const d of[-0.5,0,0.5]){ ctx.save(); ctx.translate(-22,6); ctx.rotate(d*0.4);
      const g=ctx.createLinearGradient(0,0,-34,0); g.addColorStop(0,'#ff7a2c'); g.addColorStop(1,'#ffe14d');
      ctx.fillStyle=g; outline(3); ctx.beginPath(); ctx.moveTo(0,-6); ctx.quadraticCurveTo(-28,-3,-36,0); ctx.quadraticCurveTo(-28,3,0,6); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
    // body facing right
    const g=ctx.createLinearGradient(0,-26,0,26); g.addColorStop(0,'#ff9a3c'); g.addColorStop(1,'#ff5a2c');
    ctx.fillStyle=g; outline(4.5); ell(0,2,26,24); ctx.fill(); ctx.stroke();
    // head bump + beak open to right
    ctx.fillStyle='#ff8a34'; outline(4.5); circle(16,-8,15); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#ffb43c'; outline(3);
    ctx.beginPath(); ctx.moveTo(28,-8); ctx.lineTo(42,-11); ctx.lineTo(29,-4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(28,-4); ctx.lineTo(40,-1); ctx.lineTo(28,2); ctx.closePath(); ctx.fill(); ctx.stroke();
    // flame crest swept back
    ctx.fillStyle='#ffd24a'; outline(3); for(const dx of[6,-1,-8]){ ctx.beginPath(); ctx.moveTo(dx+8,-20); ctx.quadraticCurveTo(dx-2,-40,dx-8,-22); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    eye1(18,-9,7.5); cheek1(20,0,5);
    sparkle(-26,-18,4,'#fff3b0'); sparkle(26,16,3,'#fff3b0');
    ctx.restore(); }

  // =============================== ALICORN ===============================
  function alicorn(){ ctx.save(); aura(0,0,44,'#ffd0f0');
    featherWingUp(-2,-12,0.8,'#e9d8ff','#ffffff',true);
    // tail (rainbow) back-left
    const mane=['#ff6f91','#ffb454','#ffe14d','#8affc0','#7ce0ff','#c9a0ff'];
    ctx.save(); ctx.translate(-24,4); for(let i=0;i<mane.length;i++){ ctx.strokeStyle=mane[i]; ctx.lineWidth=4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(0,-8+i*3); ctx.quadraticCurveTo(-20,-6+i*3,-26,6+i*2); ctx.stroke(); } ctx.restore();
    // body
    const g=ctx.createLinearGradient(0,-26,0,26); g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#efe4ff');
    ctx.fillStyle=g; outline(4.5); ell(-2,2,26,23); ctx.fill(); ctx.stroke();
    // neck + head to right
    ctx.fillStyle='#f6efff'; outline(4.5); ctx.beginPath(); ctx.moveTo(8,-6); ctx.quadraticCurveTo(20,-22,32,-16); ctx.quadraticCurveTo(40,-12,36,-2); ctx.quadraticCurveTo(30,6,20,6); ctx.quadraticCurveTo(10,6,8,-6); ctx.closePath(); ctx.fill(); ctx.stroke();
    // muzzle nostril + mouth
    ctx.fillStyle='#e2c8f5'; circle(34,-6,2); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(30,2); ctx.lineTo(36,2); ctx.stroke();
    // ears back
    ctx.fillStyle='#efe4ff'; outline(3); ctx.beginPath(); ctx.moveTo(14,-16); ctx.lineTo(10,-30); ctx.lineTo(20,-20); ctx.closePath(); ctx.fill(); ctx.stroke();
    // spiral gold horn up-forward
    ctx.strokeStyle=INK; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(24,-16); ctx.lineTo(30,-38); ctx.stroke();
    ctx.strokeStyle='#ffd85a'; ctx.lineWidth=3.2; ctx.beginPath(); ctx.moveTo(24,-16); ctx.lineTo(30,-38); ctx.stroke();
    // rainbow forelock/mane along neck
    ctx.save(); for(let i=0;i<mane.length;i++){ ctx.strokeStyle=mane[i]; ctx.lineWidth=3.4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(10+i*2.2,-14); ctx.quadraticCurveTo(6+i*2.2,-2,12+i*2.2,6); ctx.stroke(); } ctx.restore();
    eye1(24,-6,7); cheek1(26,2,5);
    sparkle(30,-38,4,'#fff'); sparkle(-22,-14,3,'#fff');
    ctx.restore(); }

  // =============================== FAIRY ===============================
  function fairy(){ ctx.save(); aura(0,0,40,'#ffd6f5');
    // butterfly wings on back (up + down pair)
    for(const dy of[-1,1]){ const g=ctx.createLinearGradient(-6,-18*dy,-32,10*dy); g.addColorStop(0,'#ffc4ec'); g.addColorStop(1,'#9be3ff');
      ctx.fillStyle=g; outline(3); ctx.globalAlpha=0.92; ell(-18,-4+dy*13,15*(dy<0?1:0.8),12,dy*0.5); ctx.fill(); ctx.stroke(); ctx.globalAlpha=1; }
    ctx.fillStyle='rgba(255,255,255,0.6)'; circle(-20,-16,3); ctx.fill(); circle(-19,11,2.4); ctx.fill();
    // little dress body facing right
    ctx.fillStyle='#ff9ecf'; outline(4); ctx.beginPath(); ctx.moveTo(-4,2); ctx.lineTo(8,4); ctx.lineTo(12,24); ctx.lineTo(-8,22); ctx.closePath(); ctx.fill(); ctx.stroke();
    // leg
    ctx.strokeStyle='#ffe1c4'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(4,22); ctx.lineTo(8,30); ctx.stroke();
    // head (facing right)
    ctx.fillStyle='#ffe1c4'; outline(4); circle(6,-10,15); ctx.fill(); ctx.stroke();
    // hair (bun back + fringe)
    ctx.fillStyle='#ffcf6b'; outline(3); ctx.beginPath(); ctx.arc(4,-10,15,Math.PI*0.55,Math.PI*1.75); ctx.closePath(); ctx.fill(); ctx.stroke();
    circle(-8,-8,7); ctx.fill(); ctx.stroke();
    // nose hint + smile
    ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(20,-8); ctx.lineTo(23,-6); ctx.lineTo(20,-4); ctx.stroke();
    ctx.beginPath(); ctx.arc(17,-4,3.5,0,Math.PI*0.9); ctx.stroke();
    eye1(13,-11,6.5); cheek1(16,-4,4.5);
    // flower on hair
    ctx.fillStyle='#ff6f91'; for(let i=0;i<5;i++){ const a=i*1.256; circle(2+Math.cos(a)*3.4,-20+Math.sin(a)*3.4,2.2); ctx.fill(); } ctx.fillStyle='#ffe14d'; circle(2,-20,1.6); ctx.fill();
    sparkle(-22,-18,4,'#fff'); sparkle(26,-10,3,'#fff'); sparkle(14,24,3,'#fff');
    ctx.restore(); }

  // =============================== GRIFFIN ===============================
  function griffin(){ ctx.save();
    featherWingUp(-2,-12,0.86,'#b9752f','#eebb63',true);
    // lion tail back-left with tuft
    ctx.strokeStyle='#cf9636'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(-20,8); ctx.quadraticCurveTo(-44,10,-42,-6); ctx.stroke();
    ctx.fillStyle='#8a5a2a'; outline(3); circle(-42,-6,6); ctx.fill(); ctx.stroke();
    // lion body
    const g=ctx.createLinearGradient(0,-22,0,28); g.addColorStop(0,'#e6b45c'); g.addColorStop(1,'#cf9636');
    ctx.fillStyle=g; outline(4.5); ell(-4,4,26,22); ctx.fill(); ctx.stroke();
    // haunch + paw
    ctx.fillStyle='#cf9636'; outline(3.5); circle(-10,16,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#e6b45c'; outline(3); rr(6,18,10,10,4); ctx.fill(); ctx.stroke();
    // eagle head/neck (white) to right
    ctx.fillStyle='#fbf3e0'; outline(4.5); ctx.beginPath(); ctx.moveTo(6,-4); ctx.quadraticCurveTo(16,-24,30,-18); ctx.quadraticCurveTo(40,-13,34,-2); ctx.quadraticCurveTo(26,6,16,6); ctx.quadraticCurveTo(6,6,6,-4); ctx.closePath(); ctx.fill(); ctx.stroke();
    // beak open to right
    ctx.fillStyle='#ffb43c'; outline(3); ctx.beginPath(); ctx.moveTo(30,-6); ctx.lineTo(44,-8); ctx.quadraticCurveTo(46,-2,38,-1); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(31,-1); ctx.lineTo(41,1); ctx.lineTo(31,4); ctx.closePath(); ctx.fill(); ctx.stroke();
    // ear tuft back
    ctx.fillStyle='#fbf3e0'; outline(3); ctx.beginPath(); ctx.moveTo(16,-18); ctx.lineTo(12,-32); ctx.lineTo(22,-20); ctx.closePath(); ctx.fill(); ctx.stroke();
    eye1(24,-8,7); cheek1(26,0,5);
    ctx.restore(); }

  // =============================== LIL IMP ===============================
  function imp(){ ctx.save();
    membraneWingUp(-4,-12,0.8,'#8a2340','#d24a6a',true);
    // arrow tail back-left
    ctx.strokeStyle='#ff5a7a'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-16,10); ctx.quadraticCurveTo(-40,14,-40,-6); ctx.stroke();
    ctx.fillStyle='#ff5a7a'; outline(3); ctx.beginPath(); ctx.moveTo(-40,-6); ctx.lineTo(-50,-14); ctx.lineTo(-46,-4); ctx.lineTo(-52,0); ctx.lineTo(-38,2); ctx.closePath(); ctx.fill(); ctx.stroke();
    // body facing right
    const g=ctx.createLinearGradient(0,-24,0,26); g.addColorStop(0,'#ff7a92'); g.addColorStop(1,'#ff466e');
    ctx.fillStyle=g; outline(4.5); ell(-2,2,26,24); ctx.fill(); ctx.stroke();
    // head bump
    ctx.fillStyle='#ff5f7e'; outline(4.5); circle(15,-8,15); ctx.fill(); ctx.stroke();
    // horns swept back
    ctx.fillStyle='#3a2233'; outline(3.5); ctx.beginPath(); ctx.moveTo(8,-20); ctx.quadraticCurveTo(-2,-38,-8,-34); ctx.quadraticCurveTo(0,-26,4,-18); ctx.closePath(); ctx.fill(); ctx.stroke();
    // grin + fang to right
    ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(18,-4,9,-0.15*Math.PI,0.55*Math.PI); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(24,-1); ctx.lineTo(26,6); ctx.lineTo(28,-1); ctx.closePath(); ctx.fill();
    eye1(18,-10,7.5); cheek1(21,-1,5.5);
    ctx.restore(); }

  // ---------- board ----------
  function bg(){ const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#ffd97a'); g.addColorStop(0.45,'#ff9e7d'); g.addColorStop(0.75,'#ff6f91'); g.addColorStop(1,'#a56ad6'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
  function label(txt,x,y,star){ ctx.save(); ctx.textAlign='center'; ctx.font='900 17px "Trebuchet MS",sans-serif'; ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.fillStyle='#fff';
    ctx.strokeText(txt,x,y); ctx.fillText(txt,x,y);
    if(star){ ctx.font='900 12px "Trebuchet MS",sans-serif'; ctx.fillStyle='#ffe14d'; ctx.strokeText('★ YOUR PICK',x,y+17); ctx.fillText('★ YOUR PICK',x,y+17); } ctx.restore(); }
  function title(){ ctx.save(); ctx.textAlign='center'; ctx.font='900 27px "Trebuchet MS",sans-serif'; ctx.lineWidth=6; ctx.strokeStyle=INK; ctx.fillStyle='#fff';
    ctx.strokeText('PICK YOUR FLYER',W/2,50); ctx.fillText('PICK YOUR FLYER',W/2,50);
    ctx.font='900 13px "Trebuchet MS",sans-serif'; ctx.fillStyle='#3a2233'; ctx.fillText('profile view · flies right · devours the snacks',W/2,71); ctx.restore(); }
  function cell(fn,cx,cy,name,star){ ctx.save(); ctx.translate(cx,cy); fn(); ctx.restore(); label(name,cx,cy+62,star); }

  bg(); title();
  const cxL=W*0.29, cxR=W*0.73; const r1=175, r2=390, r3=605;
  cell(dragon,  cxL, r1, 'DRAGON', true);
  cell(phoenix, cxR, r1, 'PHOENIX');
  cell(alicorn, cxL, r2, 'ALICORN');
  cell(fairy,   cxR, r2, 'FAIRY');
  cell(griffin, cxL, r3, 'GRIFFIN');
  cell(imp,     cxR, r3, 'LIL IMP');
  ctx.save(); ctx.textAlign='center'; ctx.font='900 14px "Trebuchet MS",sans-serif'; ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.fillStyle='#fff';
  ctx.strokeText('all facing right — the way they fly in-game',W/2,762); ctx.fillText('all facing right — the way they fly in-game',W/2,762); ctx.restore();
})();
</script>
