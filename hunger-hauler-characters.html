<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hunger Hauler — Character Options</title>
<style>
  html,body{margin:0;height:100%;background:#20141f;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{box-shadow:0 20px 60px rgba(0,0,0,.5);border-radius:22px;}
</style>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  const W=390,H=844, DPR=2;
  const cv=document.getElementById('c'); const ctx=cv.getContext('2d');
  cv.width=W*DPR; cv.height=H*DPR; ctx.scale(DPR,DPR);
  function fit(){ const s=Math.min(innerWidth/W,innerHeight/H); cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px'; }
  addEventListener('resize',fit); fit();
  const INK='#3a2233';
  const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();};
  const circle=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.closePath();};
  function outline(w){ ctx.lineJoin='round'; ctx.lineCap='round'; ctx.lineWidth=w||4; ctx.strokeStyle=INK; }
  // cute eyes (two), looking up-forward
  function eyes(dx,ey,er,gap,lookx,looky){
    for(const s of [-1,1]){ const ex=dx+s*gap;
      ctx.fillStyle='#fff'; circle(ex,ey,er); ctx.fill(); outline(2.4); ctx.stroke();
      ctx.fillStyle=INK; circle(ex+lookx,ey+looky,er*0.52); ctx.fill();
      ctx.fillStyle='#fff'; circle(ex+lookx-er*0.18,ey+looky-er*0.22,er*0.2); ctx.fill();
    }
  }
  function cheeks(dx,cy,gap,r){ ctx.fillStyle='rgba(255,120,150,0.55)';
    for(const s of[-1,1]){ circle(dx+s*gap,cy,r); ctx.fill(); } }

  // ---------- DRAGON (the hero candidate) ----------
  function dragon(){
    ctx.save();
    // ---- WINGS (behind), mid-flap: one raised, one spread ----
    const wing=(sx,rot)=>{ ctx.save(); ctx.translate(sx*22,-6); ctx.rotate(rot*sx);
      const g=ctx.createLinearGradient(0,-40,0,10); g.addColorStop(0,'#ffb0dc'); g.addColorStop(1,'#ff7ac0');
      ctx.fillStyle=g; outline(4);
      ctx.beginPath(); ctx.moveTo(0,2);
      ctx.quadraticCurveTo(sx*10,-40,sx*44,-34);
      ctx.quadraticCurveTo(sx*30,-20,sx*40,-12);
      ctx.quadraticCurveTo(sx*26,-6,sx*34,4);
      ctx.quadraticCurveTo(sx*20,2,0,10); ctx.closePath(); ctx.fill(); ctx.stroke();
      // membrane ribs
      ctx.strokeStyle='rgba(58,34,51,0.4)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,2); ctx.lineTo(sx*40,-30); ctx.moveTo(0,4); ctx.lineTo(sx*36,-9); ctx.stroke();
      ctx.restore(); };
    wing(-1,0.5); wing(1,0.5);
    // ---- TAIL with spade tip ----
    ctx.save();
    ctx.fillStyle='#6dcf9a'; outline(4);
    ctx.beginPath(); ctx.moveTo(6,26); ctx.quadraticCurveTo(40,44,44,20);
    ctx.quadraticCurveTo(40,30,24,24); ctx.quadraticCurveTo(14,20,6,26); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#ff7ac0'; outline(3);
    ctx.beginPath(); ctx.moveTo(44,20); ctx.lineTo(56,10); ctx.lineTo(52,22); ctx.lineTo(58,26); ctx.lineTo(44,26); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    // ---- BODY (chubby egg) ----
    const bg=ctx.createLinearGradient(0,-34,0,34); bg.addColorStop(0,'#8fe0a8'); bg.addColorStop(0.6,'#6dcf9a'); bg.addColorStop(1,'#49b880');
    ctx.fillStyle=bg; outline(4.5); rr(-30,-30,60,62,26); ctx.fill(); ctx.stroke();
    // cream belly + ridges
    ctx.fillStyle='#fff4de'; ctx.beginPath(); ctx.ellipse(0,10,20,20,0,0,7); ctx.fill();
    ctx.strokeStyle='rgba(58,34,51,0.28)'; ctx.lineWidth=2;
    for(let i=-1;i<2;i++){ ctx.beginPath(); ctx.moveTo(-13,4+i*8); ctx.lineTo(13,4+i*8); ctx.stroke(); }
    // ---- little horns + head spikes ----
    ctx.fillStyle='#fff4de'; outline(3);
    for(const s of[-1,1]){ ctx.beginPath(); ctx.moveTo(s*10,-30); ctx.lineTo(s*15,-44); ctx.lineTo(s*18,-29); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle='#ff7ac0'; outline(2.6);
    for(let i=-1;i<2;i++){ ctx.beginPath(); ctx.moveTo(i*9,-30); ctx.lineTo(i*9+4,-40); ctx.lineTo(i*9+8,-30); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    // ---- face ----
    eyes(0,-8,9,12,1.5,-1.5);
    cheeks(0,4,20,6);
    // snout / happy open mouth (eating)
    ctx.fillStyle='#3a2233'; ctx.beginPath(); ctx.ellipse(0,10,10,7,0,0,Math.PI); ctx.fill();
    ctx.fillStyle='#ff6f91'; ctx.beginPath(); ctx.ellipse(0,11,7,4,0,0,Math.PI); ctx.fill();
    ctx.fillStyle='#fff'; // little fang
    ctx.beginPath(); ctx.moveTo(-5,8); ctx.lineTo(-3,13); ctx.lineTo(-7,10); ctx.closePath(); ctx.fill();
    // nostrils
    ctx.fillStyle=INK; circle(-4,2,1.4); ctx.fill(); circle(4,2,1.4); ctx.fill();
    ctx.restore();
  }

  // ---------- CHICK / BIRD ----------
  function chick(){
    ctx.save();
    // wings
    ctx.fillStyle='#ffd45a'; outline(4);
    for(const s of[-1,1]){ ctx.save(); ctx.translate(s*26,0); ctx.rotate(s*0.4);
      ctx.beginPath(); ctx.ellipse(0,0,10,20,0,0,7); ctx.fill(); ctx.stroke(); ctx.restore(); }
    // body
    const g=ctx.createLinearGradient(0,-30,0,30); g.addColorStop(0,'#ffe27a'); g.addColorStop(1,'#ffbe3d');
    ctx.fillStyle=g; outline(4.5); circle(0,2,30); ctx.fill(); ctx.stroke();
    // tuft
    ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,-28); ctx.lineTo(-4,-40); ctx.moveTo(0,-28); ctx.lineTo(6,-40); ctx.stroke();
    ctx.fillStyle='#ffbe3d'; circle(-4,-41,3); ctx.fill(); circle(6,-41,3); ctx.fill();
    // beak (open)
    ctx.fillStyle='#ff9a3c'; outline(3);
    ctx.beginPath(); ctx.moveTo(-8,10); ctx.lineTo(-18,6); ctx.lineTo(-8,4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8,10); ctx.lineTo(-16,14); ctx.lineTo(-8,15); ctx.closePath(); ctx.fill(); ctx.stroke();
    // feet
    ctx.strokeStyle='#ff9a3c'; ctx.lineWidth=3; for(const s of[-1,1]){ ctx.beginPath(); ctx.moveTo(s*8,30); ctx.lineTo(s*8,38); ctx.stroke(); }
    eyes(2,-4,8,11,-1.5,0.5); cheeks(2,8,18,5.5);
    ctx.restore();
  }

  // ---------- BEE ----------
  function bee(){
    ctx.save();
    // wings (translucent)
    ctx.fillStyle='rgba(200,240,255,0.7)'; outline(3); ctx.strokeStyle='rgba(58,34,51,0.6)';
    for(const s of[-1,1]){ ctx.save(); ctx.translate(s*10,-24); ctx.rotate(s*0.5);
      ctx.beginPath(); ctx.ellipse(0,0,12,20,0,0,7); ctx.fill(); ctx.stroke(); ctx.restore(); }
    // body (striped)
    const g=ctx.createLinearGradient(0,-26,0,26); g.addColorStop(0,'#ffd94a'); g.addColorStop(1,'#f5b820');
    ctx.fillStyle=g; outline(4.5); ctx.beginPath(); ctx.ellipse(0,4,28,26,0,0,7); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.ellipse(0,4,28,26,0,0,7); ctx.clip();
    ctx.fillStyle=INK; for(const bx of [ -6,10 ]){ rr(bx,-24,9,56,0); ctx.fill(); }
    ctx.restore();
    // stinger
    ctx.fillStyle=INK; ctx.beginPath(); ctx.moveTo(26,10); ctx.lineTo(38,14); ctx.lineTo(26,18); ctx.closePath(); ctx.fill();
    // antennae
    ctx.strokeStyle=INK; ctx.lineWidth=2.5; for(const s of[-1,1]){ ctx.beginPath(); ctx.moveTo(s*6,-22); ctx.quadraticCurveTo(s*12,-34,s*16,-32); ctx.stroke(); ctx.fillStyle=INK; circle(s*16,-32,3); ctx.fill(); }
    eyes(-2,-2,8,11,-1,1); cheeks(-2,10,17,5.5);
    // smile
    ctx.strokeStyle=INK; ctx.lineWidth=2.6; ctx.beginPath(); ctx.arc(-2,8,6,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    ctx.restore();
  }

  // ---------- BAT ----------
  function bat(){
    ctx.save();
    // wings
    ctx.fillStyle='#8a6fd0'; outline(4);
    const bwing=(s)=>{ ctx.save(); ctx.translate(s*24,-4); ctx.beginPath(); ctx.moveTo(0,0);
      ctx.quadraticCurveTo(s*20,-24,s*50,-14); ctx.quadraticCurveTo(s*34,-8,s*44,2);
      ctx.quadraticCurveTo(s*30,-2,s*38,12); ctx.quadraticCurveTo(s*22,6,0,14); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); };
    bwing(-1); bwing(1);
    // body
    const g=ctx.createLinearGradient(0,-28,0,28); g.addColorStop(0,'#a98fe6'); g.addColorStop(1,'#7d5fc8');
    ctx.fillStyle=g; outline(4.5); rr(-26,-24,52,52,22); ctx.fill(); ctx.stroke();
    // ears
    ctx.fillStyle='#8a6fd0'; outline(3.5);
    for(const s of[-1,1]){ ctx.beginPath(); ctx.moveTo(s*8,-22); ctx.lineTo(s*16,-40); ctx.lineTo(s*22,-20); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#ff9ecf'; ctx.beginPath(); ctx.moveTo(s*11,-22); ctx.lineTo(s*15,-33); ctx.lineTo(s*18,-22); ctx.closePath(); ctx.fill(); ctx.fillStyle='#8a6fd0'; }
    eyes(0,-4,8.5,11,1.5,0.5); cheeks(0,7,18,5.5);
    // fangs + smile
    ctx.strokeStyle=INK; ctx.lineWidth=2.4; ctx.beginPath(); ctx.arc(0,7,6,0.1*Math.PI,0.9*Math.PI); ctx.stroke();
    ctx.fillStyle='#fff'; for(const s of[-1,1]){ ctx.beginPath(); ctx.moveTo(s*3,9); ctx.lineTo(s*5,14); ctx.lineTo(s*6,9); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }

  // ---------- FLYING PIG ----------
  function pig(){
    ctx.save();
    // wings (feathery white)
    ctx.fillStyle='#fff6fb'; outline(4);
    for(const s of[-1,1]){ ctx.save(); ctx.translate(s*24,-8); ctx.rotate(s*0.3);
      for(let i=0;i<3;i++){ ctx.beginPath(); ctx.ellipse(s*i*7,-i*8,9,16,s*0.3,0,7); ctx.fill(); ctx.stroke(); } ctx.restore(); }
    // body
    const g=ctx.createLinearGradient(0,-28,0,28); g.addColorStop(0,'#ffc0d4'); g.addColorStop(1,'#ff92b4');
    ctx.fillStyle=g; outline(4.5); rr(-28,-26,56,54,24); ctx.fill(); ctx.stroke();
    // ears
    ctx.fillStyle='#ff92b4'; outline(3.5);
    for(const s of[-1,1]){ ctx.beginPath(); ctx.moveTo(s*10,-24); ctx.lineTo(s*20,-38); ctx.lineTo(s*24,-22); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    // snout
    ctx.fillStyle='#ffb0c8'; outline(3.5); ctx.beginPath(); ctx.ellipse(0,8,13,10,0,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle=INK; circle(-4,8,2.2); ctx.fill(); circle(4,8,2.2); ctx.fill();
    eyes(0,-6,8,11,0,1); cheeks(0,2,20,6);
    // curly tail
    ctx.strokeStyle='#ff92b4'; ctx.lineWidth=3.5; ctx.beginPath(); ctx.arc(30,14,6,Math.PI,2.4*Math.PI); ctx.stroke();
    ctx.restore();
  }

  // ---------- WINGED KITTEN ----------
  function kitten(){
    ctx.save();
    // angel wings
    ctx.fillStyle='#fffdf3'; outline(4);
    for(const s of[-1,1]){ ctx.save(); ctx.translate(s*22,-6); ctx.rotate(s*0.2);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(s*24,-22,s*40,-6);
      ctx.quadraticCurveTo(s*24,-4,s*32,10); ctx.quadraticCurveTo(s*16,4,0,12); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
    // body
    const g=ctx.createLinearGradient(0,-26,0,28); g.addColorStop(0,'#ffb27a'); g.addColorStop(1,'#ff9350');
    ctx.fillStyle=g; outline(4.5); rr(-26,-24,52,52,22); ctx.fill(); ctx.stroke();
    // ears
    ctx.fillStyle='#ff9350'; outline(3.5);
    for(const s of[-1,1]){ ctx.beginPath(); ctx.moveTo(s*8,-22); ctx.lineTo(s*17,-40); ctx.lineTo(s*24,-20); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#ffd0b0'; ctx.beginPath(); ctx.moveTo(s*12,-23); ctx.lineTo(s*16,-33); ctx.lineTo(s*19,-22); ctx.closePath(); ctx.fill(); ctx.fillStyle='#ff9350'; }
    // stripes
    ctx.strokeStyle='rgba(58,34,51,0.3)'; ctx.lineWidth=3; for(const s of[-1,1]){ ctx.beginPath(); ctx.moveTo(s*14,-16); ctx.lineTo(s*22,-14); ctx.moveTo(s*15,-8); ctx.lineTo(s*23,-6); ctx.stroke(); }
    eyes(0,-4,8.5,11,0,1); cheeks(0,8,18,5.5);
    // muzzle + whiskers
    ctx.fillStyle=INK; ctx.beginPath(); ctx.moveTo(-2,7); ctx.lineTo(2,7); ctx.lineTo(0,10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=2.2; ctx.beginPath(); ctx.arc(-4,11,4,0,Math.PI); ctx.arc(4,11,4,0,Math.PI); ctx.stroke();
    ctx.lineWidth=1.6; for(const s of[-1,1]){ ctx.beginPath(); ctx.moveTo(s*8,8); ctx.lineTo(s*22,5); ctx.moveTo(s*8,12); ctx.lineTo(s*22,12); ctx.stroke(); }
    ctx.restore();
  }

  // ---------- board ----------
  function bg(){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#ffd97a'); g.addColorStop(0.45,'#ff9e7d'); g.addColorStop(0.75,'#ff6f91'); g.addColorStop(1,'#a56ad6');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
  function label(txt,x,y,star){
    ctx.save(); ctx.textAlign='center'; ctx.font='900 17px "Trebuchet MS",sans-serif';
    ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.fillStyle='#fff';
    ctx.strokeText(txt,x,y); ctx.fillText(txt,x,y);
    if(star){ ctx.font='900 13px "Trebuchet MS",sans-serif'; ctx.fillStyle='#ffe14d';
      ctx.strokeText('★ YOUR PICK',x,y+18); ctx.fillText('★ YOUR PICK',x,y+18); }
    ctx.restore();
  }
  function title(){
    ctx.save(); ctx.textAlign='center';
    ctx.font='900 30px "Trebuchet MS",sans-serif'; ctx.lineWidth=6; ctx.strokeStyle=INK; ctx.fillStyle='#fff';
    ctx.strokeText('PICK YOUR FLYER',W/2,54); ctx.fillText('PICK YOUR FLYER',W/2,54);
    ctx.font='900 14px "Trebuchet MS",sans-serif'; ctx.fillStyle='#3a2233';
    ctx.fillText('tap to flap · chase the food',W/2,76);
    ctx.restore();
  }
  function cell(fn,cx,cy,name,star){ ctx.save(); ctx.translate(cx,cy); fn(); ctx.restore(); label(name,cx,cy+62,star); }

  bg(); title();
  const cxL=W*0.28, cxR=W*0.72;
  const r1=170, r2=380, r3=590, r4=765;
  cell(dragon, cxL, r1, 'DRAGON', true);
  cell(chick,  cxR, r1, 'CHICK');
  cell(bee,    cxL, r2, 'BEE');
  cell(bat,    cxR, r2, 'BAT');
  cell(pig,    cxL, r3, 'FLYING PIG');
  cell(kitten, cxR, r3, 'WINGED KITTEN');
  // footer
  ctx.save(); ctx.textAlign='center'; ctx.font='900 14px "Trebuchet MS",sans-serif';
  ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.fillStyle='#fff';
  ctx.strokeText('which one should devour the snacks?',W/2,r4+10); ctx.fillText('which one should devour the snacks?',W/2,r4+10);
  ctx.restore();
})();
</script>
