<!-- Wondrous Grid favicon — 32×32 pixel-art icon: 3×3 grid of brand-color
     cells on a dark background with a yellow highlight ring on the
     center "active" cell. Reads instantly as "pixel-art editor" at
     any size from 16×16 (browser tabs) up to 180×180 (iOS home screen). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Dark canvas background -->
  <rect width="32" height="32" rx="5" fill="#1a1a1c"/>
  <!-- Outer yellow frame -->
  <rect x="1" y="1" width="30" height="30" rx="4" fill="none" stroke="#ffd060" stroke-width="1.5"/>

  <!-- 3×3 grid of brand-color cells -->
  <rect x="5"  y="5"  width="6" height="6" fill="#3aa8b8"/>
  <rect x="13" y="5"  width="6" height="6" fill="#ffd060"/>
  <rect x="21" y="5"  width="6" height="6" fill="#c83828"/>

  <rect x="5"  y="13" width="6" height="6" fill="#5a9028"/>
  <rect x="13" y="13" width="6" height="6" fill="#ffffff"/>
  <rect x="21" y="13" width="6" height="6" fill="#7c4abe"/>

  <rect x="5"  y="21" width="6" height="6" fill="#e87028"/>
  <rect x="13" y="21" width="6" height="6" fill="#7ed4dc"/>
  <rect x="21" y="21" width="6" height="6" fill="#ffd060"/>

  <!-- Highlight ring around center "active" pixel -->
  <rect x="12" y="12" width="8" height="8" fill="none" stroke="#ffd060" stroke-width="1"/>
</svg>
