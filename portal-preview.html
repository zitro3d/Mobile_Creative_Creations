<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alien Portal — preview</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 38%, #241a33 0%, #120c1c 55%, #07050c 100%);
    font: 14px/1.5 system-ui, sans-serif; color: #cdbbe0;
    display: flex; flex-direction: column; align-items: center; min-height: 100%;
  }
  h1 { font-weight: 600; letter-spacing: .06em; margin: 22px 0 4px; color: #e9d7f5; }
  .sub { opacity: .6; margin: 0 0 14px; }
  .stage {
    position: relative; width: min(46vh, 92vw); aspect-ratio: 1280 / 2000;
    filter: drop-shadow(0 0 26px rgba(235,110,180,.28));
  }
  .stage img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated;
  }
  #fx { transition: opacity .25s; }
  .controls { display: flex; gap: 10px; margin: 18px 0 30px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #2a2040; color: #e9d7f5; border: 1px solid #5c406e;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit;
  }
  button[aria-pressed="true"] { background: #5c406e; border-color: #b86; }
  a { color: #ffaad7; }
</style>
</head>
<body>
  <h1>ALIEN PORTAL</h1>
  <p class="sub">vortex loop + emergence FX layer</p>

  <div class="stage" id="stage">
    <img id="portal" src="output/portal_loop.gif" alt="portal vortex loop">
    <img id="fx" src="output/portal_emerge.gif" alt="emergence sparkle/trail layer">
  </div>

  <div class="controls">
    <button id="toggleFx" aria-pressed="true">Emergence FX: ON</button>
    <button id="toggleBg" aria-pressed="false">Background: dark</button>
    <button id="resync">Resync loops</button>
  </div>

<script>
  const fx = document.getElementById('fx');
  const stage = document.getElementById('stage');
  const tFx = document.getElementById('toggleFx');
  const tBg = document.getElementById('toggleBg');

  tFx.onclick = () => {
    const on = tFx.getAttribute('aria-pressed') === 'true';
    tFx.setAttribute('aria-pressed', String(!on));
    tFx.textContent = 'Emergence FX: ' + (on ? 'OFF' : 'ON');
    fx.style.opacity = on ? '0' : '1';
  };

  tBg.onclick = () => {
    const on = tBg.getAttribute('aria-pressed') === 'true';
    tBg.setAttribute('aria-pressed', String(!on));
    tBg.textContent = 'Background: ' + (on ? 'dark' : 'checker');
    document.body.style.background = on
      ? ''
      : 'repeating-conic-gradient(#3a3350 0% 25%, #2a2640 0% 50%) 0 / 28px 28px';
  };

  // Restart both GIFs together so the loops line up.
  document.getElementById('resync').onclick = () => {
    [document.getElementById('portal'), fx].forEach(img => {
      const src = img.src.split('?')[0];
      img.src = src + '?t=' + Date.now();
    });
  };
</script>
</body>
</html>
